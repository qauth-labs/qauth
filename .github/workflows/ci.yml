name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.14.0
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx-cloud record -- echo Hello World
      - run: pnpm exec nx affected -t lint typecheck test build

      # Coverage gate: a single repo-wide vitest run enforces the global
      # thresholds in vitest.config.ts and fails CI on a regression. Run
      # separately from the affected per-project `test` targets (which write
      # per-project coverage dirs) so the threshold is evaluated once across
      # the whole fast unit suite. The Docker-backed integration suite (#167,
      # `*.integration.test.ts`) is excluded here, so no Postgres/Redis is
      # needed — the `integration` job below runs it instead.
      # `--reporter=default --reporter=json` keeps the human output AND emits the
      # machine report the conformance matrix joins against, so the suite is not
      # run twice (#400).
      - run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile.json=dist/vitest-report.json

      # Handed to the `conformance-matrix` job, which joins it with the wire
      # suite's report (#450). Deliberately NOT `if: always()`: when the suite
      # fails the report is partial, and a matrix on top of a real test failure
      # helps nobody. With no artifact the matrix job does not run at all.
      - name: Upload unit-suite report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: dist/vitest-report.json
          if-no-files-found: error

      # Issue-state drift guard (#399). The evidence-path half of
      # `status-claims.ts` runs inside the unit suite above; this half needs the
      # GitHub API, so it runs here.
      #
      # `if: always()` is deliberate. The check is about prose, not code, so a
      # failing test suite tells you nothing about whether the docs list a
      # closed issue as open work — and skipping it whenever something else is
      # red is how a claim stays stale for weeks. It cannot mask a real failure:
      # a red suite above already fails the job.
      #
      # Cadence note: per-PR, NOT on the spec pin log's quarterly cadence.
      # `#379` closed and `MVP-PRD.md` was wrong within 24 hours.
      - name: Issue-state claims are not stale
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/check-issue-state-claims.mts

  # The `main` job above can never exercise real DDL: every unit suite mocks the
  # repositories, and both vitest.config.ts and the coverage gate exclude
  # `*.integration.test.ts`. So the testcontainers suites are the ONLY assertion
  # that the generated migrations produce the schema the code expects — e.g. that
  # `authorization_codes.state`/`.nonce` are unbounded `text` and not the
  # varchar(255) that broke long opaque `state` (#316). Left unwired, a lost
  # migration file or a re-narrowed column would sail through a fully green CI.
  #
  # GitHub-hosted runners ship a Docker daemon, and `requireDockerOrSkip()`
  # fails rather than skips when `CI` is set, so this job cannot pass vacuously.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5

      # Affected-scoped like the main job: a change to the schema, the
      # migrations or the repositories marks infra-db affected and runs this;
      # a docs-only PR pays nothing. `auth-server` carries the same target since
      # #240 — its wallet-federation E2E boots the real server against
      # testcontainers Postgres + Redis, and it is the only place the OID4VP
      # flow, `acr` propagation and the password-login invariant are asserted
      # end to end.
      - run: pnpm exec nx affected -t test-integration

  # Stable-surface guard (#451, ADR-018 §5): a stable surface must not change
  # by accident. `scripts/stable-surface/check.mjs` reads the registry
  # `stable-surface/surfaces.json`, regenerates every surface and fails on
  # drift from the committed file, requires `x-qauth-stability` on every
  # OpenAPI operation, and compares each stable surface with the latest
  # release tag through oasdiff, failing on a break that
  # `stable-surface/approved-breaks.json` does not approve. The report and the
  # diff go to the job summary.
  #
  # `fetch-depth: 0` is load-bearing: the baseline is read with
  # `git show <tag>:<path>`, so the tags must be here. Deliberately NOT
  # affected-scoped, like docker-smoke: the generator boots the whole app, so
  # almost any change can move a surface. The timeout is the issue's budget.
  stable-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Pins what oasdiff reports as a break: one fixture per category of the
      # definition, and the changes that must pass. Run first, because a
      # differently-behaving oasdiff makes the real comparison meaningless.
      - name: Break rules match their fixtures
        run: node scripts/stable-surface/check.mjs --self-test

      # `--require-baseline`: a checkout that lost its tags fails here instead
      # of passing with nothing to compare.
      - name: Stable surface
        run: node scripts/stable-surface/check.mjs --require-baseline

  # Container boot smoke test — the guard for #370.
  #
  # Nothing above this job ever builds or runs the auth-server image, so the
  # whole class of "works in the workspace, dies in the container" defects was
  # invisible to CI. #370 was exactly that: `@qauth-labs/core-crypto` sat in
  # devDependencies while production source imported it. `nx build`, `nx test`
  # and `nx lint` all passed, because the dev workspace root hoists every
  # package. The image is assembled with `pnpm deploy --prod`, which strips
  # devDependencies, and runs the TypeScript sources under tsx — so the import
  # had nothing to resolve to and the container crash-looped on boot.
  #
  # This job builds the real image the same way docker-compose.yml does (repo
  # root as context, apps/auth-server/Dockerfile) and requires it to actually
  # come up and report healthy. Deliberately NOT affected-scoped: the image is
  # assembled from the lockfile and every workspace package, so almost any
  # change can break it, and "affected" cannot see a dependency-manifest edit
  # as reaching the container.
  #
  # The server boots only against a migrated database: its boot step reads and
  # writes the default realm (#484). The job runs the migration runner first,
  # as docker-compose.yml does, so it also checks that image.
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE: qauth/auth-server:smoke
      MIGRATION_IMAGE: qauth/migration-runner:smoke
      CONTAINER: qauth-auth-server-smoke
    services:
      # Mirrors docker-compose.yml. GitHub publishes service ports on the
      # runner's network namespace, which is why the container below joins it
      # with `--network host` and talks to both over localhost.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qauth
          POSTGRES_USER: qauth
          POSTGRES_PASSWORD: qauth_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qauth -d qauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # Same context and Dockerfiles as the `auth-server` and
      # `migration-runner` services in docker-compose.yml. BuildKit is required
      # for the Dockerfiles' `--mount=type=cache` pnpm-store mount.
      - name: Build auth-server and migration-runner images
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          docker build -f apps/auth-server/Dockerfile -t "$IMAGE" .
          docker build -f apps/migration-runner/Dockerfile -t "$MIGRATION_IMAGE" .

      - name: Run the migration runner
        run: >-
          docker run --rm --network host
          -e DATABASE_URL='postgresql://qauth:qauth_ci_password@localhost:5432/qauth'
          "$MIGRATION_IMAGE"

      - name: Start auth-server container
        run: |
          set -euo pipefail
          # Ephemeral EdDSA signing keypair — generated per run, never
          # persisted. Both halves are passed: the plugin only derives the
          # public key when JWT_PUBLIC_KEY is absent, and that derivation path
          # cannot export SPKI from a private key, so a real deployment always
          # supplies both (see .env.docker.example).
          jwt_private_key="$(openssl genpkey -algorithm ed25519)"
          jwt_public_key="$(printf '%s' "$jwt_private_key" | openssl pkey -pubout)"
          docker run -d \
            --name "$CONTAINER" \
            --network host \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e LOG_LEVEL=debug \
            -e DATABASE_URL='postgresql://qauth:qauth_ci_password@localhost:5432/qauth' \
            -e REDIS_URL='redis://localhost:6379/0' \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e JWT_PRIVATE_KEY="$jwt_private_key" \
            -e JWT_PUBLIC_KEY="$jwt_public_key" \
            -e JWT_ISSUER='http://localhost:3000' \
            -e SESSION_COOKIE_SECRET="$(openssl rand -base64 48)" \
            -e SESSION_COOKIE_SECURE=false \
            -e EMAIL_PROVIDER=mock \
            -e EMAIL_FROM_ADDRESS='noreply@qauth.dev' \
            -e EMAIL_BASE_URL='http://localhost:3000' \
            "$IMAGE"

      # The actual assertion. Fails fast if the container stops or restarts —
      # a boot crash like #370 exits the process, so waiting out the full
      # timeout would only slow the report down. /health reports `ok` only when
      # both Postgres and Redis answer, so this also proves the wiring.
      - name: Wait for /health to report healthy
        timeout-minutes: 3
        run: |
          set -uo pipefail
          for _ in $(seq 1 60); do
            running="$(docker inspect -f '{{.State.Running}}' "$CONTAINER")"
            restarts="$(docker inspect -f '{{.RestartCount}}' "$CONTAINER")"
            if [ "$running" != "true" ]; then
              exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER")"
              echo "::error::auth-server container stopped before becoming healthy (exit code ${exit_code})."
              exit 1
            fi
            if [ "$restarts" -gt 0 ]; then
              echo "::error::auth-server container restarted ${restarts} time(s) — it is crash-looping."
              exit 1
            fi
            body="$(curl -fsS --max-time 5 http://localhost:3000/health || true)"
            case "$body" in
              *'"status":"ok"'*)
                echo "auth-server is healthy: ${body}"
                exit 0
                ;;
            esac
            sleep 2
          done
          echo "::error::auth-server did not report healthy within the timeout. Last /health body: ${body:-<none>}"
          exit 1

      # Whatever went wrong, the next person needs the boot output. A missing
      # module or a failed env parse is printed here and nowhere else.
      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- docker inspect state ---"
          docker inspect -f '{{json .State}}' "$CONTAINER" || true
          echo "--- container logs ---"
          docker logs "$CONTAINER" 2>&1 || true

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  # Black-box wire suite — the guard for the wire promise (#450, ADR-018 §5).
  #
  # docker-smoke proves the image boots; this proves what a client sees over
  # HTTP. It builds the real auth-server and migration-runner images from this
  # commit, migrates a fresh Postgres, seeds the clients the suite uses, starts
  # the server and runs apps/wire-suite against it. The suite shares no code
  # with the server, so an encoding bug cannot hide on both sides at once.
  #
  # Not affected-scoped, for the same reason as docker-smoke: the image is
  # assembled from the lockfile and every workspace package, so almost any
  # change can break it.
  wire-suite:
    runs-on: ubuntu-latest
    env:
      SERVER_IMAGE: qauth/auth-server:wire
      MIGRATION_IMAGE: qauth/migration-runner:wire
      CONTAINER: qauth-auth-server-wire
      DATABASE_URL: postgresql://qauth:qauth_ci_password@localhost:5432/qauth
      # The issuer the server is configured with, and the base URL the suite
      # holds discovery to.
      QAUTH_BASE_URL: http://localhost:3000
    services:
      # Same services as docker-smoke; the containers below join the runner's
      # network with `--network host` and reach both over localhost.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qauth
          POSTGRES_USER: qauth
          POSTGRES_PASSWORD: qauth_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qauth -d qauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      # Only for the suite's own runner (Vitest, jose). The server runs from
      # the image, never from this install.
      - run: pnpm install --frozen-lockfile

      # Same context and Dockerfiles as docker-compose.yml.
      - name: Build auth-server and migration-runner images
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          docker build -f apps/auth-server/Dockerfile -t "$SERVER_IMAGE" .
          docker build -f apps/migration-runner/Dockerfile -t "$MIGRATION_IMAGE" .

      - name: Run the migration runner
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" "$MIGRATION_IMAGE"

      # The operator realm first, because the seed command provisions clients
      # into an existing realm only. Then the clients in
      # apps/wire-suite/seed/clients.json, through the same operator command a
      # deployment uses. It prints each generated secret once; the secret is
      # masked before anything is logged and handed to the suite through the
      # environment.
      - name: Seed the realm and the wire-suite clients
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U qauth -d qauth \
            -c "INSERT INTO realms (name) VALUES ('master') ON CONFLICT (name) DO NOTHING"
          seed_output="$(docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/apps/wire-suite/seed/clients.json:/seed/clients.json:ro" \
            --entrypoint pnpm "$MIGRATION_IMAGE" \
            nx run infra-db:db:seed-oauth-clients -- --manifest=/seed/clients.json)"
          secret="$(printf '%s\n' "$seed_output" \
            | awk '/^  wire-confidential$/ { found = 1; next } found && $1 == "secret:" { print $2; exit }')"
          if [ -z "$secret" ]; then
            echo "::error::The seed printed no secret for wire-confidential."
            printf '%s\n' "$seed_output" | grep -v 'secret:' || true
            exit 1
          fi
          echo "::add-mask::$secret"
          printf '%s\n' "$seed_output" | grep -E '^Seeded realm'
          {
            echo "QAUTH_WIRE_CLIENT_ID=wire-confidential"
            echo "QAUTH_WIRE_CLIENT_SECRET=$secret"
          } >> "$GITHUB_ENV"

      # As docker-smoke, plus raised rate limits: the defaults allow three
      # registrations and five logins per window per address, and every request
      # of the suite comes from one address. Raised, not disabled — the
      # rate-limit suite spends the registration budget and requires a 429.
      - name: Start auth-server container
        run: |
          set -euo pipefail
          jwt_private_key="$(openssl genpkey -algorithm ed25519)"
          jwt_public_key="$(printf '%s' "$jwt_private_key" | openssl pkey -pubout)"
          docker run -d \
            --name "$CONTAINER" \
            --network host \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e LOG_LEVEL=info \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL='redis://localhost:6379/0' \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e JWT_PRIVATE_KEY="$jwt_private_key" \
            -e JWT_PUBLIC_KEY="$jwt_public_key" \
            -e JWT_ISSUER="$QAUTH_BASE_URL" \
            -e SESSION_COOKIE_SECRET="$(openssl rand -base64 48)" \
            -e SESSION_COOKIE_SECURE=false \
            -e EMAIL_PROVIDER=mock \
            -e EMAIL_FROM_ADDRESS='noreply@qauth.dev' \
            -e EMAIL_BASE_URL="$QAUTH_BASE_URL" \
            -e RATE_LIMIT_MAX=10000 \
            -e REGISTRATION_RATE_LIMIT=100 \
            -e LOGIN_RATE_LIMIT=100 \
            "$SERVER_IMAGE"

      - name: Wait for /health to report healthy
        timeout-minutes: 3
        run: |
          set -uo pipefail
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "::error::auth-server container stopped before becoming healthy."
              exit 1
            fi
            case "$(curl -fsS --max-time 5 "$QAUTH_BASE_URL/health" || true)" in
              *'"status":"ok"'*) exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::auth-server did not report healthy within the timeout."
          exit 1

      # The JSON report is what the conformance matrix joins (#400), so a wire
      # test that cites a registered section counts as evidence for its row.
      - name: Run the wire suite
        timeout-minutes: 10
        env:
          QAUTH_WIRE_ALLOW_WRITES: '1'
        run: >-
          pnpm exec nx run wire-suite:run --
          --reporter=default --reporter=json
          --outputFile.json="$GITHUB_WORKSPACE/dist/wire-report.json"

      # `always()` so a red run still leaves its report behind.
      - name: Upload wire-suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wire-report
          path: dist/wire-report.json
          if-no-files-found: ignore

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs "$CONTAINER" 2>&1 || true

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  # Spec-conformance matrix (#400), joining the unit suite's report from `main`
  # and the wire suite's (#450). It runs only when both jobs passed: a failed
  # suite leaves a partial report, and matrix noise on top of a real test
  # failure helps nobody. The joiner itself exits 2 on a missing or empty
  # report, so neither suite can drop out of the evidence silently.
  conformance-matrix:
    runs-on: ubuntu-latest
    needs: [main, wire-suite]
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # No install: the joiner uses Node's standard library only.
      - uses: actions/download-artifact@v8
        with:
          name: vitest-report
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: wire-report
          path: dist

      - name: Spec conformance matrix
        run: pnpm spec-matrix

      # `always()` so a partial artifact survives a gate failure — the matrix is
      # most useful precisely when it is red.
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-conformance-matrix
          path: dist/conformance/
          if-no-files-found: ignore

  # Developer-portal boot smoke test.
  #
  # The portal's production server is a small srvx entry of our own
  # (apps/developer-portal/src/node-entry.ts) in front of TanStack Start's server
  # entry, which it reaches through a Start-internal virtual module. A Start or
  # Vite upgrade can break that wiring while `nx build` stays green, and the
  # image's HEALTHCHECK only proves that the port accepts connections. So this
  # job builds the real image and checks real responses: the login page renders,
  # a hashed asset is served as immutable, and a missing asset is a plain 404
  # that nothing may cache for a year. Not affected-scoped, for the same reason
  # as docker-smoke.
  portal-smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE: qauth/developer-portal:smoke
      CONTAINER: qauth-developer-portal-smoke
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # Same context and Dockerfile as the `developer-portal` service in
      # docker-compose.yml.
      - name: Build developer-portal image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -f apps/developer-portal/Dockerfile -t "$IMAGE" .

      # No auth-server runs here: the login page renders without calling it.
      # AUTH_SERVER_URL points at a closed port, so a page that did call it
      # would fail instead of passing by accident.
      - name: Start developer-portal container
        run: |
          set -euo pipefail
          docker run -d \
            --name "$CONTAINER" \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e AUTH_SERVER_URL='http://127.0.0.1:9' \
            -e PORTAL_SESSION_SECRET="$(openssl rand -base64 48)" \
            "$IMAGE"

      - name: Check the login page and static assets
        timeout-minutes: 3
        run: |
          set -uo pipefail
          base=http://localhost:3001
          page="$RUNNER_TEMP/login.html"
          status=''
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER")"
              echo "::error::developer-portal container stopped before serving (exit code ${exit_code})."
              exit 1
            fi
            status="$(curl -s -o "$page" -w '%{http_code}' --max-time 5 "$base/login" || true)"
            [ "$status" = "200" ] && break
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "::error::GET /login returned ${status:-no response}, expected 200."
            exit 1
          fi
          if ! grep -aq 'Log in to your account' "$page"; then
            echo "::error::GET /login returned 200 but not the login page."
            exit 1
          fi
          asset="$(grep -ao '/assets/[^"]*\.js' "$page" | head -n 1)"
          if [ -z "$asset" ]; then
            echo "::error::The login page references no /assets/*.js file."
            exit 1
          fi
          hit="$(curl -s -D - -o /dev/null --max-time 5 "$base$asset")"
          if ! printf '%s' "$hit" | head -n 1 | grep -q ' 200'; then
            echo "::error::GET $asset did not return 200."
            exit 1
          fi
          if ! printf '%s' "$hit" | grep -qi '^cache-control:.*immutable'; then
            echo "::error::GET $asset is not served as immutable."
            exit 1
          fi
          miss="$(curl -s -D - -o /dev/null --max-time 5 "$base/assets/portal-smoke-missing.js")"
          if ! printf '%s' "$miss" | head -n 1 | grep -q ' 404'; then
            echo "::error::A missing asset did not return 404."
            exit 1
          fi
          if printf '%s' "$miss" | grep -qi '^cache-control:.*immutable'; then
            echo "::error::A missing asset's 404 is marked immutable and would be cached for a year."
            exit 1
          fi
          echo "developer-portal serves /login, $asset and a 404 for a missing asset."

      # The portal reads at most 1 MiB of a request body (src/node-entry.ts).
      # A 2 MiB POST that declares its length must be refused with 413; a 2 MiB
      # chunked POST to a real server function (the login one, whose id is in
      # the login page's script) must be cut off at the limit; and the server
      # must go on serving.
      - name: Check an oversized request body is refused
        timeout-minutes: 2
        run: |
          set -uo pipefail
          base=http://localhost:3001
          body="$RUNNER_TEMP/oversized-body.bin"
          head -c 2097152 /dev/zero > "$body"
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' --data-binary "@$body" \
            "$base/_serverFn/portal-smoke-oversized" || true)"
          if [ "$status" != "413" ]; then
            echo "::error::A 2 MiB POST returned ${status:-no response}, expected 413."
            exit 1
          fi
          login_js="$(curl -s --max-time 5 "$base/login" | grep -ao '/assets/login-[^"]*\.js' | head -n 1)"
          fn="$(curl -s --max-time 5 "$base$login_js" | grep -ao '[0-9a-f]\{64\}' | head -n 1)"
          if [ -z "$login_js" ] || [ -z "$fn" ]; then
            echo "::error::Could not find the login server function id in the login page's script."
            exit 1
          fi
          out="$(head -c 2097152 /dev/zero | curl -s --max-time 30 -X POST \
            -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' \
            -H 'Transfer-Encoding: chunked' -T - "$base/_serverFn/$fn" || true)"
          if ! printf '%s' "$out" | grep -q 'exceeds the maximum allowed size'; then
            echo "::error::A 2 MiB chunked POST to a server function was not cut off at the body limit."
            exit 1
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
            echo "::error::developer-portal container stopped after a 2 MiB POST."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$base/login" || true)"
          if [ "$status" != "200" ]; then
            echo "::error::GET /login returned ${status:-no response} after a 2 MiB POST, expected 200."
            exit 1
          fi
          echo "developer-portal refused 2 MiB bodies (413; chunked cut off at the limit) and still serves /login."

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- container logs ---"
          docker logs "$CONTAINER" 2>&1 || true

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER" || true
