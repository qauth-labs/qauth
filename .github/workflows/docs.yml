name: Docs Site Deploy

# Builds and deploys the QAuth documentation site (docs.qauth.dev):
# a production deploy on every push to main, a preview deploy on every
# pull request. See apps/docs-site/README.md for the full picture.
#
# The path filters below are NOT `apps/docs-site/**` alone. Task 10 (#356)
# made `apps/docs-site/src/content.config.ts`'s `records` collection load
# `docs/adr/*.md` and `docs/security/*.md` directly off disk via a `glob()`
# loader (and `apps/docs-site/src/lib/records.ts` reads the same two
# directories a second, independent time for the records index page) — both
# render into the site without anything under `apps/docs-site/` changing. A
# filter of `apps/docs-site/**` alone would let an ADR edit go live on
# GitHub while the deployed site quietly stays stale. See the Task 11
# report for how this was derived and which changed-file examples were
# traced through it.
on:
  push:
    branches:
      - main
    # Spelled out longhand in both places on purpose. A YAML anchor/alias pair
    # (`&docs-site-inputs` / `*docs-site-inputs`) is valid YAML but GitHub's
    # workflow parser rejects it outright ("Anchors are not currently
    # supported"), which makes the whole file unparseable and the workflow
    # never runs. Keep the two lists identical by hand.
    paths:
      - 'apps/docs-site/**'
      - 'docs/adr/**'
      - 'docs/security/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs-site/**'
      - 'docs/adr/**'
      - 'docs/security/**'
      - '.github/workflows/docs.yml'
  # Manual escape hatch: the path filters above are the build's true content
  # inputs, not every possible influence on the built output (a root
  # dependency bump in package.json/pnpm-lock.yaml, for instance, changes
  # nothing the filters watch). Re-run this from the Actions tab after a
  # change like that, or to redeploy without a matching content change.
  workflow_dispatch: {}

# Read-only checkout is all this job needs — it deploys via the Netlify CLI
# using NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID, not the GitHub API, so there is
# nothing here to write back to the repo.
permissions:
  contents: read

# A manual workflow_dispatch run and a push/pull_request run share no
# `github.ref`-derived identity worth serializing against each other, so
# only push/pull_request runs are grouped. Newer commits on the same PR (or
# the same branch) cancel an in-flight deploy of an older commit rather than
# letting two uploads race to publish the same preview/production target
# out of order.
concurrency:
  group: docs-deploy-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Same guard the site's own drift checks provide locally: a broken
      # link, a bad anchor, or missing endpoint coverage fails here instead
      # of publishing.
      - run: pnpm exec nx test docs-site

      - run: pnpm exec nx build docs-site

      # Fail loudly and stop before spending a build's output on a deploy
      # attempt that can't authenticate. Both secrets are unset in this repo
      # today; a silent partial deploy (or the CLI hanging on an interactive
      # prompt neither secret is there to answer) is worse than a clear,
      # named failure here.
      - name: Verify Netlify secrets are configured
        # Scoped to exactly the two conditions below that actually attempt a
        # deploy. A `workflow_dispatch` run on a non-main branch deploys
        # nothing (see the last step), so it must not fail here over secrets
        # it will never need. Fork pull requests are excluded for the same
        # reason: GitHub withholds secrets from them, so they can never have
        # these two and never reach the preview step below — failing them here
        # would throw away an external contributor's passing test and build
        # results over a condition they cannot fix.
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true) || github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=()
          [ -z "$NETLIFY_AUTH_TOKEN" ] && missing+=("NETLIFY_AUTH_TOKEN")
          [ -z "$NETLIFY_SITE_ID" ] && missing+=("NETLIFY_SITE_ID")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. Configure them in the repository's Actions secrets before this workflow can deploy." >&2
            exit 1
          fi

      - name: Deploy preview (pull request)
        # Non-fork pull requests only: a fork-originated `pull_request` run gets
        # no repository secrets, so NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID below
        # would both be empty and the deploy would hard-fail (or hang on an
        # interactive prompt). Fork PRs still get the test and build gates
        # above; they just publish no preview.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm dlx netlify-cli@27.0.0 deploy \
            --dir=dist/apps/docs-site \
            --message="Deploy preview for PR #${{ github.event.pull_request.number }} (${{ github.sha }})"

      - name: Deploy production (main)
        # `push` is already branch-restricted to main above (`on.push.branches`),
        # but `workflow_dispatch` carries no such restriction — it can be run
        # against any branch from the Actions tab — so the ref is checked
        # explicitly here too, rather than trusting the triggering event alone.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm dlx netlify-cli@27.0.0 deploy \
            --prod \
            --dir=dist/apps/docs-site \
            --message="Production deploy from ${{ github.sha }}"

      - name: Manual run on a non-main branch (no deploy)
        # A workflow_dispatch run against anything other than main builds and
        # tests (both steps above already ran) but intentionally does not
        # deploy: it's not a pull request (no preview target) and it's not
        # main (no production target), so there is nothing correct to
        # publish to. Named and explicit rather than silently matching no
        # `if:` and vanishing from the run summary unexplained.
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::notice::Manual run on '${{ github.ref_name }}', not main — build and tests passed, but nothing was deployed (no preview or production target applies)."
