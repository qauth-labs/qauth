# Container images of a QAuth release (ADR-018 §6, REL-00 #737).
#
# A release tag vX.Y.Z or vX.Y.Z-rc.N builds the auth server and the
# migration runner once, pushes each to GHCR by digest, signs that digest with
# cosign (keyless, through this workflow's OIDC identity) and attaches a
# build-provenance and an SPDX SBOM attestation to it. The job summary lists
# every digest; deployments pin the digest, not the tag.
#
# Tags: X.Y.Z always, and X.Y for a stable X.Y.Z. A release candidate gets
# only its own X.Y.Z-rc.N, so it never moves a stable tag. There is no
# `latest` before 1.0.
#
# The developer portal is not published: its Dockerfile bakes
# VITE_AUTH_SERVER_URL into the client bundle at build time (default
# http://localhost:3000), so one image cannot serve another host.
#
# The same tag starts release-npm.yml, which stages every SDK package at the
# same version: one tag releases QAuth's images and packages together.
#
# Releases are the maintainer's: the publish job runs in the `release`
# environment, which holds it for a required reviewer. A pull request that
# changes this file, and a manual run, build both images and push nothing.
name: release-images

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version comes from the tag alone. Package versions stay 0.0.0 in the
  # workspace; the CHANGELOG section is the release's record.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the version from the tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] || [ "$REF_TYPE" != tag ]; then
            # A dry run: a version no release can have.
            {
              echo "version=0.0.0-dryrun"
              echo "tags=0.0.0-dryrun"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "::error::$REF_NAME is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)"
            exit 1
          fi
          version="${REF_NAME#v}"
          tags="$version"
          case "$version" in
            *-rc.*) ;;
            *)
              # A stable release must already have its CHANGELOG section;
              # release candidates have none (v0.1.0-rc.0 to rc.3 had none).
              if ! grep -Fq "## [$version]" CHANGELOG.md; then
                echo "::error::CHANGELOG.md has no '## [$version]' section"
                exit 1
              fi
              tags="$tags ${version%.*}"
              ;;
          esac
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  # Builds both images without credentials and pushes nothing.
  dry-run:
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [auth-server, migration-runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: true
      matrix:
        image: [auth-server, migration-runner]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      NAME: ${{ matrix.image }}
      IMAGE: ghcr.io/qauth-labs/qauth/${{ matrix.image }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Image tags and OCI labels
        env:
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo 'EOF'
            echo 'labels<<EOF'
            echo "org.opencontainers.image.title=qauth-$NAME"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$REVISION"
            echo "org.opencontainers.image.source=$SOURCE"
            echo "org.opencontainers.image.url=$SOURCE"
            echo "org.opencontainers.image.documentation=https://docs.qauth.dev/operate/images/"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            echo "org.opencontainers.image.created=$(git log -1 --format=%cI)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit's own provenance and SBOM are off: the attestations below are
      # bound to the pushed digest and verifiable with `gh attestation verify`.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          # The auth server's OpenAPI `info.version`; the migration runner has no use for it.
          build-args: QAUTH_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image by its digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      - name: Digest in the job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### qauth/$NAME $VERSION"
            echo
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo "- Tags: $TAGS"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/qauth-labs/qauth/.github/workflows/release-images.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo qauth-labs/qauth"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
