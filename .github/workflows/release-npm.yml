# npm releases of the SDK packages (#596, ADR-018 §6).
#
# Every pull request packs each SDK in libs/sdk/ as it would be published,
# checks the tarball (file list, contents, manifest) and installs it into an
# empty project, where every entry point must import and type-check. Nothing is
# published.
#
# A tag <project>@<version> (written by `nx release`, pushed by a maintainer)
# packs that one SDK the same way, then stages it on npm through trusted
# publishing (OIDC, no token) in the `npm` environment. npm attaches
# provenance on its own. A release candidate (X.Y.Z-rc.N) goes to the `next`
# dist-tag, a release to `latest`. A staged version goes live only when a
# maintainer approves it on npmjs.com with 2FA, and the run leaves a draft
# release with the tarball for the maintainer to publish. See RELEASING.md.
name: release-npm

on:
  push:
    tags: ['*@*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Packages are built from their own sources, never from a cached result.
  NX_NO_CLOUD: 'true'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: plan
        name: What to pack, and whether to publish
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            plan="$(node scripts/sdk-release/plan.mjs tag "$REF_NAME")"
          else
            plan="$(node scripts/sdk-release/plan.mjs all)"
          fi
          echo "$plan"
          echo "publish=$(node -p 'JSON.parse(process.argv[1]).publish' "$plan")" >> "$GITHUB_OUTPUT"
          echo "packages=$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).packages)' "$plan")" >> "$GITHUB_OUTPUT"

  pack:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PROJECT: ${{ matrix.package.project }}
      VERSION: ${{ matrix.package.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build the npm output (ESM and declarations in dist/)
        run: pnpm exec nx run "$PROJECT:build-npm" --skip-nx-cache
      - id: pack
        name: Pack it as npm will receive it
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          pnpm --dir "libs/sdk/$PROJECT" pack --pack-destination "$out"
          tarball="$(ls "$out"/*.tgz)"
          (cd "$out" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Check the file list, the contents and the manifest
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/sdk-release/check-package.mjs "$TARBALL" "libs/sdk/$PROJECT" "$VERSION"
      - name: Install it into an empty project, import and type-check it
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/sdk-release/smoke.mjs "$TARBALL" "libs/sdk/$PROJECT" node_modules/typescript/bin/tsc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.package.project }}
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, pack]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      DIST_TAG: ${{ matrix.package.distTag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-${{ matrix.package.project }}
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing through OIDC
        run: npm install --global npm@11.21.0
      - name: The tarball is the one the pack job checked
        working-directory: pack
        run: sha256sum --check ./*.sha256
      - name: Stage it on npm; a maintainer approves it there, with 2FA
        working-directory: pack
        run: npm stage publish ./*.tgz --tag "$DIST_TAG" --access public

  draft-release:
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PROJECT: ${{ matrix.package.project }}
      VERSION: ${{ matrix.package.version }}
      DIST_TAG: ${{ matrix.package.distTag }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-${{ matrix.package.project }}
          path: pack
      - name: Draft the release with the tarball and its changelog section
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 || index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' "libs/sdk/$PROJECT/CHANGELOG.md" > notes.md
          {
            echo
            echo "Staged on npm as \`$VERSION\` (dist-tag \`$DIST_TAG\`), with provenance."
            echo "It goes live when a maintainer approves the stage on npmjs.com with 2FA;"
            echo "publish this draft after that."
          } >> notes.md
          prerelease=()
          case "$VERSION" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" pack/*.tgz pack/*.sha256 \
            --draft --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
