# npm releases of the SDK packages (#596, ADR-018 §6).
#
# The SDKs carry QAuth's own version. The tag that releases QAuth, vX.Y.Z or
# vX.Y.Z-rc.N, also starts this workflow (the images come from
# release-images.yml on the same tag). Every SDK in libs/sdk/ is packed at that
# version, which the pack job writes into the package before packing; the
# workspace package.json files stay at 0.0.0, so the tag is the only place a
# version is decided. Each tarball is checked (file list, contents, manifest)
# and installed into an empty project, where every entry point must import and
# type-check. Then, in the `npm` environment, it is staged on npm through
# trusted publishing (OIDC, no token); npm attaches provenance on its own. A
# release candidate goes to the `next` dist-tag, a release to `latest`. A
# staged version goes live only when a maintainer approves it on npmjs.com
# with 2FA. The run leaves one draft release with every tarball and QAuth's
# CHANGELOG section as its notes. See RELEASING.md.
#
# Every pull request packs, stamps, checks and installs the same way as a dry
# run, at the newest version CHANGELOG.md names, and publishes nothing.
#
# npm's trusted publisher for each @qauth-labs SDK names this file:
# release-npm.yml, environment npm.
name: release-npm

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Packages are built from their own sources, never from a cached result.
  NX_NO_CLOUD: 'true'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: plan
        name: The version every SDK is packed at, and whether to publish
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            plan="$(node scripts/sdk-release/plan.mjs tag "$REF_NAME")"
          else
            plan="$(node scripts/sdk-release/plan.mjs dry-run)"
          fi
          echo "$plan"
          field() { node -p "const v = JSON.parse(process.argv[1])[process.argv[2]]; typeof v === 'string' ? v : JSON.stringify(v)" "$plan" "$1"; }
          {
            echo "publish=$(field publish)"
            echo "version=$(field version)"
            echo "dist-tag=$(field distTag)"
            echo "packages=$(field packages)"
          } >> "$GITHUB_OUTPUT"

  pack:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PROJECT: ${{ matrix.package.project }}
      VERSION: ${{ matrix.package.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build the npm output (ESM and declarations in dist/)
        run: pnpm exec nx run "$PROJECT:build-npm" --skip-nx-cache
      - name: Stamp QAuth's version into the package (this checkout only)
        working-directory: libs/sdk/${{ matrix.package.project }}
        run: npm pkg set version="$VERSION"
      - id: pack
        name: Pack it as npm will receive it
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          pnpm --dir "libs/sdk/$PROJECT" pack --pack-destination "$out"
          tarball="$(ls "$out"/*.tgz)"
          (cd "$out" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Check the file list, the contents and the manifest (version included)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/sdk-release/check-package.mjs "$TARBALL" "libs/sdk/$PROJECT" "$VERSION"
      - name: Install it into an empty project, import and type-check it
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/sdk-release/smoke.mjs "$TARBALL" "libs/sdk/$PROJECT" node_modules/typescript/bin/tsc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.package.project }}
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, pack]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      DIST_TAG: ${{ matrix.package.distTag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-${{ matrix.package.project }}
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing through OIDC
        run: npm install --global npm@11.21.0
      - name: The tarball is the one the pack job checked
        working-directory: pack
        run: sha256sum --check ./*.sha256
      - name: Stage it on npm; a maintainer approves it there, with 2FA
        working-directory: pack
        run: npm stage publish ./*.tgz --tag "$DIST_TAG" --access public

  # One draft release per tag, with every SDK tarball and QAuth's notes.
  draft-release:
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-*
          merge-multiple: true
          path: pack
      - name: Draft the release with the SDK tarballs and QAuth's changelog section
        run: |
          set -euo pipefail
          node scripts/sdk-release/notes.mjs "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo
            echo "The SDK packages are staged on npm as \`$VERSION\` (dist-tag \`$DIST_TAG\`), with"
            echo "provenance. They go live when a maintainer approves each stage on npmjs.com"
            echo "with 2FA; publish this draft after that. The server images and their digests"
            echo "are in the release-images run of the same tag."
          } >> notes.md
          prerelease=()
          case "$VERSION" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" pack/*.tgz pack/*.sha256 \
            --draft --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
