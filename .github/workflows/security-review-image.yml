name: Security-review image

# Builds tools/security-review/Dockerfile and proves its one promise: once
# built, the image runs QAuth with NO network. `docker run --network none`
# starts PostgreSQL, Redis, the migrations and the auth-server inside the
# container and requires /health to report ok.
#
# Path-filtered, because the image only changes when its own files or the
# dependency manifests do. The weekly run catches drift the filter cannot see,
# such as a base-image or apt change.
on:
  pull_request:
    paths:
      - 'tools/security-review/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/security-review-image.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the review image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -f tools/security-review/Dockerfile -t qauth-review .

      - name: Start the stack with no network
        run: docker run --rm --network none qauth-review tools/security-review/start-stack.sh --check
