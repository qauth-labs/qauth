# QAuth reference reverse proxy (ADR-019 Decisions 1, 5 and 8).
#
# The rules this configuration follows are listed, proxy-neutrally, in the
# operator docs (apps/docs-site/src/content/docs/operate/reverse-proxy.md), so
# another proxy can follow them. test/reference-proxy.integration.test.ts runs
# this file, unchanged, in front of stub upstreams and checks each rule.
#
# Layout inside the container:
#   /etc/nginx/nginx.conf          this file
#   /etc/nginx/qauth/              QAuth's rules; do not edit
#   /etc/nginx/site/upstreams.conf where the auth server and the ceremony app listen
#   /etc/nginx/site/realms.conf    the realm hosts and their certificates
#   /etc/nginx/certs/              certificates, mounted as files

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /var/log/nginx/access.log;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Routing reads nginx's normalised path ($uri): percent-escapes decoded,
    # dot segments resolved and, with merge_slashes, repeated slashes merged.
    # Prefix locations match case-sensitively. Both upstreams receive that
    # normalised path, re-escaped, never the raw request target, so neither
    # can read a path differently from the way it was routed.
    merge_slashes on;

    # A path separator in disguise: an encoded slash, or a backslash, raw or
    # encoded. nginx decodes `%2F` into a separator before it resolves dot
    # segments, so `/ui/..%2Foauth` would route as `/oauth` and
    # `/x/..%2Fui/login` as `/ui/login`; RFC 3986 normalisation keeps `%2F`
    # encoded, so no normalised path holds one. A WHATWG URL parser, which a
    # web framework behind the proxy may use, reads `\` as `/`, so the app
    # would see another path than the one routed. Browsers never send either.
    # Every realm host answers such a request 404 (qauth/realm.conf). The
    # query is not checked. (`\x5c` is the backslash: a bare one in an nginx
    # string escapes the next character.)
    map $request_uri $qauth_disguised_separator {
        "~*^[^?]*(?:%2f|%5c|\x5c)"  1;
        default                     0;
    }

    # Cache-Control on /ui/* (ADR-019 Decision 5, amended 2026-10-22). Every
    # answer is `no-store`, except a content-hashed static file of the
    # ceremony app: a 200 or 304 answer to a GET or HEAD, with no Set-Cookie,
    # whose path matches the asset pattern below. Anything that does not match
    # falls back to `no-store`. The pattern ends in `\z`, not `$`: in PCRE `$`
    # also matches before a final newline, which `%0A` decodes to.
    map $request_method $qauth_ui_cacheable_method {
        GET      1;
        HEAD     1;
        default  0;
    }

    map $status $qauth_ui_cacheable_status {
        200      1;
        304      1;
        default  0;
    }

    map $upstream_http_set_cookie $qauth_ui_sets_no_cookie {
        ""       1;
        default  0;
    }

    map "$qauth_ui_cacheable_method$qauth_ui_cacheable_status$qauth_ui_sets_no_cookie$uri" $qauth_ui_cache_control {
        "~^111/ui/assets/(?:[A-Za-z0-9._-]+-)?[A-Za-z0-9_-]{8,}\.(?:js|mjs|css|woff2|woff|svg|png|jpg|jpeg|gif|webp|avif|ico)\z"  "public, max-age=31536000, immutable";
        default  "no-store";
    }

    include /etc/nginx/site/upstreams.conf;

    # Any host that is not a realm host: 421 Misdirected Request, with no
    # realm context. Only the health endpoints, which carry no realm data,
    # answer here. TLS needs a certificate even for the refusal; this one is
    # the realm certificate, as no other host is served.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location = /health {
            include /etc/nginx/qauth/proxy-headers.conf;
            proxy_pass http://qauth_auth_server/health;
        }

        location = /ready {
            include /etc/nginx/qauth/proxy-headers.conf;
            proxy_pass http://qauth_auth_server/ready;
        }

        location / {
            return 421;
        }
    }

    include /etc/nginx/site/realms.conf;
}
