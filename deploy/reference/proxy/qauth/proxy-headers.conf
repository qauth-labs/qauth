# Request headers for every proxied location.
#
# A location that sets any proxy_set_header of its own inherits none from the
# levels above it, so each proxied location includes this file instead of
# relying on inheritance.

proxy_http_version 1.1;
proxy_set_header Connection "";

# The host the client asked for, lower case and without a port. The auth
# server finds the realm by it (ADR-019 Decision 1).
proxy_set_header Host $host;

# This proxy is the first hop. What a client sent in these headers is
# replaced, never passed on or appended to, so a client cannot choose its
# address, its realm or its scheme. The auth server believes them only from
# an address listed in its TRUST_PROXY, which names this proxy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# The standard form of the same claims (RFC 7239). QAuth does not read it, so
# it is removed rather than rewritten, and a client value never passes.
proxy_set_header Forwarded "";
