# Request headers for every proxied location.
#
# A location that sets any proxy_set_header of its own inherits none from the
# levels above it, so each proxied location includes this file instead of
# relying on inheritance.

proxy_http_version 1.1;
proxy_set_header Connection "";

# The host the client asked for, lower case and without a port. The auth
# server finds the realm by it (ADR-019 Decision 1).
proxy_set_header Host $host;

# This proxy is the first hop. What a client sent in these headers is
# replaced, never passed on or appended to, so a client cannot choose its
# address, its realm or its scheme. The auth server believes them only from
# an address listed in its TRUST_PROXY, which names this proxy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# The standard form of the same claims (RFC 7239), and the other headers a
# proxy or a web framework may take as the client's address, port, path
# prefix or original URL. QAuth reads none of them, so they are removed
# rather than rewritten, and a client value never passes. nginx omits a
# header set to "".
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

# An upstream cannot steer nginx. Without this, an X-Accel-Redirect from the
# ceremony app would make nginx fetch another location internally: the auth
# server would get the client's cookies, and its answer would reach the client
# under the /ui/* path without the ceremony headers. The X-Accel-* headers
# never reach the client either way; nginx hides them by default.
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
