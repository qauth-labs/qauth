# The rules for a realm host (ADR-019 Decisions 1, 5 and 8).
#
# Include this file in every server block that names realm hosts
# (site/realms.conf). Do not edit it: these are QAuth's rules, and
# test/reference-proxy.integration.test.ts checks each one.
#
# Locations match nginx's normalised path ($uri, see nginx.conf). A request
# that a path variant would send the wrong way is refused here, so it reaches
# neither the auth server nor the ceremony app.

# An encoded slash or a backslash anywhere in the path (see
# $qauth_disguised_separator in nginx.conf).
if ($qauth_disguised_separator) {
    return 404;
}

# Never public. The metrics endpoint and the internal API answer on the
# internal network only, and their case and path-parameter variants are
# refused with them.
location ~* ^/(?:metrics|internal)(?:$|[^a-z0-9_-]) {
    return 404;
}

# A path that looks like /ui but is not /ui/ after normalisation: /ui itself,
# a case variant such as /UI/ or /Ui/, and a path parameter such as /ui;x.
# The exact /ui/ prefix below is a `^~` location, so it never reaches this
# regular expression.
location ~* ^/ui(?:$|[^a-z0-9_-]) {
    return 404;
}

# /ui exactly. Without this, nginx answers it with a 301 to /ui/ before it
# tries the regular expression above, because the /ui/ prefix proxies.
location = /ui {
    return 404;
}

# The ceremony app, on the realm origin under /ui/ (Decision 5).
location ^~ /ui/ {
    include /etc/nginx/qauth/proxy-headers.conf;

    # The ceremony app never sees QAuth's cookies, so it can neither read nor
    # mint a session-bound value (Decision 6). nginx omits a header set to "".
    proxy_set_header Cookie "";

    # The baseline headers of every ceremony page. Whatever the app sent is
    # dropped and replaced, on every answer, errors and nginx's own included
    # (`always`), so a replacement app cannot loosen them.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;

    # Scripts, styles and everything else from the realm origin only, no
    # inline script or style, and no framing.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $qauth_ui_cache_control always;

    proxy_pass http://qauth_ceremony_app/ui/;
}

# Everything else goes to the auth server.
location / {
    include /etc/nginx/qauth/proxy-headers.conf;
    proxy_pass http://qauth_auth_server/;
}
