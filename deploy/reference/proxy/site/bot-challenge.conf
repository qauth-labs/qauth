# The script hosts of a hosted bot challenge provider (ADR-019 Decision 5,
# #643), per realm host. Empty by default: no ceremony page runs a
# third-party script, and the built-in proof of work needs none.
#
# Name them only when the auth server runs BOT_CHALLENGE_PROVIDER=hosted, as
# a list of https host sources separated by spaces, for example
#
#     auth.example.com  "https://challenges.cloudflare.com";
#
# The proxy adds them to the script and frame sources of the interaction
# page (/ui/interaction/*), where a person signs in and signs up, and to no
# other path. That page also serves a password reset, consent and the logout
# confirmation, which share its URL, so they get the hosts too. By naming
# them you accept that the provider's script runs where passwords are typed:
# there it joins the realm's trusted computing base. A value that is not
# such a list is dropped (nginx.conf).

map $host $qauth_bot_challenge_hosts {
    default  "";
}
