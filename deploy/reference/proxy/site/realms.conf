# The realm hosts. Name every realm's host in `server_name`; a host that is
# not listed here gets 421 (nginx.conf). The names below are examples.
#
# One certificate whose names cover every host listed here, mounted as files.
# For a certificate per host, copy this block once per host, with that host's
# `server_name` and certificate paths, and keep the include.

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com login.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/qauth/realm.conf;
}
