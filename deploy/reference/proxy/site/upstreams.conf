# Where the auth server and the ceremony app listen. Edit the addresses for
# your deployment; keep the upstream names, which qauth/*.conf uses.
#
# nginx resolves these names once, at start, so the services must be
# resolvable then.

upstream qauth_auth_server {
    server auth-server:3000;
    keepalive 16;
}

# The reference ceremony app has not shipped yet; this is the address it is
# expected at. Until it ships the auth server renders /ui/* itself.
upstream qauth_ceremony_app {
    server ceremony-app:3000;
    keepalive 16;
}
