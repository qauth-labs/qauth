services:
  postgres:
    image: postgres:18-alpine
    container_name: qauth-postgres
    environment:
      POSTGRES_DB: qauth
      POSTGRES_USER: qauth
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qauth_dev_password}
    volumes:
      # Mount the parent directory, NOT `/var/lib/postgresql/data`. Postgres 18
      # images default PGDATA to a version-scoped subdirectory
      # (`/var/lib/postgresql/18/docker`) so that `pg_upgrade --link` can run
      # without crossing a mount boundary, and the entrypoint aborts on startup
      # if it finds a volume mounted at the pre-18 path. The testcontainers
      # helper in libs/shared/testing pins the same image but mounts no volume,
      # so integration tests do not exercise this.
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qauth -d qauth']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qauth-network

  redis:
    image: redis:7-alpine
    container_name: qauth-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qauth-network

  migration-runner:
    build:
      context: .
      dockerfile: apps/migration-runner/Dockerfile
    container_name: qauth-migration-runner
    environment:
      DATABASE_URL: postgresql://qauth:${DB_PASSWORD:-qauth_dev_password}@postgres:5432/qauth
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qauth-network
    # This is a one-time job, exits after migrations complete
    restart: 'no'

  auth-server:
    build:
      context: .
      dockerfile: apps/auth-server/Dockerfile
    container_name: qauth-auth-server
    environment:
      # Database
      DATABASE_URL: postgresql://qauth:${DB_PASSWORD:-qauth_dev_password}@postgres:5432/qauth
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-30000}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-2000}

      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES:-3}
      REDIS_CONNECTION_TIMEOUT: ${REDIS_CONNECTION_TIMEOUT:-10000}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-5000}

      # JWT (from .env file)
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:3000}
      ACCESS_TOKEN_LIFESPAN: ${ACCESS_TOKEN_LIFESPAN:-900}
      REFRESH_TOKEN_LIFESPAN: ${REFRESH_TOKEN_LIFESPAN:-604800}

      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Auth
      DEFAULT_REALM_NAME: ${DEFAULT_REALM_NAME:-master}
      SYSTEM_CLIENT_ID: ${SYSTEM_CLIENT_ID:-system}
      # HMAC secret signing the __Host-qauth_session cookie. REQUIRED in
      # production (the env schema rejects the dev default when NODE_ENV=production).
      # Generate with: openssl rand -base64 48
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      SESSION_COOKIE_TTL: ${SESSION_COOKIE_TTL:-86400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Require a verified email before password login (default: false, MVP).
      REQUIRE_EMAIL_VERIFIED: ${REQUIRE_EMAIL_VERIFIED:-false}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-3}
      REGISTRATION_RATE_WINDOW: ${REGISTRATION_RATE_WINDOW:-3600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-900}

      # Password
      PASSWORD_MEMORY_COST: ${PASSWORD_MEMORY_COST:-65536}
      PASSWORD_TIME_COST: ${PASSWORD_TIME_COST:-3}
      PASSWORD_PARALLELISM: ${PASSWORD_PARALLELISM:-4}
      PASSWORD_MIN_SCORE: ${PASSWORD_MIN_SCORE:-2}

      # Email
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@qauth.dev}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-QAuth}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_TOKEN_EXPIRY: ${EMAIL_VERIFICATION_TOKEN_EXPIRY:-86400}
      EMAIL_VERIFICATION_INVALIDATE_EXISTING_ON_RESEND: ${EMAIL_VERIFICATION_INVALIDATE_EXISTING_ON_RESEND:-true}
      # Resend provider (only needed if EMAIL_PROVIDER=resend)
      # RESEND_API_KEY: ${RESEND_API_KEY}
      # SMTP provider (only needed if EMAIL_PROVIDER=smtp)
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_SECURE: ${SMTP_SECURE}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}

      # CORS — fail-closed in production when unset (no wildcard default). Set
      # CORS_ORIGIN explicitly to allow cross-origin callers (e.g. the portal).
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # Wallet Federation (ADR-004, epic #231) — both forwarded so the
      # fail-closed pairing actually reaches the container. Without them the flag
      # would silently read false in here no matter what .env says, and the
      # refusal-to-start that #299 exists to produce would never fire.
      WALLET_FEDERATION_ENABLED: ${WALLET_FEDERATION_ENABLED:-false}
      # No default, by design (#296 LOCKED — no permissive fallback). The `:-`
      # expands to an empty string when unset, which the env schema reads as
      # "no profile selected", the same as omitting it. Turning the flag above on
      # without setting this is a deliberate boot failure, not a misconfiguration
      # of this file.
      OID4VP_VERIFIER_PROFILE: ${OID4VP_VERIFIER_PROFILE:-}
      # Per-realm issuer allowlist (#236) — the OTHER trust direction, and
      # forwarded for the same reason as the two above: without it the container
      # reads an empty map no matter what .env says, so every realm would trust
      # nobody and the operator's configured trust policy would silently not
      # exist. The `:-` expands to an empty string when unset, which the env
      # schema reads as "no realm trusts any issuer" — the fail-closed default,
      # and not a boot failure. A value that is present but malformed IS a boot
      # failure, on purpose.
      OID4VP_TRUSTED_ISSUERS: ${OID4VP_TRUSTED_ISSUERS:-}
      # Per-realm issuer ASSURANCE (#237) — a third variable in the same
      # neighbourhood, and deliberately not merged with the allowlist above:
      # that one decides whether an issuer may be accepted at all, this one what
      # its credentials are WORTH (the eIDAS LoA that becomes the ID token's
      # `acr` claim). Forwarded for the same reason: without it the container
      # assures nothing and no ID token ever carries `acr`, whatever .env says.
      # Blank reads as "no realm assures any issuer" — fail-closed, not a boot
      # failure; a present-but-malformed value IS a boot failure.
      OID4VP_ISSUER_ASSURANCE: ${OID4VP_ISSUER_ASSURANCE:-}
      # Which vocabulary the emitted `acr` value is written in (#237). Defaults
      # to the eIDAS LoA URI form, which is what OIDC Core §2 asks an `acr`
      # value to be. Only reached once a level has been established, so unlike
      # the profile above it has a safe default.
      ACR_VALUE_STYLE: ${ACR_VALUE_STYLE:-eidas-uri}
      # Issuer VERIFICATION KEYS (#234/#238) — which key each issuer signs with.
      # A separate question from the allowlist above: that one decides whether an
      # issuer's credentials count, this one is what makes a signature checkable
      # at all. Blank means no issuer key is configured, so every presentation is
      # refused — the fail-closed state, not a permissive one.
      OID4VP_ISSUER_JWKS: ${OID4VP_ISSUER_JWKS:-}
      # Wallet sign-in screen (#239). Both blank-by-default: an empty
      # OID4VP_REQUESTED_VCT means no credential type was chosen, and the UI
      # then offers no wallet flow at all — the same fail-closed posture as the
      # profile above, expressed as an absent button rather than a boot failure.
      OID4VP_REQUESTED_VCT: ${OID4VP_REQUESTED_VCT:-}
      OID4VP_WALLET_INVOCATION_ENDPOINT: ${OID4VP_WALLET_INVOCATION_ENDPOINT:-openid4vp://}
      # Credential revocation — Token Status List (#297). A FOURTH trust
      # question, and forwarded for the same reason as the three above: without
      # these the container builds no status checker no matter what .env says,
      # and a revoked credential would authenticate exactly like a live one.
      #
      # Both blank by default, which means no revocation checking — the posture
      # every release before #378 had, and the only one `oid4vp-1.0-base`
      # requires. Setting exactly ONE of the anchors and the allowlist is a boot
      # failure, because a half-configured checker refuses every credential
      # silently. Selecting OID4VP_VERIFIER_PROFILE=haip-1.0 with neither set is
      # also a boot failure: that profile declares revocation checking mandatory.
      #
      # Prefer the _PATH form and mount the CA bundle as a file — a bundle is
      # several kilobytes of multi-line base64, which an environment variable
      # carries badly. The two anchor sources are UNIONED, not overriding.
      OID4VP_STATUS_LIST_TRUST_ANCHORS: ${OID4VP_STATUS_LIST_TRUST_ANCHORS:-}
      OID4VP_STATUS_LIST_TRUST_ANCHORS_PATH: ${OID4VP_STATUS_LIST_TRUST_ANCHORS_PATH:-}
      # The SSRF boundary: comma-separated https:// prefixes status lists may be
      # fetched from. The URI comes out of the CREDENTIAL, so blank means "fetch
      # from nowhere" rather than "fetch from anywhere".
      OID4VP_STATUS_LIST_URI_ALLOWLIST: ${OID4VP_STATUS_LIST_URI_ALLOWLIST:-}

      # ── Operator-settable, forwarded by pass-through ──────────────────────
      # Every variable below is documented on /operate/docker/ or
      # /operate/observability/ as settable from `.env`, and none of them
      # reached the container before: this `environment:` map is an explicit
      # allowlist, there is no `env_file:`, and `.dockerignore` keeps `.env` out
      # of the image. So `CIMD_TRUST_POLICY=allowlist` was silently discarded
      # and the helper kept its accept-any-https default; likewise
      # `METRICS_ENABLED=false` left /metrics served on the published port.
      #
      # The bare `VAR:` form is deliberate and differs from the
      # `${VAR:-default}` style above. A null value means "resolve from `.env`
      # or the shell, and omit the variable entirely when unset" — so an unset
      # variable reaches the schema as absent and keeps its own default, rather
      # than arriving as an empty string this file would have to keep in sync by
      # hand. Restating each default here is what let the two lists drift apart
      # in the first place.

      # Client ID Metadata Documents (CIMD)
      CIMD_ENABLED:
      CIMD_TRUST_POLICY:
      CIMD_TRUSTED_DOMAINS:
      CIMD_ALLOW_PRIVATE_ADDRESSES:
      CIMD_FETCH_TIMEOUT_MS:
      CIMD_MAX_DOCUMENT_BYTES:
      CIMD_CACHE_DEFAULT_TTL:
      CIMD_CACHE_MAX_TTL:

      # ID-JAG cross-domain assertions (ADR-011)
      ID_JAG_ENABLED:
      ID_JAG_TRUSTED_ISSUERS:
      ID_JAG_ALLOW_PRIVATE_ADDRESSES:
      ID_JAG_CLOCK_SKEW_LEEWAY:
      ID_JAG_FETCH_TIMEOUT_MS:
      ID_JAG_ISSUED_LIFETIME:
      ID_JAG_JWKS_CACHE_TTL:
      ID_JAG_MAX_ASSERTION_LIFETIME:
      ID_JAG_MAX_DOCUMENT_BYTES:

      # Signing algorithm / post-quantum hybrid (ADR-005)
      SIGNING_ALGORITHM_MODE:
      HYBRID_SIGNING_ENABLED:
      PQC_TOKEN_DELIVERY:
      PQC_SELF_CONTAINED_ACK:
      JWT_MLDSA_KID:
      JWT_MLDSA_PRIVATE_KEY:
      JWT_MLDSA_PRIVATE_KEY_PATH:

      # Observability
      METRICS_ENABLED:
      LOG_PRETTY:
      LOG_REDACT_PATHS:
      REQUEST_ID_HEADER:
      FAILED_LOGIN_TRACKING_ENABLED:
      FAILED_LOGIN_MAX_ATTEMPTS:
      FAILED_LOGIN_WINDOW:
      FAILED_LOGIN_LOCKOUT_DURATION:

      # OID4VP subject binding (#308) — required once the wallet flag is on
      OID4VP_SUBJECT_RESOLUTION:
      OID4VP_SUBJECT_CLAIM:
      OID4VP_SUBJECT_CLAIM_ISSUERS:
      OID4VP_SUBJECT_BINDING_CLAIMS:

      # Rate Limiting (Global)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-3600}
      HEALTH_RATE_LIMIT_MAX: ${HEALTH_RATE_LIMIT_MAX:-1000}
      HEALTH_RATE_LIMIT_WINDOW: ${HEALTH_RATE_LIMIT_WINDOW:-60}

      # Rate Limiting (Auth Endpoints)
      VERIFICATION_RATE_LIMIT: ${VERIFICATION_RATE_LIMIT:-10}
      VERIFICATION_RATE_WINDOW: ${VERIFICATION_RATE_WINDOW:-900}
      RESEND_VERIFICATION_RATE_LIMIT: ${RESEND_VERIFICATION_RATE_LIMIT:-100}
      RESEND_VERIFICATION_RATE_WINDOW: ${RESEND_VERIFICATION_RATE_WINDOW:-60}
      RESEND_VERIFICATION_EMAIL_LIMIT: ${RESEND_VERIFICATION_EMAIL_LIMIT:-3}
      RESEND_VERIFICATION_EMAIL_WINDOW: ${RESEND_VERIFICATION_EMAIL_WINDOW:-3600}
      RESEND_VERIFICATION_MIN_INTERVAL: ${RESEND_VERIFICATION_MIN_INTERVAL:-60}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-10}
      REFRESH_RATE_WINDOW: ${REFRESH_RATE_WINDOW:-60}
      LOGOUT_RATE_LIMIT: ${LOGOUT_RATE_LIMIT:-20}
      LOGOUT_RATE_WINDOW: ${LOGOUT_RATE_WINDOW:-60}
      INTROSPECT_RATE_LIMIT: ${INTROSPECT_RATE_LIMIT:-30}
      INTROSPECT_RATE_WINDOW: ${INTROSPECT_RATE_WINDOW:-60}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - qauth-network

  developer-portal:
    build:
      context: .
      dockerfile: apps/developer-portal/Dockerfile
      args:
        # Browser-reachable auth-server URL for client-side fetches (consents
        # page). Baked at build time (VITE_ var). Defaults to the host-published
        # auth-server port; override for non-local deployments.
        VITE_AUTH_SERVER_URL: ${PORTAL_PUBLIC_AUTH_SERVER_URL:-http://localhost:3000}
    container_name: qauth-developer-portal
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      HOST: 0.0.0.0
      # Reach the auth-server over the Compose network (not the host).
      AUTH_SERVER_URL: ${PORTAL_AUTH_SERVER_URL:-http://auth-server:3000}
      # 32+ char secret used to sign the portal session cookie.
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_SESSION_TTL: ${PORTAL_SESSION_TTL:-900}
    ports:
      - '3001:3001'
    depends_on:
      auth-server:
        condition: service_healthy
    healthcheck:
      # Liveness only: confirm the Nitro server is accepting connections without
      # depending on SSR or the upstream auth-server. (The Nitro build has no
      # dedicated /healthz route, unlike the old custom Node adapter.)
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(3001, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - qauth-network

volumes:
  postgres_data:
  redis_data:

networks:
  qauth-network:
    driver: bridge
