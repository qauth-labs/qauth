# Which API operations and UI routes each graph covers, or why one is exempt (ADR-021 §4). An operation is written
# METHOD /path, and a flow is named by its directory under flows/.
#
# Only the operations a graph claims so far are listed. #569 seeds every other operation and route with its class,
# names the sources the check scans, and adds the check, once delurio defines the claims form
# (delurio-labs/delurio#7). Until then nothing reads this file.
schema: delurio-graph/0
kind: claims

operations:
  POST /auth/logout: { flow: [logout-token] }
  GET /oauth/end-session: { flow: [logout] }
  POST /oauth/end-session: { flow: [logout] }
  GET /oauth/end-session/status: { flow: [logout] }
  POST /auth/login: { flow: [sign-in-token] }
  GET /ui/login: { flow: [sign-in-page] }
  POST /ui/login: { flow: [sign-in-page] }
  GET /ui/resume/{handle}: { flow: [sign-in-page] }
  GET /ui/upstream/{type}: { flow: [upstream-sign-in] }
  GET /ui/upstream/{type}/start: { flow: [upstream-sign-in, upstream-link] }
  GET /ui/upstream-link/{interactionId}: { flow: [upstream-link] }
  GET /ui/upstream-link-refused: { flow: [upstream-link] }
  GET /ui/consent: { flow: [consent-page] }
  POST /ui/consent: { flow: [consent-page] }
  GET /ui/recovery-code/{interactionId}: { flow: [recovery-code, passkey-sign-up] }
  GET /ui/recovery-codes/{interactionId}: { flow: [recovery-code] }
  GET /ui/passkey/{interactionId}: { flow: [passkey] }
  GET /ui/passkey-enrolment/{interactionId}: { flow: [passkey, passkey-sign-up] }
  GET /ui/totp/{interactionId}: { flow: [totp] }
  GET /ui/totp-setup/{interactionId}: { flow: [totp] }
  GET /ui/account: { flow: [account-page] }
  GET /ui/account/password: { flow: [account-page] }
  POST /ui/account/password: { flow: [account-page-changes] }
  POST /ui/account/reauthenticate: { flow: [account-page] }
  POST /ui/account/passkeys/add: { flow: [account-page] }
  POST /ui/account/passkeys/{passkeyId}/rename: { flow: [account-page-changes] }
  POST /ui/account/passkeys/{passkeyId}/remove: { flow: [account-page-changes] }
  POST /ui/account/totp/setup: { flow: [account-page] }
  POST /ui/account/totp/remove: { flow: [account-page-changes] }
  POST /ui/account/recovery-codes/regenerate: { flow: [account-page-changes] }
  POST /ui/account/recovery-codes/confirm: { flow: [account-page-changes] }
  POST /ui/account/sessions/{sessionId}/end: { flow: [account-page-changes] }
  POST /ui/account/sessions/end-all: { flow: [account-page-changes] }
  POST /ui/account/linked-accounts/link: { flow: [account-page] }
  POST /ui/account/linked-accounts/{linkedAccountId}/unlink: { flow: [account-page-changes] }
  GET /interaction/v1-rc.0/{interactionId}: { flow: [consent, logout, upstream-link] }
  GET /interaction/v1-rc.0/{interactionId}/personal: { flow: [consent, logout] }
  POST /interaction/v1-rc.0/{interactionId}/answer: { flow: [consent, logout, upstream-link] }
  POST /interaction/v1-rc.0/{interactionId}/cancel: { flow: [authorization, logout] }
  POST /admin/v1-rc.0/realms/{realmId}/plugins/{plugin}/enable: { flow: [plugin-enable] }
  POST /admin/v1-rc.0/realms/{realmId}/plugins/{plugin}/disable: { flow: [plugin-enable] }
  DELETE /account/v1-rc.0/linked-accounts/{linkedAccountId}: { flow: [unlink-upstream] }
  POST /oauth/register: { flow: [client-registration] }
