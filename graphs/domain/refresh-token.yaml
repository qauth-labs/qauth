# The hand-written overlay of RefreshToken, the refresh_tokens table. The entity and its fields are generated from
# the Drizzle schema (#563); an overlay only adds to them (#564). This one adds the examples and the internal actions
# the flows invoke: core.sign-in-token creates a token and core.logout revokes them. The token flow (#609) adds rotate
# and revokeFamily.
schema: delurio-graph/0
kind: domain
id: qauth

entities:
  RefreshToken:
    # tokenHash and previousTokenHash hold secrets, and no example carries them.
    examples:
      # an active token, as /auth/login issues it to the system client
      - id: 0199f9a1-2b3c-7d4e-8f50-6a7b8c9d0e1f
        userId: 0199f9a0-11aa-7b22-8c33-4d44e55f6601
        oauthClientId: 0199f99f-0a0b-7c0d-8e0f-101112131415
        familyId: 6f1c2a7e-3b4d-4e5f-9a6b-7c8d9e0f1a2b # /auth/login starts a new family with a random (v4) UUID
        familyCreatedAt: 1792918800000 # when that sign-in started the family; every rotation keeps it
        familySessionExpiresAt: null # /auth/login has no browser session, so none caps the family
        scopes: []
        resource: []
        expiresAt: 1793523600000
        revoked: false
        revokedAt: null
        revokedReason: null
        cnfJkt: null
        authorizationCodeId: null # /auth/login redeems no authorization code
        createdAt: 1792918800000
        lastUsedAt: null
      # the same token after POST /auth/logout (revokeAllForUser with the reason logout)
      - id: 0199f9a1-2b3c-7d4e-8f50-6a7b8c9d0e1f
        userId: 0199f9a0-11aa-7b22-8c33-4d44e55f6601
        oauthClientId: 0199f99f-0a0b-7c0d-8e0f-101112131415
        familyId: 6f1c2a7e-3b4d-4e5f-9a6b-7c8d9e0f1a2b
        familyCreatedAt: 1792918800000
        familySessionExpiresAt: null
        scopes: []
        resource: []
        expiresAt: 1793523600000
        revoked: true
        revokedAt: 1792920600000
        revokedReason: logout
        cnfJkt: null
        authorizationCodeId: null
        createdAt: 1792918800000
        lastUsedAt: null

actions:
  RefreshToken.revokeAllForUser:
    # internal: invoked by core.logout, with no route and no actor policy
    source: libs/infra/db/src/lib/repositories/refresh-tokens.repository.ts:359
    body:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        reason: { type: [string, 'null'], maxLength: 255 } # core.logout passes logout
    sideEffects:
      - >-
        every RefreshToken of the user that is not revoked and has not expired, at every client, gets revoked = true,
        revokedAt = now and revokedReason = the reason; one that has expired is left as it is
      - >-
        it holds the user's token lock exclusive in its transaction, so a rotation in flight commits first and is
        swept, and one that starts after it fails

  RefreshToken.create:
    # internal: invoked by core.sign-in-token, with no route and no actor policy
    source: libs/infra/db/src/lib/repositories/refresh-tokens.repository.ts:90
    body:
      type: object
      required: [userId, oauthClientId, tokenHash, familyCreatedAt, expiresAt]
      properties:
        userId: { type: string, format: uuid }
        oauthClientId: { type: string, format: uuid } # core.sign-in-token passes the system client's
        tokenHash: { type: string, pattern: '^[0-9a-f]{64}$' } # SHA-256 of the token, never the token itself
        familyId: { type: string, format: uuid } # a new family (uuidv7) when absent; core.sign-in-token passes a v4
        familyCreatedAt: { type: integer }
        familySessionExpiresAt: { type: [integer, 'null'] } # core.sign-in-token passes null: no browser session
        expiresAt: { type: integer }
        scopes: { type: array, items: { type: string } } # core.sign-in-token passes none
        # set by the code exchange on the first token of the family a code starts; core.sign-in-token passes none
        authorizationCodeId: { type: [string, 'null'], format: uuid }
    result: { returns: RefreshToken }
    sideEffects:
      - >-
        a new active RefreshToken; core.sign-in-token gives it the refresh lifespan from now, capped at the end of its
        family when the realm sets sso_max_lifespan
