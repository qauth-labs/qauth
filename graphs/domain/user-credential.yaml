# The hand-written overlay of UserCredential, the user_credentials table: one row per way a user signs in (ADR-002).
# The entity and its fields are generated from the Drizzle schema (#563); an overlay only adds to them (#564). This
# one marks credentialData secret, and adds the examples, the internal action the two password sign-in flows
# (core.sign-in-page, core.sign-in-token) invoke, and the read of an account's credentials that
# core.client-registration invokes (#846).
schema: delurio-graph/0
kind: domain
id: qauth

entities:
  UserCredential:
    fields:
      # For a password credential, { password_hash, email_verified }: the Argon2id hash of the password, and whether
      # the address in externalSub is confirmed, which the verified-account gate reads. For a wallet credential, the
      # wallet's metadata. It never leaves the server, and no example carries it.
      credentialData: { sensitivity: credential }
    examples:
      # the password credential of the user in User's examples, its address confirmed
      - id: 0199f9a0-33cc-7d44-8e55-6f66a7718803
        userId: 0199f9a0-11aa-7b22-8c33-4d44e55f6601
        realmId: 0199f99e-4a5b-7c6d-8e7f-8091a2b3c4d5
        providerType: password
        externalSub: user@example.com # the address, normalized: lower-cased and trimmed
        isPrimary: true # the credential that created the account (ADR-015 question 13)
        createdAt: 1792832400000
        updatedAt: 1792832460000

actions:
  UserCredential.findByRealmProviderSub:
    # internal: invoked by core.sign-in-page, core.sign-in-token and federation.upstream-sign-in, with no route and no
    # actor policy
    source: libs/infra/db/src/lib/repositories/user-credentials.repository.ts:106
    body:
      type: object
      required: [realmId, providerType, externalSub]
      properties:
        realmId: { type: string, format: uuid } # the realm of the host the request named
        providerType: { type: string } # the password sign-ins pass password; the upstream sign-in the provider type
        externalSub: { type: string } # the normalized address, or the provider's sub
    result: { returns: UserCredential }
    note: >-
      One row or none, through the unique index on (realmId, providerType, externalSub): the same address in two realms
      is two accounts. The sign-in flows verify the password against credentialData.password_hash, and against a decoy
      hash when there is no row or its credentialData is malformed, so that every outcome costs one Argon2id
      verification.

  UserCredential.findAllByUserId:
    # internal: invoked by core.client-registration, with no route and no actor policy
    source: libs/infra/db/src/lib/repositories/user-credentials.repository.ts:228
    body:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid } # the account whose credentials are read
    result: { returns: UserCredential }
    note: >-
      Every credential of the account, the one that created it (isPrimary, migration 0068) and every later one, or
      none once every one was removed. The caller keeps only the rows of the account's realm (#489) and reads
      credentialData to decide whether any credential is proved (ADR-015 Decision 8, amended 2026-11-08).
