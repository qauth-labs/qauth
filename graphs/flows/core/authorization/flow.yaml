    source: apps/auth-server/src/app/helpers/authorization-request.ts:167
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: redirect_uri not registered

  invalid_request.redirect_uri_not_permitted:
    type: final
    title: Refuse a redirect URI no environment permits
    redirect: never
    code: invalid_request
    source: apps/auth-server/src/app/helpers/authorization-request.ts:197
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: redirect_uri not permitted for this environment

  unauthorized_client.disabled:
    type: final
    title: Refuse a disabled or suspended client
    redirect: never
    code: unauthorized_client
    source: apps/auth-server/src/app/helpers/authorization-request.ts:228
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: unauthorized_client
        error_description: client is disabled

  unauthorized_client.grant_type:
    type: final
    title: Refuse a client not registered for the authorization_code grant
    redirect: never
    code: unauthorized_client
    source: apps/auth-server/src/app/helpers/authorization-request.ts:228
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: unauthorized_client
        error_description: client is not registered for the authorization_code grant

  unauthorized_client.response_type:
    type: final
    title: Refuse a client not registered for the code response type
    redirect: never
    code: unauthorized_client
    source: apps/auth-server/src/app/helpers/authorization-request.ts:228
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: unauthorized_client
        error_description: client is not registered for the code response type

  invalid_request.authorization_too_large:
    type: final
    title: Refuse a request too large to hold through the sign-in or the consent
    description: >-
      The pending-authorization stash holds a rebuilt URL of 16 KiB at most; an interaction record, a request of 16 KiB
      and a record of 32 KiB.
    redirect: never
    code: invalid_request
    source: apps/auth-server/src/app/helpers/interaction.ts:489
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: authorization request is too large

  misdirected_request.host:
    type: final
    title: Refuse a host this server does not answer for here
    redirect: never
    code: invalid_request
    source: apps/auth-server/src/app/plugins/realm-resolver.ts:149
    response:
      status: 421
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: This server does not answer for the requested host

  too_many_requests.authorize_limit:
    type: final
    title: Refuse an address over the authorize limit
    redirect: never
    code: temporarily_unavailable
    source: apps/auth-server/src/app/routes/oauth/authorize.ts:102
    response:
      status: 429
      headers:
        Content-Type: application/json; charset=utf-8
        Retry-After: 'the seconds until the window ends'
      body:
        error: temporarily_unavailable
        error_description: "the rate limiter's message, which says when to retry"

  server_error.malformed_cookie:
    type: final
    title: Fail a request whose session cookie cannot be decoded
    redirect: never
    code: server_error
    source: apps/auth-server/src/app/helpers/session-cookie.ts:337
    response: &serverError
      status: 500
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: server_error

  server_error.store:
    type: final
    title: Fail the request when the database fails at the mint
    redirect: never
    code: server_error
    source: apps/auth-server/src/app/plugins/error-handler.ts:620
    response: *serverError

  server_error.interaction_store:
    type: final
    title: Fail the request when the interaction store fails
    redirect: never
    code: server_error
    source: apps/auth-server/src/app/plugins/error-handler.ts:620
    response: *serverError

assertions:
  - id: interaction-only-for-a-checked-request
    never: "interactionStarted and gate != 'open'"
    say: >-
      An interaction is created only for a request whose client, redirect URI, PKCE parameters and dpop_jkt passed
      every check: a request that fails them never reaches the interaction store
    source: apps/auth-server/src/app/routes/oauth/authorize.ts:127
  - id: pages-start-no-interaction
    never: 'interactionStarted and pages'
    say: 'With INTERACTION_UI_ENABLED off, no interaction is created: the request takes the pages it takes today'
    source: apps/auth-server/src/app/routes/oauth/authorize.ts:148
  - id: interactions-park-nothing
    never: "state in ['parkingRequest', 'consent_screen.page', 'consent_screen.consent_withdrawn'] and not pages"
    say: >-
      With INTERACTION_UI_ENABLED on, no URL carries the authorization request: nothing is parked behind /ui/login,
      and no redirect to /ui/consent carries the parameters
    source: apps/auth-server/src/app/routes/oauth/authorize.ts:148
  - id: prompt-none-shows-nothing
    never: >-
      silent and (interactionStarted or state in ['parkingRequest', 'consent_screen.page',
      'consent_screen.consent_withdrawn', 'atSignInCeremony', 'atConsentCeremony'])
    say: 'A request with prompt=none starts no interaction and is sent to no page, in either mode'
    source: apps/auth-server/src/app/helpers/authorization-request.ts:330
  - id: no-code-while-an-interaction-is-open
    never: 'codeMinted and interactionOpen'
    say: >-
      A code is minted only once the interaction has ended: never while it can still be answered, so a finish that the
      expiry sweep beat, or a replayed answer, issues none
    source: apps/auth-server/src/app/helpers/interaction.ts:786
  - id: no-code-without-consent
    never: 'codeMinted and consentMissing'
    say: 'A code is minted only under a stored or administrative consent that covers the request'
    source: apps/auth-server/src/app/helpers/authorization-request.ts:611
  - id: no-code-on-a-stale-sign-in
    never: 'codeMinted and needsFreshLogin'
    say: 'No code is minted on a sign-in older than what the request or its scopes ask for'
    source: apps/auth-server/src/app/helpers/authorization-request.ts:537
  - id: no-code-for-a-refused-request
    never: "codeMinted and (overAgentCap or audienceUnlisted or (finishing and since != 'unchanged'))"
    say: >-
      No code is minted above the agent cap, for an audience the client does not list, or for a client that no longer
      passes the checks when its interaction finishes
    source: apps/auth-server/src/app/helpers/authorization-interaction.ts:365
  - id: shown-not-redirected-before-any-page
    never: >-
      provisioning == 'selfService' and state in ['invalid_request.malformed_dpop_jkt', 'login_required.no_session',
      'invalid_request.create_without_openid', 'invalid_request.registration_not_offered',
      'unauthorized_client.registration_not_allowed', 'invalid_request.create_with_max_age',
      'invalid_scope.agent_scope_mode_exceeded', 'invalid_target.unlisted_reserved_audience',
      'login_required.fresh_login', 'consent_required.prompt_none', 'login_required.session_ended',
      'consent_required.consent_withdrawn', 'invalid_scope.consent_not_shown', 'invalid_target.consent_not_shown']
    say: >-
      Before the person has seen any QAuth page, an error goes by redirect only to a client an operator provisioned
      (RFC 9700 §4.11.2)
    source: apps/auth-server/src/app/helpers/authorization-error.ts:101
  - id: a-finish-only-from-an-interaction
    never: "phase == 'finish' and not interactionStarted"
    say: 'The request is decided at a finish only for an interaction this request started'
    source: apps/auth-server/src/app/routes/interaction-api.ts:720
  - id: registration-only-when-allowed
    never: "state in ['startingRegistration', 'atRegistrationCeremony'] and create != 'allowed'"
    say: >-
      A registration starts only for prompt=create with openid and no max_age, while the realm and the client both
      allow sign-up
    source: apps/auth-server/src/app/helpers/registration.ts:69
