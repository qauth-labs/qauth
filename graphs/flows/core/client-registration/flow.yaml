# Dynamic client registration and the owner of an agent (#846; RFC 7591, ADR-015 Decision 8 and question 13, ADR-020
# §3, ADR-007 §2): POST /oauth/register, from the request that passed its attribution to the response.
#
# - A registration that carries a developer's token makes the developer the client's owner (#374); an agent client
#   (is_agent: true) so attributed makes the developer the owner of an agent, and only a verified account may own one.
#   An account is verified when its primary identity is proved: the credential that created it, which
#   user_credentials.is_primary marks and which never moves. Each kind has its own proof, row by row of Decision 8's
#   table. A credential added later is never read, and REQUIRE_VERIFIED_ACCOUNT, which governs a password account's
#   sign-in, is not either: no state of this graph depends on it.
# - The rule is decideVerifiedOwner (libs/server/federation/src/providers/verified-owner.ts); the server reads what it
#   needs for one account (apps/auth-server/src/app/helpers/verified-owner.ts). The agent routes of the Authority Tree
#   (#721) call the same check.
# - Exits are the endpoint's RFC 6749 §5.2 error bodies (an OAuth protocol endpoint, #513), named `<error>.<cause>`, one
#   per distinct cause. The five refusals of an owner answer the same: the answer does not say which proof is missing;
#   the event user.agent_ownership_refused does, with its reason.
# - A named guard of delurio-graph/0 is a bare expression and cannot carry `source:`, so each guard's anchor is the
#   `source:` of the transition it decides: the line of the check.
# - `invoke: { external }` names a store the domain graph holds no entity for: the realm's upstream provider catalog,
#   the client store and the event store. The read of the primary credential is a domain action (graphs/domain/).
schema: delurio-graph/0
kind: flow
id: core.client-registration
status: captured
domain: qauth
title: Register a client, and refuse an agent to an owner who is not verified
summary: >-
  A client registers itself with POST /oauth/register. An anonymous registration has no owner. One that carries a
  developer's token is the developer's client; if it is an agent client, QAuth reads the developer's primary
  credential and refuses, recorded as user.agent_ownership_refused, an account whose primary identity is not proved: a
  password whose mailbox code was never entered, a passkey whose registration did not check user verification, an
  upstream account whose provider's verified switch is off or which the realm switched off, a primary credential of a
  type that proves nothing, or none at all. A wallet credential, which only QAuth's verifier writes, is proved. Then
  the developer's client count is checked, the client is stored, client.created is recorded and the client's metadata
  is the answer.

scope:
  shows: POST /oauth/register past its attribution and its metadata checks, to the response
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the attribution itself (helpers/registration-attribution.ts): a request with no Authorization header is
      anonymous; a header that does not verify, a token that is not the developer portal's management token, or one
      without qauth:developer:write is refused before anything else, and no owner is checked"
    - "the client metadata's own checks (400 invalid_client_metadata or invalid_redirect_uri), which run before the
      owner check: an agent registration that fails them records no refusal, whoever its owner"
    - "the back-channel logout URI's address check (#624), which runs after the owner check"
    - 'a failure to record user.agent_ownership_refused, which turns the refusal into a 500 server_error'
    - 'a store failure while the developer’s clients are counted or a client secret is hashed, which answers 500'
    - 'the per-address and per-realm rate limit (429) and the realm resolver (421), which answer before the flow runs'
    - 'a primary credential whose data is malformed, which proves nothing and is refused as unproved_type'
    - "an AuthMethod plugin's identity on a process that did not load the plugin (one without the web or admin role):
      the catalog has no provider of its type, and the identity is refused as upstream_unverified"

context:
  caller:
    values: [anonymous, developer]
    initial: any
    say:
      anonymous: 'the request carries no Authorization header: the client has no owner'
      developer: "it carries a developer's management token, which attribution accepted: the developer owns the client"
  client:
    values: [agent, other]
    initial: any
    say:
      agent: 'the metadata says is_agent: true'
      other: 'it does not: the client is no agent'
  primary:
    values: [password, passkey, wallet, upstream, other, none]
    initial: any
    say:
      password: "the developer's account was created with a password"
      passkey: 'with a passkey'
      wallet: 'with a wallet credential, written only by the verifier of an older release'
      upstream: "by an upstream provider's sign-in: an oidc_* provider of the realm, or an AuthMethod plugin"
      other: 'with a credential of a type that proves nothing'
      none: 'the account holds no primary credential: it was removed, or the backfill had none to mark'
  address:
    values: [confirmed, unconfirmed]
    initial: any
    say:
      confirmed: "the password's mailbox code was entered: email_verified is true on that credential"
      unconfirmed: 'it was never entered'
  userVerification:
    values: [checked, unchecked]
    initial: any
    say:
      checked: "the passkey's registration checked the UV flag: user_verified is true on that credential"
      unchecked: 'the credential does not say so'
  providerSwitch:
    values: [on, off]
    initial: any
    say:
      on: "the realm offers the provider of the identity's type, and its verified switch (marks_verified) is on"
      off: 'the switch is off, or the realm switched the provider off or no longer has it'
  clientCount:
    values: [below, reached]
    initial: any
    say:
      below: 'the developer owns fewer clients in the realm than MAX_CLIENTS_PER_DEVELOPER'
      reached: 'the developer owns that many'
  created: { values: [false, true], initial: false }

guards:
  ownerless: "caller == 'anonymous' or client == 'other'"
  agentOwner: "caller == 'developer' and client == 'agent'"
  noPrimary: "primary == 'none'"
  unconfirmedPassword: "primary == 'password' and address == 'unconfirmed'"
  uncheckedPasskey: "primary == 'passkey' and userVerification == 'unchecked'"
  unprovedType: "primary == 'other'"
  upstreamIdentity: "primary == 'upstream'"
  switchOff: "providerSwitch == 'off'"
  limitReached: "caller == 'developer' and clientCount == 'reached'"

effects:
  create: { set: { created: true } }

failures:
  readingPrimary: { from: UserCredential.findPrimaryByUserId, server: [server_error] }
  readingProvider: { from: upstreamProviderCatalog, server: [server_error] }
  storingClient: { from: clientStore, server: [server_error] }
  recordingCreated: { from: eventStore, server: [server_error] }

main:
  given:
    caller: developer
    client: agent
    primary: password
    address: confirmed
    userVerification: checked
    providerSwitch: on
    clientCount: below
  events: [REGISTER, DONE, DONE, DONE]

initial: idle
states:
  idle:
    title: Wait for a registration whose attribution and metadata passed
    source: apps/auth-server/src/app/routes/oauth/register.ts:76
    on:
      REGISTER:
        target: checkingOwnership
        say: 'POST /oauth/register, anonymous or with a developer token attribution accepted, and valid metadata'
        source: apps/auth-server/src/app/routes/oauth/register.ts:106

  checkingOwnership:
    title: Check the owner of an agent client attributed to a developer
    source: apps/auth-server/src/app/routes/oauth/register.ts:114
    always:
      - guard: ownerless
        target: countingClients
        say: 'an anonymous registration has no owner, and a client that is no agent owns nothing: no owner is checked'
        source: apps/auth-server/src/app/routes/oauth/register.ts:114
      - target: readingPrimary
        say: "an agent client of a developer: the developer's account must be a verified owner"

  readingPrimary:
    title: Read the developer's primary credential
    source: apps/auth-server/src/app/helpers/verified-owner.ts:58
    invoke: { action: UserCredential.findPrimaryByUserId }
    on:
      DONE:
        target: decidingOwner
        say: 'the credential that created the account, or none'
      FAIL.server:
        target: server_error.primary
        say: 'the database fails; nothing is written'

  decidingOwner:
    title: Ask the proof of the primary identity's kind
    source: libs/server/federation/src/providers/verified-owner.ts:113
    always:
      - guard: noPrimary
        target: access_denied.no_primary_identity
        say: 'the account has no primary credential'
        source: libs/server/federation/src/providers/verified-owner.ts:113
      - guard: unconfirmedPassword
        target: access_denied.address_unverified
        say: 'a password account whose address was never confirmed, whatever REQUIRE_VERIFIED_ACCOUNT says'
        source: libs/server/federation/src/providers/verified-owner.ts:126
      - guard: uncheckedPasskey
        target: access_denied.passkey_unverified
        say: 'a passkey whose registration did not check the UV flag'
        source: libs/server/federation/src/providers/verified-owner.ts:133
      - guard: unprovedType
        target: access_denied.unproved_type
        say: 'a type with no proof'
        source: libs/server/federation/src/providers/verified-owner.ts:148
      - guard: upstreamIdentity
        target: readingProvider
        say: "an upstream identity: its provider's switch decides"
        source: libs/server/federation/src/providers/verified-owner.ts:141
      - target: countingClients
        say:
          "a confirmed password, a passkey registered with user verification, or a wallet credential QAuth's verifier
          wrote: a verified owner"
        source: libs/server/federation/src/providers/verified-owner.ts:138

  readingProvider:
    title: Read the realm's provider of the identity's type
    source: apps/auth-server/src/app/helpers/verified-owner.ts:65
    invoke: { external: upstreamProviderCatalog }
    on:
      DONE:
        target: decidingProvider
        say: 'the provider while the realm offers it, or none'
      FAIL.server:
        target: server_error.provider
        say: 'the database fails; nothing is written'

  decidingProvider:
    title: Count an upstream identity only while its provider vouches for it
    source: libs/server/federation/src/providers/verified-owner.ts:145
    always:
      - guard: switchOff
        target: access_denied.upstream_unverified
        say: "the provider's verified switch is off, or the realm switched the provider off"
        source: libs/server/federation/src/providers/verified-owner.ts:145
      - target: countingClients
        say: 'QAuth checked the sign-in that created the account, and the switch is on: a verified owner'

  countingClients:
    title: Refuse a developer who owns the maximum of clients
    source: apps/auth-server/src/app/routes/oauth/register.ts:139
    always:
      - guard: limitReached
        target: access_denied.client_limit
        say: 'the developer owns MAX_CLIENTS_PER_DEVELOPER clients in the realm'
        source: apps/auth-server/src/app/helpers/developer-client-limit.ts:28
      - target: storingClient
        say: 'no developer, or one below the maximum'

  storingClient:
    title: Store the client
    description: >-
      Its developer_id is the developer's users.id, or NULL for an anonymous registration; is_agent is what the
      metadata said. A confidential client's secret is stored as its Argon2id hash.
    source: apps/auth-server/src/app/routes/oauth/register.ts:168
    invoke: { external: clientStore }
    on:
      DONE:
        target: recordingCreated
        say: 'the client row is written'
      FAIL.server:
        target: server_error.client_store
        say: 'the database fails'

  recordingCreated:
    title: Record the registration
    source: apps/auth-server/src/app/routes/oauth/register.ts:273
    invoke: { external: eventStore }
    on:
      DONE:
        target: registered
        effect: [create]
        say: 'client.created, with the client as its subject and its actor'
      FAIL.server:
        target: server_error.event
        say: 'the event store fails'

  # Exits

  registered:
    type: final
    title: Answer with the client's metadata
    source: apps/auth-server/src/app/routes/oauth/register.ts:336
    response:
      status: 201
      headers:
        Cache-Control: no-store
      body: >-
        the client information response (RFC 7591 §3.2.1): client_id, client_id_issued_at, the registered metadata with
        is_agent, and a confidential client's client_secret

  access_denied.no_primary_identity:
    type: final
    title: Refuse an agent to an account with no primary identity
    description: user.agent_ownership_refused is recorded with the reason no_primary_identity and the identity none.
    source: apps/auth-server/src/app/helpers/verified-owner.ts:100
    response: &ownerRefused
      status: 403
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: access_denied
        error_description: 'Only a verified account can own an agent: confirm the identity this account was created with'

  access_denied.address_unverified:
    type: final
    title: Refuse an agent to a password account whose address is unconfirmed
    description: user.agent_ownership_refused is recorded with the reason address_unverified and the identity password.
    source: apps/auth-server/src/app/helpers/verified-owner.ts:100
    response: *ownerRefused

  access_denied.passkey_unverified:
    type: final
    title: Refuse an agent to a passkey account whose registration did not check user verification
    description: user.agent_ownership_refused is recorded with the reason passkey_unverified and the identity passkey.
    source: apps/auth-server/src/app/helpers/verified-owner.ts:100
    response: *ownerRefused

  access_denied.upstream_unverified:
    type: final
    title: Refuse an agent to an upstream account its provider does not vouch for
    description: user.agent_ownership_refused is recorded with the reason upstream_unverified and the identity upstream.
    source: apps/auth-server/src/app/helpers/verified-owner.ts:100
    response: *ownerRefused

  access_denied.unproved_type:
    type: final
    title: Refuse an agent to an account whose primary identity is of a type with no proof
    description: user.agent_ownership_refused is recorded with the reason unproved_type and the identity other.
    source: apps/auth-server/src/app/helpers/verified-owner.ts:100
    response: *ownerRefused

  access_denied.client_limit:
    type: final
    title: Refuse a client to a developer who owns the maximum
    source: apps/auth-server/src/app/helpers/developer-client-limit.ts:29
    response:
      status: 403
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: access_denied
        error_description: 'Client limit reached: a developer may own at most MAX_CLIENTS_PER_DEVELOPER clients'

  server_error.primary:
    type: final
    title: Fail on a database error while the primary credential is read
    response: &serverError
      status: 500
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: server_error

  server_error.provider:
    type: final
    title: Fail on a database error while the provider is read
    response: *serverError

  server_error.client_store:
    type: final
    title: Fail on a database error while the client is stored
    response: *serverError

  server_error.event:
    type: final
    title: Fail on an event store error
    response: *serverError

assertions:
  - id: an-agent-owner-is-verified
    never: >-
      created and agentOwner and (noPrimary or unconfirmedPassword or uncheckedPasskey or unprovedType or
      (upstreamIdentity and switchOff))
    say: 'An agent client is never registered to a developer whose primary identity is not proved'
    source: apps/auth-server/src/app/routes/oauth/register.ts:114
  - id: no-client-beyond-the-maximum
    never: 'created and limitReached'
    say: 'A developer never owns more clients in the realm than MAX_CLIENTS_PER_DEVELOPER'
    source: apps/auth-server/src/app/helpers/developer-client-limit.ts:28
