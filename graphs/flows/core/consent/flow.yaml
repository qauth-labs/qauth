# The consent step of the Interaction API (INT-07, #629; ADR-019 Decision 6, ADR-017 Decision 9, ADR-020 §3): the
# consent decision that /ui/consent makes today, moved into an interaction whose step the ceremony app only renders.
# Written before the code (status: proposed), as ADR-021 Decision 4 asks of a new core flow, so it carries no source
# anchors. It replaces the baseline that #612 captured here: that graph, of the server-rendered /ui/consent page, is now
# graphs/flows/core/consent-page, and keeps its own rules while INTERACTION_UI_ENABLED is off.
#
# - The walk runs from the start of a consent interaction (decideAuthorization's consent outcome, at /oauth/authorize or
#   at the finish of another interaction) through the step read, the personal-data read and the answer
#   (POST /interaction/v1-rc.0/{id}/answer) to the response. What comes before the start, and every check an answer
#   passes before its turn is taken, is core.authorization's and the Interaction API's own (#616): see outOfView.
# - Each exit is a final state named <error>.<cause>, one per distinct cause, with the response the caller sees. An
#   error the Interaction API throws is a bare RFC 9457 problem document; an error /oauth/authorize throws while it
#   starts the interaction is the RFC 6749 body. An exit with `redirect: error` sends the browser to the client's
#   redirect_uri with error, error_description, state and iss (RFC 6749 §4.1.2.1, RFC 9207 §2): a form post gets it
#   as 303 See Other, a JSON answer as { result: redirect, location }.
# - The checks of an allowed answer run in a fixed order and each refuses on its own, so one variable (allowGate) says
#   which of them the answer fails first, if any, as core.consent-page does with `gate`: one variable per check would
#   multiply the starting situations the checker stores.
# - `invoke: { external }` names a store the domain graph holds no entity for: the interaction store (#592) and the
#   event store, which has its own writer (ADR-019 Decision 8). The two database writes of the mint transaction are
#   domain actions (graphs/domain/).
schema: delurio-graph/0
kind: flow
id: core.consent
status: proposed
domain: qauth
title: Ask the signed-in person to allow a client's access, as a step of the Interaction API
summary: >-
  When decideAuthorization answers that a request needs consent and INTERACTION_UI_ENABLED is on, a consent interaction
  starts for the signed-in browser session. Its step holds the client as the server's own records describe it, the
  scopes the client's allowlist holds (each marked when it is dangerous), the resources or else the client's audience,
  for an AI agent a line in QAuth's own words, and "Remember this decision", checked by default; a request the step
  cannot show is refused at the start. The answer carries only allow or deny and the remember choice. The interaction
  finishes before anything is decided; the request is checked again, deny sends access_denied to the client, and allow
  checks the account, the agent scope cap, the QAuth API audiences, whether the client is still what the step said, the
  shown set against the client as it is now, and the step-up gate. Then one transaction mints the code for exactly the
  shown set, saves the grant when the person asked to remember it, and records the events; the browser goes back to the
  client with the code, state and iss.

scope:
  shows: >-
    the consent step of an authorization request with INTERACTION_UI_ENABLED on: its start, the step and personal-data
    reads, and the answer from its grammar check to the response
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the checks an answer passes before its turn is taken, unchanged from #616 and drawn by core.authorization and the
      Interaction API's own rules: the same origin (403, request.csrf_rejected), the media type (415), the body bound
      (413), the flow cookie that binds the interaction (410 interaction_expired), the CSRF value of the current step
      view (403), and the turn (an answer another answer beat gets the step as it now is). They stand in for the page's
      realm resolver, rate limit, form schema, session cookie and CSRF check (core.consent-page): an answer names its
      step view by that view's CSRF value, a turn is taken once, and the finish deletes the record, so a replayed
      answer gets 410 and issues nothing (core.authorization, interaction_expired.finished)"
    - 'the refusals of the reads: an id that names no live interaction answers 410 interaction_expired, as a consent
      record that holds no client display does (no server of #629 writes one) to a read and to an answer; the
      personal-data read answers 410 without the flow cookie that binds the interaction and 403 from another origin;
      both reads have their own rate limits (#616)'
    - 'the cancel: core.authorization (recheckingCancel), which checks the request again and sends access_denied with
      state and iss to the client'
    - 'whether the step is shown at all: core.authorization decides it (decideAuthorization). The step is skipped only
      through canSkipConsent (a stored consent that covers every requested scope at each requested resource) or the
      administrative waiver of an operator-flagged first-party client (ADR-017 Decision 9). An AI agent never skips it,
      a covering stored consent included (ADR-015 Decision 11). A dangerous scope (write:*, agent:admin, agent:exec),
      a request that widens a stored grant and prompt=consent always show it; prompt=none never reaches it
      (consent_required, or login_required when a fresh sign-in is needed). The decision refuses an agent scope above
      the cap and an unlisted QAuth API audience before any consent interaction starts'
    - 'a later request that fits a remembered grant: core.authorization skips the step through canSkipConsent, except
      for an agent client, a dynamically registered client inside its badge window, prompt=consent, a dangerous scope
      of a first-party client, and a scope or resource outside the grant'
    - "the outcomes of the request decided again, when the client changed whether it is an agent since the step was
      shown, other than the usual new consent interaction drawn here: a code under a stored consent for a client that
      is no longer an agent, a refusal, or a sign-in are core.authorization's finish path"
    - 'the server-rendered page (core.consent-page), the screen the ceremony app draws from the step (CER-08), and the
      device grant, which reuses the step and always shows it (PRO-36)'
    - "the page's guards with no counterpart here: no scope set bound (the interaction record always holds the shown
      set, so there is no unbound case), a development client's style policy (there is no server-rendered page) and a
      request too large to park (an interaction holds the request within its record bound instead: tooLarge)"
    - 'a store failure before anything is written (the client, the realm, the session, the consent) answers 500, and a
      failure to record the event of a refusal (consent.denied, step_up.required, authorization.failed) turns that
      refusal into a 500'
    - "staging reads as production in every check drawn here; the environment is the stricter of the client's and its
      realm's ceiling, and a development client is spared only the dangerous-scope rule of the step-up gate"

context:
  # where decideAuthorization answered consent, and, at /oauth/authorize, who provisioned the client: a refusal the
  # person has seen no QAuth page for goes by redirect only to a client an operator provisioned (RFC 9700 §4.11.2)
  entry:
    values: [authorizeOperator, authorizeSelfService, finish]
    initial: any
    say:
      authorizeOperator: >-
        at /oauth/authorize, for a client an operator provisioned: the system client or the seed manifest
      authorizeSelfService: >-
        at /oauth/authorize, for a client that registered itself: open registration, CIMD or a developer account
      finish: >-
        at the finish of another interaction of the request: a sign-in, or a consent whose client changed whether it
        is an agent
  # the checks of the start run in a fixed order: the client display first, then what the step can carry
  startGate:
    values:
      [shown, undescribableRedirect, unshowableScopes, unshowableResources, unshowableAudience]
    initial: any
    say:
      shown: 'the client display describes the redirect URI, and the step can carry the scopes, resources and audience'
      undescribableRedirect: >-
        clientDisplay cannot describe where redirect_uri goes: an IPv6 address that is not loopback, a host that is not
        a DNS name of valid labels, or a scheme over 64 characters, which only a client registered before #593 holds
      unshowableScopes: >-
        the step cannot carry the scopes: more than 64, or one outside its alphabet (RFC 6749 §3.3 without < and >) or
        over 128 characters
      unshowableResources: 'the step cannot carry the resources: more than 16, or one over 2048 characters'
      unshowableAudience: >-
        the request names no resource, and the step cannot carry the audience the token gets from the client's
        configuration: a value holding markup or a control character (the token endpoint reads at most 20 values of at
        most 256 characters, which the step carries)
  clientIsAgent:
    values: [false, true]
    initial: any
    say:
      'true': 'the client is an AI agent when the step is built (isAgentClient, fail-closed)'
      'false': 'the client is not an agent when the step is built'
  # the answer: its grammar and what it carries
  answer:
    values: [allow, allowRemember, deny, malformed]
    initial: any
    say:
      allow: 'decision allow, with remember false or absent'
      allowRemember: 'decision allow, with remember true, as the checked box of a form post sends it'
      deny: 'decision deny, whatever remember says'
      malformed: >-
        the answer does not pass the step grammar: no decision, another decision, a remember that is no boolean, or a
        member beyond type, csrf, decision and remember, such as a scope or a resource
  # checkAuthorizationRequest on the request the record holds, at the finish
  recheck:
    values: [unchanged, clientGone, clientUnusable, dpopRefused]
    initial: any
    say:
      unchanged: >-
        the client still resolves and may use the endpoint, its redirect URI is still registered and permitted
      clientGone: >-
        client_id names no client any more, or the redirect URI was removed from it or is no longer permitted
      clientUnusable: >-
        the client was disabled or suspended, or lost the authorization_code grant or the code response type
      dpopRefused: 'DPoP was switched on since, and the dpop_jkt the request named is not one thumbprint'
  # the checks of an allowed answer, in finishConsent's order; the first that fails decides the answer
  allowGate:
    values:
      - open
      - accountDisabled
      - overAgentCap
      - unlistedAudience
      - agentChanged
      - scopesNarrowed
      - resourcesDiffer
      - promptLogin
      - maxAgeExceeded
      - dangerousScope
      - dangerousScopeInDevelopment
    initial: any
    say:
      open: 'every check passes, and nothing asks for a fresh sign-in or the sign-in is fresh enough for what asks'
      accountDisabled: >-
        the account was disabled since the step was shown: liveBrowserSession finds no usable session for the user
      overAgentCap: >-
        the request's scope names an agent:* scope above the client's agent mode cap (any agent:* scope for a client
        that is no agent or has no cap), as findExceedingAgentScopesForClient reads it now
      unlistedAudience: >-
        a resource names a QAuth API audience (urn:qauth:aud:) the client no longer lists (unlistedReservedAudiences)
      agentChanged: >-
        the client changed whether it is an agent since the step was shown: params.agent is present and the client is
        no agent now, or the other way round (a CIMD document that changed)
      scopesNarrowed: "the shown scopes, filtered by the client's allowlist as it is now, are not the shown set"
      resourcesDiffer: "the shown resources are not the request's (defensive: they cannot differ by construction)"
      promptLogin: >-
        prompt=login, or the client's first-party profile is native_backend (forcesLoginPrompt), and the sign-in is more
        than two minutes old (STEP_UP_FRESH_AUTH_WINDOW_MS)
      maxAgeExceeded: 'the request carries max_age, and the sign-in is older than that many whole seconds'
      dangerousScope: >-
        a shown scope is dangerous, the client is not a development client, and the sign-in is more than two minutes
        old
      dangerousScopeInDevelopment: >-
        the only step-up reason is a dangerous scope on a sign-in more than two minutes old, and the client is a
        development client, whose policy does not enforce the dangerous-scope rule (agentStepUpEnforced false)
  # what this walk has done
  interactionOpen: { values: [false, true], initial: false }
  finished: { values: [false, true], initial: false }
  signInCause: { values: [none, freshLogin, accountDisabled, sessionEnded], initial: none }
  # written in the open mint transaction, and whether it committed
  codeWritten: { values: [false, true], initial: false }
  grantWritten: { values: [false, true], initial: false }
  committed: { values: [false, true], initial: false }

guards:
  atFinish: "entry == 'finish'"
  operatorClient: "entry == 'authorizeOperator'"
  redirectUndescribable: "startGate == 'undescribableRedirect'"
  scopesUnshowable: "startGate == 'unshowableScopes'"
  resourcesUnshowable: "startGate == 'unshowableResources'"
  audienceUnshowable: "startGate == 'unshowableAudience'"
  agentClient: clientIsAgent
  malformedAnswer: "answer == 'malformed'"
  denied: "answer == 'deny'"
  remember: "answer == 'allowRemember'"
  clientGone: "recheck == 'clientGone'"
  clientUnusable: "recheck == 'clientUnusable'"
  dpopRefused: "recheck == 'dpopRefused'"
  accountDisabled: "allowGate == 'accountDisabled'"
  overAgentCap: "allowGate == 'overAgentCap'"
  audienceUnlisted: "allowGate == 'unlistedAudience'"
  agentChanged: "allowGate == 'agentChanged'"
  scopesNarrowed: "allowGate == 'scopesNarrowed'"
  resourcesDiffer: "allowGate == 'resourcesDiffer'"
  # evaluateStepUp with every shown scope treated as new (priorConsentScopes: [])
  needsFreshLogin: "allowGate in ['promptLogin', 'maxAgeExceeded', 'dangerousScope']"

effects:
  openInteraction: { set: { interactionOpen: true } }
  finishInteraction: { set: { interactionOpen: false, finished: true } }
  becameAgent: { set: { clientIsAgent: true } }
  ceasedAgent: { set: { clientIsAgent: false } }
  # the request decided again starts a new consent interaction, at the finish of this one, for whatever it then holds
  nextInteraction:
    set: { entry: finish, finished: false }
    havoc: [startGate, answer, recheck, allowGate]
  forFreshLogin: { set: { signInCause: freshLogin } }
  forDisabledAccount: { set: { signInCause: accountDisabled } }
  forEndedSession: { set: { signInCause: sessionEnded } }
  writeCode: { set: { codeWritten: true } }
  writeGrant: { set: { grantWritten: true } }
  commit: { set: { committed: true } }
  # the mint transaction rolls back: nothing it wrote is left
  rollBack: { set: { codeWritten: false, grantWritten: false } }

failures:
  startingConsent: { from: interactionStore, tooLarge: [invalid_request], server: [server_error] }
  takingFinish:
    from: interactionStore
    expired: [interaction_expired]
    sessionEnded: [interaction_expired]
    server: [server_error]
  # the mint transaction (MINT_TRANSACTION, READ COMMITTED): the code, the grant and the events commit together
  mintingCode:
    from: AuthorizationCode.mint
    sessionEnded: [login_required]
    server: [server_error]
  savingConsent: { from: Consent.grant, server: [server_error] }
  recordingGrant: { from: eventStore, server: [server_error] }
  continuingToSignIn:
    { from: interactionStore, tooLarge: [invalid_request], server: [server_error] }

# The main story: /oauth/authorize starts a consent interaction for a signed-in browser, the ceremony page reads the
# step and its personal data, the person allows with "Remember this decision" checked, and the client gets its code.
main:
  given:
    entry: authorizeOperator
    startGate: shown
    clientIsAgent: false
    answer: allowRemember
    recheck: unchanged
    allowGate: open
  events: [START, DONE, READ, READ_PERSONAL, ANSWER, DONE, DONE, DONE, DONE]

initial: idle
states:
  idle:
    title: Wait for a request that needs consent
    on:
      START:
        target: describingClient
        say: >-
          decideAuthorization answers consent for a signed-in browser session (core.authorization, consentNeeded): at
          /oauth/authorize, or at the finish of a sign-in interaction of the request

  # The start (authorizationInteractionStart)

  describingClient:
    title: Describe the client from the server's own records
    description: >-
      clientDisplay(client, { redirectUri }) (#593, ADR-019 Decision 6), computed once, as the interaction starts, and
      kept in the interaction record (its optional member client; the record version stays): kind (cimd,
      admin_registered or unverified), the verified domain, where the code goes (a host, this_device for a loopback
      address, or an app's scheme), the declared name, sanitised and marked declared, and the newly registered badge
      (isDynamicClientWithinBadgeWindow). Never a logo, never a URL the client supplied. A redirect URI the display
      cannot describe refuses the start (InvalidRequestError), as the page does, and is never redirected to.
    always:
      - guard: redirectUndescribable and atFinish
        target: invalid_request.redirect_uri_not_shown_at_finish
        say: 'the display cannot describe where the redirect URI goes, at the finish of an interaction'
      - guard: redirectUndescribable
        target: invalid_request.redirect_uri_not_shown
        say: 'the display cannot describe where the redirect URI goes, at /oauth/authorize'
      - target: buildingStep
        say: 'the client is described'

  buildingStep:
    title: Build the consent step from the request
    description: >-
      consentStep: the requested scopes the client's allowlist holds (filterRequestedScopes), in request order, each {
      scope, text?, sensitive: false, dangerous } (text is describeScope's for the scopes QAuth defines, dangerous is
      isDangerousScope); the request's resource indicators; when the request named none, the token's aud from the
      audience an operator configured for the client, without QAuth API audiences (userGrantDefaultAudience); agent ({}
      or { max_lifespan } from the realm's sso_max_lifespan) for an AI agent client only; remember_default true. A
      request the step cannot carry is refused with authorization.failed (consent_step_unshowable) recorded, to the
      redirect_uri unless the client registered itself and the person has seen no QAuth page yet.
    always:
      - guard: scopesUnshowable and atFinish
        target: invalid_scope.consent_not_shown_at_finish
        say: 'the step cannot carry the scopes, at the finish of an interaction'
      - guard: scopesUnshowable and operatorClient
        target: invalid_scope.consent_not_shown
        say: 'the step cannot carry the scopes, for a client an operator provisioned'
      - guard: scopesUnshowable
        target: invalid_scope.consent_not_shown_shown
        say: 'the step cannot carry the scopes, for a client no operator provisioned'
      - guard: resourcesUnshowable and atFinish
        target: invalid_target.consent_not_shown_at_finish
        say: 'the step cannot carry the resources, at the finish of an interaction'
      - guard: resourcesUnshowable and operatorClient
        target: invalid_target.consent_not_shown
        say: 'the step cannot carry the resources, for a client an operator provisioned'
      - guard: resourcesUnshowable
        target: invalid_target.consent_not_shown_shown
        say: 'the step cannot carry the resources, for a client no operator provisioned'
      - guard: audienceUnshowable and atFinish
        target: invalid_target.audience_not_shown_at_finish
        say: "the step cannot carry the client's audience, at the finish of an interaction"
      - guard: audienceUnshowable and operatorClient
        target: invalid_target.audience_not_shown
        say: "the step cannot carry the client's audience, for a client an operator provisioned"
      - guard: audienceUnshowable
        target: invalid_target.audience_not_shown_shown
        say: "the step cannot carry the client's audience, for a client no operator provisioned"
      - target: startingConsent
        say: 'the step can show the request'

  startingConsent:
    title: Start the consent interaction
    description: >-
      An interaction record (#592) holding the validated request, the consent step and the client display, at most 32
      KiB, with a transaction of the browser session's user, sid and sign-in time, and that session recorded as carried
      in (#964); interaction.created is recorded. At /oauth/authorize a new secret in the __Host-qauth_flow cookie binds
      it to the browser; at a finish, continueInteraction keeps the finished interaction's absolute expiry and adds the
      new secret to the flow secrets the finish left. The exact scope set shown is the record's step params.
    invoke: { external: interactionStore }
    on:
      DONE:
        target: atConsentCeremony
        effect: [openInteraction]
        say: 'the interaction is stored'
      FAIL.tooLarge:
        - guard: atFinish
          target: invalid_request.authorization_too_large_at_finish
          say: 'the record of the next interaction is over 32 KiB'
        - target: invalid_request.authorization_too_large
          say: 'the request is over 16 KiB, or the record over 32 KiB'
      FAIL.server:
        - guard: atFinish
          target: server_error.interaction_store_at_finish
          say: 'the interaction store fails, at the finish of an interaction'
        - target: server_error.interaction_store
          say: 'the interaction store fails'

  atConsentCeremony:
    title: Send the browser to the ceremony page of the consent interaction
    description: The redirect carries the interaction id and nothing else, as core.authorization's atConsentCeremony.
    response:
      status: '302 from /oauth/authorize; 303 for a form post or 200 for a JSON answer at the finish of an interaction'
      headers:
        Location: >-
          /ui/interaction/<the interaction id, 43 base64url characters>, from /oauth/authorize; the same path on the
          realm's issuer, at the finish of an interaction
        Set-Cookie: >-
          __Host-qauth_flow=<the browser's interaction secrets, this one's added>; Path=/; HttpOnly; SameSite=Lax
        Cache-Control: no-store
      body: >-
        none from /oauth/authorize; at the finish of an interaction, a JSON answer gets { result: redirect, location }
    on:
      READ:
        - guard: agentClient
          target: showingStepForAgent
          say: 'the ceremony page reads the step by the interaction id, for an agent client'
        - target: showingStep
          say: 'the ceremony page reads the step by the interaction id'

  # The reads (GET /interaction/v1-rc.0/{id} and GET /interaction/v1-rc.0/{id}/personal)

  showingStep:
    title: Return the consent step
    description: >-
      The step read needs the interaction id only and holds no personal data. Its data is the record's: the scope set
      the answer will grant is the one listed here, and nothing in it is HTML or a URL the client supplied.
    response:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
        Cache-Control: no-store
      body:
        step: 'urn:qauth:ia:consent:v1-rc.0'
        alternatives: '[]'
        csrf: 'the CSRF value of this step view, for one answer'
        brand: "the realm's brand"
        expiresAt: 'when the interaction expires'
        client: >-
          the client display the start computed: kind, verifiedDomain, redirect (host, this_device with the loopback
          warning, or app), declaredName marked declared, newClient
        params:
          scopes: 'the shown scopes, in request order, each { scope, text?, sensitive: false, dangerous }'
          resources: "the request's resource indicators"
          audience: >-
            the token's aud from the client's configured audience, only when the request named no resource and the
            tokens are not for the client itself
          remember_default: 'true'
    on:
      READ_PERSONAL:
        target: showingPersonal
        say: 'the ceremony page reads the personal data, with the flow cookie'
      ANSWER:
        target: checkingAnswer
        say: 'the person allows or denies, with the CSRF value of this view; the answer takes the turn'

  showingStepForAgent:
    title: Return the consent step of an AI agent client
    description: >-
      As showingStep, with params.agent (ADR-014 §11, ADR-019 Decision 6): the screen says "This app is an AI agent."
      and how long it may keep working, in QAuth's own words, from this typed data only, never from the name the client
      declared.
    response:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
        Cache-Control: no-store
      body:
        step: 'urn:qauth:ia:consent:v1-rc.0'
        params:
          agent: >-
            {} when the realm sets no sso_max_lifespan; { max_lifespan: <the realm's sso_max_lifespan, in seconds> }
          others: 'as showingStep'
        others: 'as showingStep'
    on:
      READ_PERSONAL:
        target: showingPersonal
        say: 'the ceremony page reads the personal data, with the flow cookie'
      ANSWER:
        target: checkingAnswer
        say: 'the person allows or denies, with the CSRF value of this view; the answer takes the turn'

  showingPersonal:
    title: Return the consent step's personal data
    description: Only to the browser whose flow cookie binds the interaction, and never from another origin.
    response:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
        Cache-Control: no-store
      body: >-
        { identifier }, the identifier the user signed in with, from the session's side record, when it holds one; {}
        otherwise
    on:
      READ:
        - guard: agentClient
          target: showingStepForAgent
          say: 'the ceremony page reads the step again'
        - target: showingStep
          say: 'the ceremony page reads the step again'
      ANSWER:
        target: checkingAnswer
        say: 'the person allows or denies, with the CSRF value of the step view; the answer takes the turn'

  # The answer (POST /interaction/v1-rc.0/{id}/answer), JSON or a form post

  checkingAnswer:
    title: Check the answer against the consent step's grammar
    description: >-
      { type: urn:qauth:ia:consent:v1-rc.0, csrf, decision: allow | deny, remember?: boolean, default false }, nothing
      else: a member the grammar does not declare is refused, so no answer field can add a scope or a resource. A
      refusal gives the turn back; the step and its CSRF value stay.
    always:
      - guard: malformedAnswer
        target: invalid_answer.grammar
        say: 'the answer does not pass the step grammar'
      - target: takingFinish
        say: 'the answer passes the grammar'

  takingFinish:
    title: End the interaction before anything is decided
    description: >-
      As every finish (#616, #963): the browser session the consent was for must still be live, the record is deleted
      unless the expiry sweep claimed it first, the interaction's secret leaves the flow cookie, and
      interaction.answered (outcome finished) is recorded. No user.signed_in and no last-login update: nobody signed in.
      Only now is the answer decided (finishConsent), so no code is minted while the interaction can still be answered.
    invoke: { external: interactionStore }
    on:
      DONE:
        target: recheckingRequest
        effect: [finishInteraction]
        say: 'the interaction is over'
      FAIL.expired:
        target: interaction_expired.finished_late
        say: 'the expiry sweep claimed the interaction first'
      FAIL.sessionEnded:
        target: interaction_expired.session_ended
        say: 'the session the consent was for has ended, such as by a sign-out in another tab'
      FAIL.server:
        target: server_error.interaction_store_at_finish
        say: 'the interaction store fails; the turn is given back'

  recheckingRequest:
    title: Check the request again, as the endpoint checks it
    description: >-
      checkAuthorizationRequest on the request the record held: the client may have been deleted, disabled or changed
      since the step was shown. A refusal is thrown, so nothing goes to a redirect URI the client no longer holds.
    always:
      - guard: clientGone
        target: invalid_request.client_changed
        say: 'the client, or its redirect URI, no longer passes'
      - guard: clientUnusable
        target: unauthorized_client.client_changed
        say: 'the client may no longer use the endpoint'
      - target: readingDecision
        say: 'the request still passes, or only its dpop_jkt is refused'

  readingDecision:
    title: Read the decision
    description: Deny is answered before anything else of the request is looked at.
    always:
      - guard: denied
        target: access_denied.user_denied
        say: 'the person denied; consent.denied { error: access_denied } is recorded'
      - guard: dpopRefused
        target: invalid_request.dpop_jkt_unreadable
        say: 'the person allowed, and the request is refused for its dpop_jkt'
      - target: findingSession
        say: 'the person allowed'

  findingSession:
    title: Find the session again, with its account
    description: liveBrowserSession, by the sid the interaction holds.
    always:
      - guard: accountDisabled
        target: continuingToSignIn
        effect: [forDisabledAccount]
        say: 'the account was disabled since: the request needs a sign-in'
      - target: checkingAgentCap
        say: 'the session is live and its account may use it'

  checkingAgentCap:
    title: Refuse an agent scope above the client's cap, where the code is minted
    description: ADR-007 §2. findExceedingAgentScopesForClient on the request's scope and the client as it is now.
    always:
      - guard: overAgentCap
        target: invalid_scope.agent_scope_mode_exceeded
        say: >-
          an agent scope is above the cap; consent.denied { error: invalid_scope, reason: agent_scope_mode_exceeded }
          is recorded
      - target: checkingAudience
        say: 'no agent scope is above the cap'

  checkingAudience:
    title: Refuse a QAuth API audience the client no longer lists
    description: unlistedReservedAudiences (#509), on the client as it is now.
    always:
      - guard: audienceUnlisted
        target: invalid_target.unlisted_reserved_audience
        say: >-
          a resource names a QAuth API audience the client does not list; consent.denied { error: invalid_target,
          reason: reserved_audience_not_listed } is recorded
      - target: checkingAgentKind
        say: 'every QAuth API audience among the resources is one the client lists'

  checkingAgentKind:
    title: Check that the client is still what the step said
    description: >-
      params.agent present against isAgentClient(client) now (#845): the person must not allow an agent that the step
      did not name as one, nor see an agent line for a client that is no agent any more.
    always:
      - guard: agentChanged and agentClient
        target: decidingAgain
        effect: [ceasedAgent]
        say: 'the step named an AI agent, and the client is no agent now; nothing is granted'
      - guard: agentChanged
        target: decidingAgain
        effect: [becameAgent]
        say: 'the step named no agent, and the client is an AI agent now; nothing is granted'
      - target: checkingScopes
        say: 'the client is what the step said'

  decidingAgain:
    title: Decide the request again for the client as it is now
    description: >-
      decideAuthorization, as core.authorization runs it at a finish, logged at warn and with no event of its own. It
      normally asks for consent again, and a new consent interaction starts, whose step names the client as it is now;
      its other outcomes are core.authorization's.
    always:
      - target: describingClient
        effect: [nextInteraction]
        say: 'the decision asks for consent: a new consent interaction continues the request'

  checkingScopes:
    title: Grant only the scopes the step showed, while the client may still have them
    description: >-
      The shown scopes, filtered by the client's allowlist as it is now, must be the shown set. The grant is the shown
      set, from the record: never the request's scope parameter, never a field of the answer.
    always:
      - guard: scopesNarrowed
        target: invalid_scope.consent_scope_mismatch
        say: >-
          the client may no longer have every shown scope; consent.denied { error: invalid_scope, reason:
          consent_scope_mismatch } is recorded
      - target: checkingResources
        say: 'the shown scopes are still grantable'

  checkingResources:
    title: Grant only the resources the step showed
    description: RFC 8707. The shown resources must be the request's.
    always:
      - guard: resourcesDiffer
        target: invalid_target.consent_resource_mismatch
        say: >-
          the shown resources are not the request's; consent.denied { error: invalid_target, reason:
          consent_resource_mismatch } is recorded
      - target: checkingStepUp
        say: "the shown resources are the request's"

  checkingStepUp:
    title: Ask for a fresh sign-in when the grant needs one
    description: >-
      ADR-007 §2. evaluateStepUp with the shown scopes, no prior consent scopes (every scope about to be granted counts
      as new, so a stored grant cannot skip the gate), the request's prompt and max_age, the session's sign-in time,
      the two-minute window, the client's policy (agentStepUpEnforced) and forcesLoginPrompt(client) for a
      native_backend client.
    always:
      - guard: needsFreshLogin
        target: continuingToSignIn
        effect: [forFreshLogin]
        say: >-
          the sign-in is too old for what is asked; step_up.required { reason: fresh_authentication_required or
          native_profile_login_required, dangerousScopes?, prompt?, maxAge? } is recorded
      - target: mintingCode
        say: 'the sign-in is fresh enough'

  mintingCode:
    title: Mint the authorization code, in the mint transaction
    description: >-
      One READ COMMITTED transaction (MINT_TRANSACTION) begins with mintAuthorizationCode: the shown scopes, the shown
      resources, the request's code_challenge and method, nonce, state, redirect_uri and dpop_jkt, the session's sign-in
      time, assurance level, expiry and sid. It locks the session's row and refuses a session that has ended; nothing
      is written then, and authorization.failed { error: login_required, reason: session_ended_during_authorization }
      is recorded.
    invoke: { action: AuthorizationCode.mint }
    on:
      DONE:
        - guard: remember
          target: savingConsent
          effect: [writeCode]
          say: 'the code is written, and the person asked to remember the decision'
        - target: recordingGrant
          effect: [writeCode]
          say: 'the code is written, for this request only'
      FAIL.sessionEnded:
        target: continuingToSignIn
        effect: [forEndedSession]
        say: 'the session ended under the request; nothing is written'
      FAIL.server:
        target: server_error.store_at_finish
        say: 'the database fails, or three codes in a row collide; nothing is written'

  savingConsent:
    title: Save the grant, in the same transaction
    description: >-
      oauthConsents.upsertGrant(realm, user, client, the shown scopes, the shown resources): one active oauth_consents
      row, merged with a prior grant of the client. A later request that fits it skips the step through canSkipConsent.
    invoke: { action: Consent.grant }
    on:
      DONE:
        target: recordingGrant
        effect: [writeGrant]
        say: 'the grant is written'
      FAIL.server:
        target: server_error.store_at_finish
        effect: [rollBack]
        say: 'the database fails; the transaction rolls back and no code is left'

  recordingGrant:
    title: Record the grant, in the same transaction, and commit
    description: >-
      step_up.elevated { scopes, dangerousScopes, scopeMode?, authenticatedAt } when a dangerous scope is granted
      (scopeMode only for an agent client), then consent.granted { scopes, remembered, dangerousScopes? }. The code, the
      grant and both events commit together.
    invoke: { external: eventStore }
    on:
      DONE:
        target: code_issued
        effect: [commit]
        say: 'the events are recorded and the transaction commits'
      FAIL.server:
        target: server_error.store_at_finish
        effect: [rollBack]
        say: 'the event store fails; the transaction rolls back and neither the code nor the grant is left'

  continuingToSignIn:
    title: Continue the request in a new sign-in interaction
    description: >-
      continueInteraction at the identifier step, carrying the session in (#964) so that "Not you?" can end it, within
      the finished interaction's absolute expiry. The person signs in afresh, the request is decided again and the
      consent step is shown again. No code.
    invoke: { external: interactionStore }
    on:
      DONE:
        - guard: "signInCause == 'freshLogin'"
          target: sign_in_continues.fresh_login
          say: 'the sign-in interaction is stored, for a step-up'
        - guard: "signInCause == 'accountDisabled'"
          target: sign_in_continues.account_disabled
          say: 'the sign-in interaction is stored, for a disabled account'
        - target: sign_in_continues.session_ended
          say: 'the sign-in interaction is stored, for a session that ended under the request'
      FAIL.tooLarge:
        target: invalid_request.authorization_too_large_at_finish
        say: 'the record of the next interaction is over 32 KiB'
      FAIL.server:
        target: server_error.interaction_store_at_finish
        say: 'the interaction store fails'

  # Exits: success

  code_issued:
    type: final
    title: Send the authorization code to the client
    redirect: success
    carries: [code, state, iss]
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with code (43 base64url characters), state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  # Exits: a new interaction continues the request

  sign_in_continues.fresh_login:
    type: final
    title: Send the browser to sign in afresh before the grant
    redirect: never
    response: &signInContinues
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, the ceremony page of the new interaction on the realm's issuer: <issuer>/ui/interaction/<the
          interaction id>
        Set-Cookie: "__Host-qauth_flow with the new interaction's secret, and without the finished interaction's"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  sign_in_continues.account_disabled:
    type: final
    title: Send the browser to sign in, for an account disabled since the step was shown
    redirect: never
    response: *signInContinues

  sign_in_continues.session_ended:
    type: final
    title: Send the browser to sign in, for a session that ended under the request
    redirect: never
    response: *signInContinues

  # Exits: errors redirected to the client, once the person has used QAuth's pages

  access_denied.user_denied:
    type: final
    title: Tell the client the person denied the request
    redirect: error
    code: access_denied
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=access_denied, error_description=User denied the authorization
          request., state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_request.dpop_jkt_unreadable:
    type: final
    title: Tell the client its dpop_jkt is malformed, now that DPoP is on
    redirect: error
    code: invalid_request
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_request, error_description=dpop_jkt must be the base64url
          SHA-256 JWK thumbprint of a DPoP key, state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_scope.agent_scope_mode_exceeded:
    type: final
    title: Tell the client an agent scope is above its cap
    redirect: error
    code: invalid_scope
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_scope, error_description=requested scope exceeds the agent
          scope mode for this client, state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_target.unlisted_reserved_audience:
    type: final
    title: Tell the client it named a QAuth API audience it does not list
    redirect: error
    code: invalid_target
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_target, error_description=a QAuth API audience is issued
          only to a client that lists it, state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_scope.consent_scope_mismatch:
    type: final
    title: Refuse a shown scope set the client may no longer have
    redirect: error
    code: invalid_scope
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_scope, error_description=a scope the consent step showed is
          no longer allowed for the client, state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_target.consent_resource_mismatch:
    type: final
    title: Refuse shown resources that are not the request's
    redirect: error
    code: invalid_target
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_target, error_description=the consent step showed other
          resources than the request names, state when the request had one, and iss
        Set-Cookie: "__Host-qauth_flow without the finished interaction's secret"
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  # Exits: the start refused

  invalid_scope.consent_not_shown:
    type: final
    title: Tell the client the consent step cannot show its scopes
    redirect: error
    code: invalid_scope
    response:
      status: 302
      headers:
        Location: >-
          redirect_uri with error=invalid_scope, error_description=the requested scopes cannot be shown for consent,
          state when the request had one, and iss

  invalid_scope.consent_not_shown_shown:
    type: final
    title: Show, rather than redirect, that error for a client no operator provisioned
    redirect: never
    code: invalid_scope
    response: &shown
      status: 400
      headers:
        Content-Type: text/html; charset=utf-8
        Cache-Control: no-store
      body: >-
        a page titled "Sign-in not completed" that names the error with its description and the host of redirect_uri,
        and, for an http(s) redirect URI, a link "Continue to <host>" carrying the whole error response

  invalid_scope.consent_not_shown_at_finish:
    type: final
    title: Tell the client the consent step cannot show its scopes, at the finish of an interaction
    redirect: error
    code: invalid_scope
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_scope, error_description=the requested scopes cannot be
          shown for consent, state when the request had one, and iss
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_target.consent_not_shown:
    type: final
    title: Tell the client the consent step cannot show its resources
    redirect: error
    code: invalid_target
    response:
      status: 302
      headers:
        Location: >-
          redirect_uri with error=invalid_target, error_description=the requested resources cannot be shown for
          consent, state when the request had one, and iss

  invalid_target.consent_not_shown_shown:
    type: final
    title: Show, rather than redirect, that error for a client no operator provisioned
    redirect: never
    code: invalid_target
    response: *shown

  invalid_target.consent_not_shown_at_finish:
    type: final
    title: Tell the client the consent step cannot show its resources, at the finish of an interaction
    redirect: error
    code: invalid_target
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_target, error_description=the requested resources cannot be
          shown for consent, state when the request had one, and iss
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_target.audience_not_shown:
    type: final
    title: Tell the client the consent step cannot show its audience
    redirect: error
    code: invalid_target
    response:
      status: 302
      headers:
        Location: >-
          redirect_uri with error=invalid_target, error_description=the client's audience cannot be shown for consent,
          state when the request had one, and iss

  invalid_target.audience_not_shown_shown:
    type: final
    title: Show, rather than redirect, that error for a client no operator provisioned
    redirect: never
    code: invalid_target
    response: *shown

  invalid_target.audience_not_shown_at_finish:
    type: final
    title: Tell the client the consent step cannot show its audience, at the finish of an interaction
    redirect: error
    code: invalid_target
    response:
      status: '303 for a form post; 200 for a JSON answer'
      headers:
        Location: >-
          for a form post, redirect_uri with error=invalid_target, error_description=the client's audience cannot be
          shown for consent, state when the request had one, and iss
        Cache-Control: no-store
      body: 'for a JSON answer, { result: redirect, location: the same URL }'

  invalid_request.redirect_uri_not_shown:
    type: final
    title: Refuse a redirect URI the consent step cannot describe, at /oauth/authorize
    redirect: never
    code: invalid_request
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: redirect_uri cannot be shown

  invalid_request.redirect_uri_not_shown_at_finish:
    type: final
    title: Refuse a redirect URI the consent step cannot describe, at the finish of an interaction
    redirect: never
    code: invalid_request
    response: &invalidRequestProblem
      status: 400
      headers:
        Content-Type: application/problem+json
        Cache-Control: no-store
      body:
        type: https://docs.qauth.dev/reference/problem-types/#invalid-request
        status: 400
        code: invalid_request
        trace_id: the request id

  invalid_request.authorization_too_large:
    type: final
    title: Refuse a request too large to hold in an interaction, at /oauth/authorize
    redirect: never
    code: invalid_request
    response:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: invalid_request
        error_description: authorization request is too large

  invalid_request.authorization_too_large_at_finish:
    type: final
    title: Refuse a next interaction too large to hold
    redirect: never
    code: invalid_request
    response: *invalidRequestProblem

  server_error.interaction_store:
    type: final
    title: Fail the request when the interaction store fails, at /oauth/authorize
    redirect: never
    code: server_error
    response:
      status: 500
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: server_error

  # Exits: refusals of the Interaction API, bare problem documents

  invalid_answer.grammar:
    type: final
    title: Refuse an answer the consent step's grammar does not accept
    description: The interaction stays at the step, with its CSRF value; nothing is finished or granted.
    redirect: never
    code: invalid_answer
    response:
      status: 400
      headers:
        Content-Type: application/problem+json
        Cache-Control: no-store
      body:
        type: https://docs.qauth.dev/reference/problem-types/#invalid-answer
        status: 400
        code: invalid_answer
        trace_id: the request id

  interaction_expired.finished_late:
    type: final
    title: Refuse an answer the expiry sweep beat
    description: The sweep reports the interaction expired; nothing is issued.
    redirect: never
    code: interaction_expired
    response: &expired
      status: 410
      headers:
        Content-Type: application/problem+json
        Cache-Control: no-store
      body:
        type: https://docs.qauth.dev/reference/problem-types/#interaction-expired
        status: 410
        code: interaction_expired
        trace_id: the request id

  interaction_expired.session_ended:
    type: final
    title: Refuse an answer whose browser session ended since the step was shown
    description: Nothing is written; the turn is given back and the step stays (#963).
    redirect: never
    code: interaction_expired
    response: *expired

  invalid_request.client_changed:
    type: final
    title: Refuse an answer whose client or redirect URI no longer passes
    description: No redirect goes to a URI the client may no longer hold, whatever the decision was.
    redirect: never
    code: invalid_request
    response: *invalidRequestProblem

  unauthorized_client.client_changed:
    type: final
    title: Refuse an answer whose client may no longer use the endpoint
    redirect: never
    code: unauthorized_client
    response:
      status: 400
      headers:
        Content-Type: application/problem+json
        Cache-Control: no-store
      body:
        type: https://docs.qauth.dev/reference/problem-types/#unauthorized-client
        status: 400
        code: unauthorized_client
        trace_id: the request id

  server_error.interaction_store_at_finish:
    type: final
    title: Fail the answer when the interaction store fails
    redirect: never
    code: server_error
    response: &problem500
      status: 500
      headers:
        Content-Type: application/problem+json
      body:
        type: https://docs.qauth.dev/reference/problem-types/#internal-error
        status: 500
        code: internal_error
        trace_id: the request id

  server_error.store_at_finish:
    type: final
    title: Fail the answer when the mint transaction fails
    description: 'The transaction rolls back: no code, no grant and no event of the grant is left.'
    redirect: never
    code: server_error
    response: *problem500

assertions:
  - id: step-only-for-a-request-it-can-show
    never: "interactionOpen and startGate != 'shown'"
    say: >-
      A consent interaction exists only for a request whose client display and step data can be shown: a redirect URI
      the display cannot describe, or scopes, resources or an audience the step cannot carry, refuse the start
  - id: an-agent-is-named-as-one
    never: "(state == 'showingStep' and agentClient) or (state == 'showingStepForAgent' and not agentClient)"
    say: >-
      The step of an AI agent client carries the agent marker, and the step of a client that is no agent never does
  - id: no-code-without-the-finish
    never: "(codeWritten or grantWritten or state == 'code_issued') and (interactionOpen or not finished)"
    say: >-
      Nothing is minted or granted until the interaction has finished: never while it can still be answered, so a
      replayed answer, or one the expiry sweep beat, issues nothing
  - id: no-answer-field-reaches-the-grant
    never: "(codeWritten or grantWritten or state == 'code_issued') and malformedAnswer"
    say: >-
      An answer that carries anything beyond its decision and the remember choice, such as a scope or a resource, is
      refused, so no answer can add a scope the person did not see
  - id: only-the-shown-set-is-granted
    never: "(codeWritten or grantWritten or state == 'code_issued') and (scopesNarrowed or resourcesDiffer)"
    say: >-
      The code and the grant are for exactly the scope set and resources the step showed, and only while the client may
      still have them
  - id: no-code-on-a-stale-sign-in
    never: "(codeWritten or grantWritten or state == 'code_issued') and needsFreshLogin"
    say: 'No code is minted and nothing granted on a sign-in older than what the request or its scopes ask for'
  - id: dangerous-scope-signs-in-afresh-first
    never: >-
      allowGate == 'dangerousScope' and state in ['mintingCode', 'savingConsent', 'recordingGrant', 'code_issued']
    say: >-
      A dangerous scope on a sign-in more than two minutes old reaches no code: the person is sent to a fresh sign-in
      first (outside development)
  - id: no-code-above-the-agent-cap
    never: "(codeWritten or grantWritten or state == 'code_issued') and overAgentCap"
    say: 'A client over its agent scope cap gets invalid_scope, and no code is minted and no grant saved'
  - id: no-code-for-a-changed-client
    never: "(codeWritten or grantWritten or state == 'code_issued') and (recheck != 'unchanged' or agentChanged)"
    say: >-
      No code is minted for a client that no longer passes the endpoint's checks, or that changed whether it is an AI
      agent since the step was shown
  - id: deny-grants-nothing
    never: >-
      denied and (codeWritten or grantWritten or state in ['code_issued', 'sign_in_continues.fresh_login',
      'sign_in_continues.account_disabled', 'sign_in_continues.session_ended', 'decidingAgain'])
    say: 'A denial mints no code, saves no grant and starts no further interaction'
  - id: access-denied-only-for-a-denial
    never: "state == 'access_denied.user_denied' and not denied"
    say: 'access_denied goes to the client, with state and iss, only when the person denied'
  - id: remembered-only-when-asked
    never: 'grantWritten and not remember'
    say: 'A grant is saved only when the answer carries remember true'
  - id: grant-only-in-the-code-transaction
    never: 'grantWritten and not codeWritten'
    say: "A grant is written only in the transaction that mints the request's code"
  - id: code-issued-means-committed-and-remembered-as-asked
    never: "state == 'code_issued' and (not committed or not codeWritten or (remember and not grantWritten))"
    say: >-
      The code reaches the client only once the code, the grant the person asked to remember and the events have
      committed together
  - id: nothing-left-after-a-failed-mint
    never: >-
      state in ['server_error.store_at_finish', 'sign_in_continues.session_ended'] and (codeWritten or
      grantWritten)
    say: 'A mint transaction that fails, or finds the session ended, leaves no code and no grant'
