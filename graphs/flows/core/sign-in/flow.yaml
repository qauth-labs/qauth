# The sign-in engine (PRO-09, #614; ADR-017 Decisions 4 and 7, ADR-019 Decision 6): the one engine that decides every
# step of a sign-in, whatever the transport. Written before the code (status: proposed), as ADR-021 Decision 4 asks of
# a new core flow. It replaces the baseline that #613 captured here: that graph, of the server-rendered /ui/login page,
# is now graphs/flows/core/sign-in-page, and keeps its own rules until the ceremony app serves the sign-in (#709).
#
# - This flow has no screen and no HTTP route. A transport calls the engine once per round with the transaction it
#   holds, the round's answer and the round's context: the Interaction API for browser ceremonies (#616) and the FiPA
#   authorization challenge endpoint for native apps (#646). Each transport maps what the engine answers onto its own
#   wire with the step grammar's mappers (#591), and keeps the transaction between rounds. So an exit here is the
#   engine's answer, as data; the transport's checks (rule 1) and client authentication (rule 2) come before it, and the
#   session or the code it mints after a completed sign-in, are the transport's own graphs.
# - The states run in the order of ADR-017 Decision 4, from rule 3. Rules 3 to 5 are hooks that later issues fill: the
#   limiters (PRO-13, #636), the request checks of the transport (#628, #665) and the bot challenge (PRO-19, #643). The
#   per-account ladder (PRO-12, #615) is a hook too; its reservation is the last thing before a password is verified,
#   so that every verified credential was reserved first.
# - The identifier and password steps exist here, and the inline verification of an unverified account after its
#   correct password (PRO-15, #638), which flows/core/account-verification draws: an emailed code that proves the
#   address and is never a factor. Passkeys (#651) are a step handler of the engine, drawn by flows/core/passkey; TOTP
#   (#653) is one a later issue registers, and until then a sign-in that needs it is answered with a redirect.
# - The breach-list check and the forced password update (#635; ADR-017 Decision 4 rule 8 and Decision 8, ADR-018 §3,
#   ADR-020 §3): a right password is checked against the realm's breach list (password.breachListSource) before the
#   subject is fixed, since QAuth keeps only its hash. A listed password, or an update_password required action an
#   admin or the person's "this wasn't me" left on the account, asks for a new password after every factor the sign-in
#   needs and before any session or code. The password alone never sets a new one: a factor beyond it comes first, or,
#   on an account whose only factor is its password, a code mailed to its address, as a reset asks for one. A check
#   that fails never blocks the sign-in. The CER issue adds the screens (ui.yaml).
# - A round that ends in a step keeps the transaction live: the next round's answer is a new event from that state. A
#   due bot challenge (`botChallengeDue`) ends the walk at its step: the pending step resumes after a right answer. A
#   refused round (`throttled`, `lockedOut`, `unavailable`, `requestRefused`, `answerRefused`)
#   keeps the transaction as far as the round took it (an identifier it fixed stays, nothing it refused is in it), and
#   the next round starts from there; the graph ends the walk at the refusal, so that each refusal is one exit. A
#   completed sign-in, a redirect and an ended transaction return no transaction: nothing can complete twice.
# - An ended transaction says why (`cause`, the reason its end was audited as, #1081). The Interaction API starts the
#   sign-in again at its first step, and that step's read carries a notice from a closed set, once: code_burned and
#   subject_mismatch as such, every other cause as expired. The notice names no account, and reads the same for every
#   identifier until a factor succeeded (ADR-017 Decision 4): a reset's code step is the same for every address.
# - The switch to a registration (#1079; ADR-017 Decision 8, ADR-019 Decision 6): on an authorization request's
#   interaction, the first step offers the register path marker last, while the realm allows sign-up, the client's
#   hosted_flows name register and the request asks for no fresh sign-in, under the same rules as prompt=create, read
#   on every round. No account is read for it. Answering it turns the transaction into a registration, which
#   flows/core/sign-up draws, at its first round; the held request is the same, and so is the code it ends in.
schema: delurio-graph/0
kind: flow
id: core.sign-in
status: proposed
domain: qauth
title: Decide a sign-in, one round at a time
summary: >-
  A transport hands the engine a round: the transaction so far, an answer, and the realm, the client and the request
  the round is for. The engine reads the realm's and the client's MFA policy, runs the hooks of the limiters, the
  request checks and the bot challenge, takes the identifier from the request's login_hint or from an answer, and asks
  for the password. Until a factor succeeds, every answer is the same for every account: an unknown identifier, a
  password-only, passkey-only, disabled or locked account all get the password step again with invalid_credentials,
  after one Argon2id verification and the 500 ms floor. A correct password fixes the subject; an account whose
  address is not proved yet then verifies it with an emailed code under the realm's gate, where a code can arrive (with
  the gate off it signs in unverified; under it, where no code can arrive, it is refused); the sign-in
  completes when the account's strongest bound factor (a new one, #1064, is not) and the MFA policy are met, and the
  transport then mints the
  session or the code. A right password on the realm's breach list, or an update the account owes, first asks for a
  new password, after a mailed code when the password is the account's only factor. A different identifier in a later
  round ends the transaction.

scope:
  shows: >-
    one sign-in transaction of the engine, round by round, from the transport's call to the engine's answer, with the
    identifier and password steps
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the transport's own checks and client authentication (rules 1 and 2 of ADR-017 Decision 4), its wire, and
      what it mints once the engine answers complete: a browser session (the Interaction API) or an authorization code
      (the FiPA endpoint)"
    - "what the hooks decide inside: the limiters (#636), the request checks (#628, #665), the bot challenge and its
      captcha step (#643), the ladder's waits, counts and disable ceiling (#615); with no hook registered, each one lets
      the round through"
    - 'the steps drawn by their own flows: passkeys, passkey-first, the downgrade rule and the enrolment offer
      (flows/core/passkey, #651), registration (#640), reset (#642), recovery codes (#649); and TOTP (#653), until
      which an MFA policy that requires a second factor answers a redirect'
    - 'the rounds of the inline verification, drawn by flows/core/account-verification: the code, its mail through
      the send caps, its ladder, its expiry and its burn. An engine built without email codes, which no transport of
      the auth server is, refuses an unverified account under REQUIRE_VERIFIED_ACCOUNT like a wrong password instead'
    - 'the per-transaction budgets of the FiPA auth_session (#647): rounds and failures per step'
    - "the registration a register answer switches to, drawn by flows/core/sign-up from its gate: the bot challenge
      first where the realm or the client requires one, and the sign_in marker beside its address step, which leads
      back here; the Interaction API's start, which offers the marker beside the identifier step under the same gate"
    - "the forced update's screens, which the CER issue adds as this flow's ui.yaml; and the legacy /auth/login and
      /ui/login, which keep their own rules (flows/core/sign-in-token, flows/core/sign-in-page) and check no breach
      list until the browser sign-in runs on this engine (#709)"
    - 'the second factor an account has, which it answers before the forced update (TOTP, #653): until its step exists
      the engine answers a redirect; an account with a passkey proves it by the downgrade rule before the update (#651)'
    - "how the breach list is checked: the operator's local list (BREACHED_PASSWORD_LIST_PATH), loaded at boot and
      again when its file changes, matched by the password's SHA-1; or a k-anonymity range lookup through the egress client to
      the operator's host (BREACHED_PASSWORD_RANGE_URL), which carries the first five hex characters of that SHA-1 and
      nothing else of the password"
    - "the rounds of the forced update's new password: each runs rules 3 to 8 again first, as drawn above, and this
      graph draws what follows them"
    - 'the required actions other than update_password (setup_mfa, setup_passkey, complete_profile): the steps of
      PRO-28 and PRO-29'
    - 'a store failure while an audit record is written: the round fails, and the transport answers it as a failed
      round of its own'
    - "a password answer outside the password step's answer schema (an empty password, one over 256 UTF-16 code units)
      is refused as a request fault when the password step is next, and ignored like any other answer otherwise; it
      verifies nothing and counts nothing"
    - 'an answer to a step the engine did not ask for, a password_reset answer included, is ignored with its
      login_hint; only the identifier and password answers carry one'
    - "a failure of the password verifier or of the identifier key refuses the round as unavailable, alike for every
      identifier; a failure to settle the ladder's reservation is reported and changes no answer; a failure to write
      the identifier's audit record leaves the identifier unfixed, so the next round records it"
    - "a later round of a transaction whose subject is fixed reads the account again: one that is gone, belongs to
      another user or was disabled since ends the transaction, audited under the subject; another user's proof does
      too, whatever that user's state"
    - 'a step refused before the transaction holds any identifier (a bot challenge, a discoverable passkey from #651)
      is audited naming nobody'
    - 'the transaction is not sealed, so the transport keeps it server-side under an unguessable handle bound to the
      realm and the client. Before anything else a round ends one that is not well formed, belongs to another realm or
      client, begins more than a minute in the future or is older than two hours, audited as transaction_invalid or
      transaction_expired naming nobody'
    - 'a factor that names its account by itself (a discoverable passkey, #651), answered while the transaction holds
      an identifier, must prove the account that identifier names; another account ends the transaction as
      subject_mismatch'

context:
  # The transport's authorization request carries a login_hint. It is frozen at round 0, so every round sees the same.
  loginHint:
    values: [absent, given]
    initial: any
    say:
      absent: 'the authorization request carries no login_hint'
      given: 'the authorization request carries a login_hint, a valid email address of at most 254 bytes'
  # What the round's answer is. Set by the round's event.
  answer:
    values: [none, identifier, password, passwordWithHint, malformed, register]
    initial: none
  # The account the identifier names, if any. The engine never tells these apart before a factor succeeds.
  account:
    values:
      - unknown
      - passwordOnly
      - passwordAndPasskey
      - passkeyOnly
      - passwordDisabled
      - disabled
      - unverified
      - passwordAndSecondFactor
    initial: any
    say:
      unknown: 'no account in the realm holds the identifier'
      passwordOnly: >-
        an enabled, verified account whose only factor is its password, or whose every other factor is new (#1064:
        bound after a sign-in that proved only the password, inside the realm's window), which signs in as usual but
        is not the strongest factor
      passwordAndPasskey: >-
        an enabled, verified account with a password and a passkey that is not new; the passkey counts as bound even
        while it is disabled
      passkeyOnly: 'an enabled account with a passkey and no password'
      passwordDisabled: >-
        an enabled account whose password the ladder's hard action disabled (user_credentials.disabled_at, #615): it
        is unusable, and still bound
      disabled: 'an account whose users.enabled is false, with a password'
      unverified: >-
        an enabled account with a password whose primary identity, its address, is not proven yet: it is verified
        inline after its correct password
      passwordAndSecondFactor: >-
        an enabled, verified account with a password and a second factor (TOTP, #653), which the MFA policy may or may
        not ask for; a new one (#1064) is asked for only by the MFA policy
  password:
    values: [right, wrong]
    initial: any
    say:
      right: "the answered password is the account's"
      wrong: 'it is another one'
  requireVerified:
    values: [true, false]
    initial: any
    say:
      'true': 'REQUIRE_VERIFIED_ACCOUNT is on, the default; an unverified account is verified inline'
      'false': 'REQUIRE_VERIFIED_ACCOUNT=false; an unverified account is verified inline all the same'
  # The realm's and the client's MFA policy as the engine reads it on this round, never from the transaction.
  mfa:
    values: [notRequired, required]
    initial: any
    say:
      notRequired: >-
        neither the realm nor the client requires a second factor for this account: the default until the policy has
        its storage (Foundations, the admin console)
      required: 'the realm or the client requires a second factor, or requires one for admins and the account is one'
  # The realm's breach-list source (password.breachListSource, #635), and what checking the right password found.
  breachList:
    values: [off, notListed, listed, failed]
    initial: any
    say:
      off: 'the realm checks no breach list: password.breachListSource is off, the default'
      notListed: "the realm checks a breach list, the operator's local list or a range lookup, and the password is not on it"
      listed: "the password is on the realm's breach list"
      failed: >-
        the realm checks a breach list and the check fails: no list is loaded or configured, or the lookup fails or
        the egress client refuses it
  # Whether the account holds an update_password required action: an admin asked for one, or the person reported a
  # sign-in that was not theirs (#635; the admin API of #700 and the account console of #689 write it).
  updateRequested:
    values: [false, true]
    initial: any
    say:
      'false': 'the account holds no update_password required action'
      'true': 'the account holds an update_password required action'
  # The new password the person answers the forced update with, as the policy and the breach list judge it.
  newPassword:
    values: [accepted, rejected, listed, checkFailed]
    initial: any
    say:
      accepted: "the realm's password policy accepts it, and it is not on the realm's breach list or the realm checks none"
      rejected: 'the password policy refuses it: too short, too long, a whole blocklisted word, or too weak'
      listed: "it is on the realm's breach list"
      checkFailed: 'the policy accepts it and the breach-list check fails: it is accepted, the failure recorded'
  # The checks of rules 3 to 5 run in a fixed order and each refuses on its own, so one variable says which of them a
  # round fails first, if any; the ladder's check is the last before the password is verified.
  gate:
    values: [open, switchClosed, limited, requestRefused, botChallengeDue, lockedOut]
    initial: any
    say:
      open: >-
        every hook lets the round through, and so would the switch to a registration's gate (#1079): the transport lets
        the flows switch (an authorization request's interaction, never a sign-in to link an upstream account) and
        serves the registration's steps, the request has no max_age and no prompt=login, the realm allows sign-up and
        the client's hosted_flows name register
      switchClosed: >-
        every hook lets the round through, and the switch to a registration's gate does not hold (#1079); the realm's
        part is read only when the rest holds
      limited: 'a limiter refuses the round (per client, per end-user IP): a 429 with Retry-After'
      requestRefused: >-
        the transport's request checks refuse the round, such as acr_values, prompt=none or a frozen parameter at the
        FiPA endpoint
      botChallengeDue: >-
        a soft threshold asks for a bot challenge (#643): of the limiters (an end-user IP, its bucket or the client
        past its free failures) or of the ladder (the round's identifier past the password's or the email code's free
        failures), while the transaction holds no unspent pass of an earlier challenge
      lockedOut: >-
        the identifier's ladder is inside a wait: the identifier HMAC's counter, whether or not an account holds it
  # Whether the transport serves the captcha step: the Interaction API does; a FiPA client that did not list it in
  # its first_party_policy.steps does not (#643).
  captchaServed:
    values: [false, true]
    initial: any
    say:
      'false': 'the transport does not serve the captcha step'
      'true': 'the transport serves the captcha step'
  # The bot challenge's provider, when a challenge is due: the built-in proof of work, or a hosted provider the
  # egress client reaches (#643).
  challengeProvider:
    values: [answers, down]
    initial: any
    say:
      answers: 'the provider can issue a challenge and check its answer'
      down: 'no provider is registered, or the hosted provider cannot be reached or answers out of shape'
  # Whether the identifiers a round brings differ: from the one the transaction holds, or from each other.
  differentIdentifier:
    values: [false, true]
    initial: any
    say:
      'false': 'every identifier a round brings is the one the transaction holds, after normalisation'
      'true': >-
        a round brings another identifier than the one the transaction holds (another login_hint, another identifier
        answer), or the request's login_hint and the answer's differ
  identifierHeld: { values: [false, true], initial: false }
  subjectFixed: { values: [false, true], initial: false }
  # this round read the account the identifier names (its user, enabled flag and password)
  accountRead: { values: [false, true], initial: false }
  # this round read the whole account a factor proved (every factor, its admin role)
  provenAccountRead: { values: [false, true], initial: false }
  # this round ran Argon2id against the account's hash
  hashVerified: { values: [false, true], initial: false }
  # this round ran Argon2id against the dummy hash
  decoyVerified: { values: [false, true], initial: false }
  # this round reserved an attempt on the ladder, which counts it as a failure until it settles as a success
  attemptReserved: { values: [false, true], initial: false }
  # the round waited out MIN_RESPONSE_TIME_MS.LOGIN (500 ms), counted from the round's arrival
  floorWaited: { values: [false, true], initial: false }
  # an answer to a step that is not the next one was ignored this round
  answerIgnored: { values: [false, true], initial: false }
  # the audit record of this round named the person by the identifier HMAC, not by a user id
  auditedByHmac: { values: [false, true], initial: false }
  # the inline verification marked the account's address verified, in this transaction
  addressVerified: { values: [false, true], initial: false }
  # the transaction holds that the right password was on the breach list: it must be replaced before completing
  breachedHeld: { values: [false, true], initial: false }
  # a code mailed for the forced update proved the account's mailbox, in this transaction
  mailboxProved: { values: [false, true], initial: false }
  # a breach-list check that failed was counted on the metric and recorded in the audit log
  breachFailureRecorded: { values: [false, true], initial: false }
  # the forced update wrote the new password and cleared the update_password required action
  passwordUpdated: { values: [false, true], initial: false }

guards:
  limited: "gate == 'limited'"
  requestRefused: "gate == 'requestRefused'"
  botChallengeDue: "gate == 'botChallengeDue'"
  challengeOffered: "gate == 'botChallengeDue' and captchaServed and challengeProvider == 'answers'"
  challengeUnanswerable: "gate == 'botChallengeDue' and captchaServed and challengeProvider == 'down'"
  lockedOut: "gate == 'lockedOut'"
  malformedAnswer: "answer == 'malformed'"
  registerAnswered: "answer == 'register'"
  switchOpen: "gate == 'open'"
  roundBringsIdentifier: "loginHint == 'given' or answer in ['identifier', 'passwordWithHint']"
  answerBringsIdentifier: "answer in ['identifier', 'passwordWithHint']"
  identifierMismatch: >-
    differentIdentifier and ((identifierHeld and roundBringsIdentifier) or (loginHint == 'given' and
    answerBringsIdentifier))
  noIdentifier: 'not identifierHeld and not roundBringsIdentifier'
  passwordAnswered: "answer in ['password', 'passwordWithHint']"
  noUsablePassword: "account in ['unknown', 'passkeyOnly', 'passwordDisabled']"
  wrongPassword: "password == 'wrong'"
  userDisabled: "account == 'disabled'"
  unverified: "account == 'unverified'"
  passkeyBound: "account == 'passwordAndPasskey'"
  mfaRequired: "mfa == 'required'"
  breachListChecked: "breachList != 'off'"
  passwordListed: "breachList == 'listed'"
  breachCheckFailed: "breachList == 'failed'"
  updateDue: '(breachedHeld or updateRequested) and not passwordUpdated'
  secondFactorBound: "account == 'passwordAndSecondFactor'"
  mailboxShown: 'addressVerified or mailboxProved'
  newPasswordRejected: "newPassword == 'rejected'"
  newPasswordListed: "newPassword == 'listed'"

effects:
  # each round starts with nothing done
  newRound:
    set:
      accountRead: false
      provenAccountRead: false
      hashVerified: false
      decoyVerified: false
      attemptReserved: false
      floorWaited: false
      answerIgnored: false
      auditedByHmac: false
  answerNone: { set: { answer: none } }
  answerIdentifier: { set: { answer: identifier } }
  answerPassword: { set: { answer: password } }
  answerPasswordWithHint: { set: { answer: passwordWithHint } }
  answerMalformed: { set: { answer: malformed } }
  answerRegister: { set: { answer: register } }
  holdIdentifier: { set: { identifierHeld: true } }
  ignoreAnswer: { set: { answerIgnored: true } }
  reserveAttempt: { set: { attemptReserved: true } }
  readAccount: { set: { accountRead: true } }
  readProvenAccount: { set: { provenAccountRead: true } }
  verifyHash: { set: { hashVerified: true } }
  verifyDecoy: { set: { decoyVerified: true } }
  fixSubject: { set: { subjectFixed: true } }
  auditByHmac: { set: { auditedByHmac: true } }
  waitFloor: { set: { floorWaited: true } }
  verifyAddress: { set: { addressVerified: true } }
  holdBreached: { set: { breachedHeld: true } }
  recordBreachFailure: { set: { breachFailureRecorded: true } }
  proveMailbox: { set: { mailboxProved: true } }
  updatePassword: { set: { passwordUpdated: true } }

failures:
  readingPolicy: { from: mfaPolicy, store: [unavailable] }
  readingSwitchGate: { from: accountRegistrations, store: [unavailable] }
  reservingAttempt: { from: ladder, store: [unavailable] }
  readingAccount: { from: accountDirectory, store: [unavailable] }
  readingProvenAccount: { from: accountDirectory, store: [unavailable] }
  verifyingAccount:
    from: core.account-verification
    throttled: [sendCapped, lockedOut]
    ended: [burned, ended]
    invalid: [answerRefused]
    store: [unavailable]
  checkingBreachList:
    from: breachList
    lookup: [not_configured, list_not_loaded, lookup_blocked, lookup_failed, bad_response]
  confirmingMailbox:
    from: core.account-verification
    throttled: [sendCapped, lockedOut]
    ended: [burned, ended]
    invalid: [answerRefused]
    store: [unavailable]
  checkingNewBreachList:
    from: breachList
    lookup: [not_configured, list_not_loaded, lookup_blocked, lookup_failed, bad_response]
  writingPassword:
    from: passwordUpdates
    ended: [account_disabled, subject_mismatch]
    store: [unavailable]

# The main story: a browser ceremony with no login_hint; the person types the identifier, then the right password of an
# enabled, verified, password-only account, with no second factor required.
main:
  given:
    loginHint: absent
    account: passwordOnly
    password: right
    requireVerified: true
    mfa: notRequired
    gate: open
    differentIdentifier: false
    breachList: 'off'
    updateRequested: false
  events: [ROUND, DONE, IDENTIFIER, DONE, PASSWORD, DONE, DONE, DONE]

initial: idle
states:
  idle:
    title: Wait for the first round
    description: >-
      The transport starts a transaction: the Interaction API when /oauth/authorize starts an interaction, the FiPA
      endpoint on its first request. The first round may already carry an answer (an eager answer).
    on:
      ROUND:
        target: readingPolicy
        effect: [newRound, answerNone]
        say: 'the first round carries no answer'
      IDENTIFIER:
        target: readingPolicy
        effect: [newRound, answerIdentifier]
        say: 'the first round answers the identifier step'
      PASSWORD:
        target: readingPolicy
        effect: [newRound, answerPassword]
        say: 'the first round carries a password without a login_hint'
      PASSWORD_WITH_HINT:
        target: readingPolicy
        effect: [newRound, answerPasswordWithHint]
        say: 'the first round carries a password and its login_hint: the one-call path of ADR-017 Decision 3'
      MALFORMED:
        target: readingPolicy
        effect: [newRound, answerMalformed]
        say: 'the first round carries an answer whose login_hint is not an identifier'
      REGISTER:
        target: readingPolicy
        effect: [newRound, answerRegister]
        say: "the first round answers the register marker the Interaction API's start offered (#1079)"

  readingPolicy:
    title: Read the realm's and the client's MFA policy
    description: >-
      On every round, through the policy interface, never from the transaction, so a change reaches a live
      transaction. A policy that cannot be read refuses the round before anything else, as a store outage does.
    invoke: { external: mfaPolicy }
    on:
      DONE:
        target: checkingLimits
        say: 'the policy is read'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the policy cannot be read; the floor is waited out'

  checkingLimits:
    title: Ask the limiters (rule 3)
    description: >-
      The per-end-user-IP, per-bucket and per-client limits of PRO-13 (#636): a round from an IP inside its hard
      block, or above the client's rounds a minute, is refused. A credential round is reserved on them again before
      the ladder's reservation, so a delay or a hard limit refuses it before it is verified. With no limiter
      registered, the round goes on.
    always:
      - guard: limited
        target: throttled
        effect: [waitFloor]
        say: 'a limiter refuses the round; the floor is waited out'
      - target: checkingRequest
        say: 'the limiters let the round through'

  checkingRequest:
    title: Ask the transport's request checks (rule 4)
    description: >-
      response_type, PKCE, acr_values, prompt, scope, negotiation and frozen parameters, as each transport checks them.
      With no check registered, the round goes on.
    always:
      - guard: requestRefused
        target: requestRefused
        effect: [waitFloor]
        say: 'the request checks refuse the round; the floor is waited out'
      - guard: registerAnswered
        target: checkingSwitch
        say: 'the request checks let the round through, and it answers the register marker'
      - target: checkingBotChallenge
        say: 'the request checks let the round through'

  checkingSwitch:
    title: Ask whether the sign-in can still switch to a registration (#1079)
    description: >-
      The register marker is offered at the sign-in's first step only. Once the transaction holds an identifier, an
      answer naming it is refused as a malformed one is; the Interaction API refuses it before the engine, since its
      step did not offer it.
    always:
      - guard: 'identifierHeld or subjectFixed'
        target: answerRefused
        effect: [waitFloor]
        say: 'the transaction holds an identifier: refused as invalid_answer, audited'
      - target: readingSwitchGate
        say: 'nobody is named yet'

  readingSwitchGate:
    title: Read the switch's gate again
    description: >-
      On every round, as for prompt=create (ADR-017 Decision 8): the transport, the request, the realm's sign-up and
      the client's hosted_flows. Nothing about any account is read (ADR-017 Decision 4), so the answer is the same
      for every identifier. A gate that closed since the step was offered refuses the answer with the generic
      invalid_answer, and the transaction stays as it was. A store error refuses the round.
    invoke: { external: accountRegistrations }
    on:
      DONE:
        - guard: switchOpen
          target: switchedToRegistration
          say: 'the gate holds: the register marker is recorded as a passed step'
        - target: answerRefused
          effect: [waitFloor]
          say: 'the gate no longer holds: refused as invalid_answer, audited, the transaction unchanged'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: "the realm's sign-up cannot be read"

  checkingBotChallenge:
    title: Ask whether a bot challenge is due (rule 5)
    description: >-
      PRO-19 (#643; ADR-017 Decision 7): a soft threshold of the limiters or of the ladder asks for one, in addition to
      the delay, and a pass of an earlier challenge in this transaction answers it until a credential round spends
      it. A due challenge comes before every other step, so an eager password is ignored and gives no password
      oracle. A transport that does not serve the captcha step meets the delay and the 429 alone.
    always:
      - guard: challengeUnanswerable
        target: unavailable
        effect: [waitFloor]
        say: 'a bot challenge is due and no provider can answer it: refused, never waved through'
      - guard: challengeOffered
        target: botChallengeDue
        effect: [waitFloor]
        say: 'a bot challenge is due; any other answer is ignored, and the floor is waited out'
      - guard: botChallengeDue
        target: takingIdentifier
        say: >-
          a bot challenge is due and the transport does not serve the captcha step: the round goes on, under the delay
          and the 429 of the limiters and the ladder alone, never a redirect
      - target: takingIdentifier
        say: 'no bot challenge is due'

  takingIdentifier:
    title: Take the identifier (rule 6)
    description: >-
      From the request's login_hint, else from the answer: an identifier answer, or the login_hint of a password
      answer. It is checked (an email address of at most 254 bytes) and normalised. The first one is fixed for the
      transaction; a different one later ends it. No account is read here.
    always:
      - guard: malformedAnswer
        target: answerRefused
        effect: [waitFloor]
        say: >-
          the answer's login_hint is not an identifier (an email address of at most 254 bytes); nothing is verified or
          counted
      - guard: identifierMismatch
        target: ended
        effect: [auditByHmac, waitFloor]
        say: >-
          the round brings another identifier than the one the transaction holds, or the request's and the answer's
          differ: the transaction ends, and subject_mismatch is audited under the identifier HMAC
      - guard: noIdentifier
        target: offeringIdentifier
        effect: [waitFloor]
        say: >-
          no identifier is held and the round brings none; a password answer is ignored, with no verification and no
          failure counted, and the floor is waited out
      - target: choosingFirstFactor
        effect: [holdIdentifier]
        say: 'the transaction holds the identifier'

  choosingFirstFactor:
    title: Pick the first factor (rule 7)
    description: >-
      The password, required, with a passkey offered beside it where the transport serves webauthn_get
      (flows/core/passkey; ADR-017 Decision 4: the same password-required shape for every account). An answer is
      verified only when its step is the one the engine asks for next: here, a password answer.
    always:
      - guard: passwordAnswered
        target: reservingAttempt
        say: 'the round answers the password step, the one the engine asks for'
      - target: offeringPassword
        effect: [waitFloor]
        say: 'the round answered the identifier, or nothing; the floor is waited out'

  reservingAttempt:
    title: Reserve the attempt on the ladder
    description: >-
      The ladder hook of PRO-12, keyed on the identifier HMAC whether or not an account holds it: one atomic operation
      reads the wait, refuses an attempt inside it, and otherwise counts the attempt as a failure until it settles. A
      store error refuses the round before the password is checked.
    invoke: { external: ladder }
    on:
      DONE:
        - guard: lockedOut
          target: lockedOut
          effect: [auditByHmac, waitFloor]
          say: >-
            the identifier is inside a wait: the round is refused, neither verified nor counted, and audited under the
            identifier HMAC
        - target: readingAccount
          effect: [reserveAttempt]
          say: 'the attempt is reserved'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the ladder store fails; the floor is waited out'

  readingAccount:
    title: Read what the password needs of the account the identifier names
    description: >-
      Its user, its enabled flag, whether its primary identity is proven, and its password. Nothing more, so an
      account that exists costs and risks one read more than none, and nothing about it reaches the answer before a
      factor succeeds.
    invoke: { external: accountDirectory }
    on:
      DONE:
        target: verifyingPassword
        effect: [readAccount]
        say: 'the account is read, or none holds the identifier'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the database fails; the reservation stays counted'

  verifyingPassword:
    title: Verify the password, at the cost of one Argon2id verification for every account
    description: >-
      With no usable password (no account, a passkey-only account, a disabled password) the answer is verified
      against a dummy hash, so every outcome costs one verification. Every refusal is the same: the password step
      again with invalid_credentials. A disabled user is refused after its password checked out, and nothing about it
      changes. An unverified account's right password proves it under the realm's gate, where a code can arrive: rule 8
      verifies its address. A right password is then checked against the realm's breach list, when it names one.
    always:
      - guard: noUsablePassword
        target: passwordRefused
        effect: [verifyDecoy, auditByHmac, waitFloor]
        say: >-
          no usable password: the dummy hash is verified, the attempt settles as a failure, invalid_credentials is
          audited under the identifier HMAC, and the floor is waited out
      - guard: wrongPassword
        target: passwordRefused
        effect: [verifyHash, auditByHmac, waitFloor]
        say: 'the password is wrong; the attempt settles as a failure, audited under the identifier HMAC'
      - guard: userDisabled
        target: passwordRefused
        effect: [verifyHash, auditByHmac, waitFloor]
        say: >-
          the password is right and the user is disabled: refused like a wrong password, audited as account_disabled
          under the identifier HMAC; no subject is fixed and the user is not changed
      - guard: breachListChecked
        target: checkingBreachList
        effect: [verifyHash]
        say: "the password is right: the attempt settles as a success, and the realm's breach list is checked"
      - target: readingProvenAccount
        effect: [verifyHash, fixSubject]
        say: >-
          the password is right and the realm checks no breach list: the attempt settles as a success, the subject is
          fixed, auth_time is now, and the step is audited with the user as its subject; nothing is checked or sent
          anywhere

  checkingBreachList:
    title: Check the right password against the realm's breach list
    description: >-
      Only now, once the password proved the account: QAuth keeps only its hash, so the check runs when the person
      types the password. The SHA-1 of the password against the operator's local list, or its first five hex
      characters to the operator's k-anonymity range host through the egress client; nothing else of the password
      leaves the server. A check that fails never blocks the sign-in: it is counted on the metric, recorded in the
      audit log, and the sign-in goes on as for a password that is not listed.
    invoke: { external: breachList }
    on:
      DONE:
        - guard: passwordListed
          target: readingProvenAccount
          effect: [fixSubject, holdBreached]
          say: >-
            the password is listed: the subject is fixed, and the transaction holds that the password must be replaced
            before the sign-in completes
        - guard: "breachList == 'notListed'"
          target: readingProvenAccount
          effect: [fixSubject]
          say: 'the password is not on the list: the subject is fixed'
      FAIL.lookup:
        guard: breachCheckFailed
        target: readingProvenAccount
        effect: [fixSubject, recordBreachFailure]
        say: >-
          the list is not loaded or configured, or the lookup fails: the failure is counted and audited, and the
          subject is fixed as for a password not on the list

  readingProvenAccount:
    title: Read the whole account the password proved
    description: >-
      Every factor bound to it, disabled ones included, whether it holds an admin role in the realm, and its pending
      required actions: what the downgrade rule, the MFA policy and the forced update need, read only once a factor
      proved the account.
    invoke: { external: accountDirectory }
    on:
      DONE:
        target: afterFirstFactor
        effect: [readProvenAccount]
        say: 'the account is read again, with every factor'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the database fails; the subject the round fixed stays in the transaction'

  afterFirstFactor:
    title: Apply the rules after a first factor (rule 8)
    description: >-
      The downgrade rule: the transaction must prove the account's strongest bound factor (a passkey above a password),
      and a disabled factor still counts as bound; a factor bound after a password-only sign-in does not while it is
      new (#1064), though the MFA policy reads every factor. Then the MFA policy just read: when it requires a second factor, the
      transaction's amr must carry mfa, and an account with no usable second factor gets the set-up step, never a
      code. Then an address not proved yet is verified inline, before a second factor the account has is asked for
      (ADR-017 Decision 4, rule 8). flows/core/passkey draws the passkey the first rule asks for; the second factor the
      MFA policy asks for is a later issue's (#653), and until it exists the engine answers a redirect.
    always:
      - guard: passkeyBound
        target: passkeyOwed
        effect: [waitFloor]
        say: 'the account has a passkey bound: the password does not complete the sign-in'
      - guard: mfaRequired
        target: redirected
        effect: [waitFloor]
        say: >-
          the policy requires a second factor, and no second-factor step exists yet (#653): the set-up step, which a
          later issue builds, and never a code
      - guard: unverified
        target: verifyingAccount
        say: "the account's address is not proved yet: it is verified inline"
      - target: checkingPasswordUpdate
        say: 'every factor the sign-in needs is proved'

  verifyingAccount:
    title: Verify the account's address with an emailed code
    description: >-
      flows/core/account-verification, round by round: a 6-digit code mailed to the transaction's identifier through
      the send caps, asked for with the email_code step and the purpose verify_account. A right code marks the
      address verified and adds no amr value; the sign-in then goes on with the rules after it.
    invoke: { flow: core.account-verification }
    on:
      DONE:
        target: checkingPasswordUpdate
        effect: [verifyAddress]
        say: "the address is verified, and the amr is the password's alone"
      FAIL.throttled:
        target: verificationThrottled
        effect: [waitFloor]
        say: "the send caps or the email-code ladder's wait refuse the round"
      FAIL.ended:
        target: verificationEnded
        effect: [waitFloor]
        say: 'the fifth wrong code burned the code, or the account changed: the transaction ends'
      FAIL.invalid:
        target: answerRefused
        effect: [waitFloor]
        say: 'the code is not of the offered length'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the send caps, the ladder or the database fail'

  checkingPasswordUpdate:
    title: Ask whether the password must be replaced first (rule 8)
    description: >-
      After every factor the sign-in needs and the address verified, before any session or code: the password the
      person typed is on the realm's breach list, or the account holds an update_password required action. The person
      then chooses a new password, and the password alone never sets one (ADR-017 Decision 4 rule 8, decided
      2026-10-23): a second factor the account has comes first, and on an account whose only factor is its password a
      code mailed to its address. A code this transaction already took for that mailbox, to verify its address, counts:
      no second code is mailed.
    always:
      - guard: updateDue and mailboxShown
        target: offeringNewPassword
        effect: [waitFloor]
        say: 'the code that verified the address in this transaction proved the mailbox: the new password is asked for'
      - guard: updateDue and secondFactorBound
        target: redirected
        effect: [waitFloor]
        say: >-
          the account has a second factor: it is asked for before the update; until the TOTP step exists (#653), the
          engine answers a redirect
      - guard: updateDue
        target: confirmingMailbox
        say: "the password is the account's only factor: a code is mailed to its address first, as a reset asks"
      - target: completed
        effect: [waitFloor]
        say: 'no update is due: every rule is met'

  confirmingMailbox:
    title: Prove the account's mailbox with an emailed code before the update
    description: >-
      The code rounds of flows/core/account-verification, with the purpose recovery and 8 digits, as a reset asks for
      one: the send caps, the email-code ladder, the 10 minutes, the burn at the 5th wrong answer. A right code proves
      the mailbox and adds no amr value; without it no new password is asked for, and no session or code is issued.
    invoke: { flow: core.account-verification }
    on:
      DONE:
        target: offeringNewPassword
        effect: [proveMailbox, waitFloor]
        say: 'the code is right: the mailbox is proved, and the new password is asked for'
      FAIL.throttled:
        target: verificationThrottled
        effect: [waitFloor]
        say: "the send caps or the email-code ladder's wait refuse the round"
      FAIL.ended:
        target: verificationEnded
        effect: [waitFloor]
        say: 'the fifth wrong code burned the code, or the account changed: the transaction ends'
      FAIL.invalid:
        target: answerRefused
        effect: [waitFloor]
        say: 'the code is not of the offered length'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the send caps, the ladder or the database fail'

  checkingNewPassword:
    title: Check the new password against the realm's password policy
    description: >-
      The one password policy (ADR-017 Decision 8, #634): the length as typed, NFC, the realm's minimum length, the
      whole-password blocklist with the address and the service and realm names as context words, and the score floor.
    always:
      - guard: newPasswordRejected
        target: newPasswordRefused
        effect: [waitFloor]
        say: 'the policy refuses it: the step again with password_rejected and its reasons, audited under the subject'
      - target: checkingNewBreachList
        say: 'the policy accepts it'

  checkingNewBreachList:
    title: Check the new password against the realm's breach list
    description: >-
      The same check as the presented password's, on the new password in NFC, when the realm names a source. A listed
      one is refused as blocklisted. A check that fails accepts it: counted on the metric and recorded in the audit
      log.
    invoke: { external: breachList }
    on:
      DONE:
        - guard: newPasswordListed
          target: newPasswordRefused
          effect: [waitFloor]
          say: 'the new password is listed: refused as blocklisted, audited under the subject'
        - guard: "newPassword == 'accepted'"
          target: writingPassword
          say: 'the new password is not on the list, or the realm checks none'
      FAIL.lookup:
        guard: "newPassword == 'checkFailed'"
        target: writingPassword
        effect: [recordBreachFailure]
        say: 'the check fails: counted and audited, and the new password is accepted'

  writingPassword:
    title: Replace the password and clear the required action
    description: >-
      In one database transaction, for the subject's enabled account only: the password credential's Argon2id hash of
      the new password in NFC with its normalisation marker, a disabled mark of the failure ladder cleared, and the
      account's update_password required action removed. The step joins the transaction's verified steps with no amr
      value, and is audited as passed under the subject.
    invoke: { external: passwordUpdates }
    on:
      DONE:
        target: completed
        effect: [updatePassword, waitFloor]
        say: 'the password is replaced: every rule is met'
      FAIL.ended:
        target: verificationEnded
        effect: [waitFloor]
        say: 'the account was disabled or lost its password credential since the read: nothing is written'
      FAIL.store:
        target: unavailable
        effect: [waitFloor]
        say: 'the database fails: nothing is written, and the step is asked for again by the next round'

  # Steps: the round ends, the transaction stays live, and the next round answers from here.

  offeringIdentifier:
    title: Ask for the identifier
    description: >-
      The same for everyone: no account was read. Try another way offers nothing before a factor succeeds but what
      this first step offers every account: here, the register marker while the switch's gate holds (#1079), and
      nothing otherwise.
    response:
      kind: step
      body:
        current: { step: identifier, params: {} }
        alternatives: "register, last, while the switch's gate holds (#1079); none otherwise"
        personal: {}
    on:
      ROUND:
        target: readingPolicy
        effect: [newRound, answerNone]
        say: 'the next round carries no answer'
      IDENTIFIER:
        target: readingPolicy
        effect: [newRound, answerIdentifier]
        say: 'the person types the identifier'
      PASSWORD:
        target: readingPolicy
        effect: [newRound, answerPassword]
        say: 'the next round carries a password without a login_hint'
      PASSWORD_WITH_HINT:
        target: readingPolicy
        effect: [newRound, answerPasswordWithHint]
        say: 'the next round carries a password and its login_hint'
      MALFORMED:
        target: readingPolicy
        effect: [newRound, answerMalformed]
        say: 'the next round carries an answer whose login_hint is not an identifier'
      REGISTER:
        target: readingPolicy
        effect: [newRound, answerRegister]
        say: 'the person picks "Create an account": the register marker (#1079)'

  offeringPassword:
    title: Ask for the password
    description: >-
      The same for every account the identifier may name, and for none: no account was read. The personal data is
      the identifier as the person gave it, normalised.
    response:
      kind: step
      body:
        current: { step: password, params: {} }
        alternatives: []
        personal: { identifier: "the transaction's identifier" }
    on:
      ROUND:
        target: readingPolicy
        effect: [newRound, answerNone]
        say: 'the next round carries no answer'
      IDENTIFIER:
        target: readingPolicy
        effect: [newRound, answerIdentifier]
        say: 'the next round answers the identifier again'
      PASSWORD:
        target: readingPolicy
        effect: [newRound, answerPassword]
        say: 'the person types the password'
      PASSWORD_WITH_HINT:
        target: readingPolicy
        effect: [newRound, answerPasswordWithHint]
        say: 'the next round carries a password and a login_hint'
      MALFORMED:
        target: readingPolicy
        effect: [newRound, answerMalformed]
        say: 'the next round carries an answer whose login_hint is not an identifier'
      REGISTER:
        target: readingPolicy
        effect: [newRound, answerRegister]
        say: 'the next round answers the register marker, which this step did not offer'

  passwordRefused:
    title: Ask for the password again
    description: >-
      The same answer for an unknown identifier, a wrong password, a passkey-only account, a disabled password and a
      disabled user, in body and in timing.
    response:
      kind: step
      body:
        current: { step: password, params: {}, error: invalid_credentials }
        alternatives: []
        personal: { identifier: "the transaction's identifier" }
    on:
      ROUND:
        target: readingPolicy
        effect: [newRound, answerNone]
        say: 'the next round carries no answer'
      IDENTIFIER:
        target: readingPolicy
        effect: [newRound, answerIdentifier]
        say: 'the next round answers the identifier again'
      PASSWORD:
        target: readingPolicy
        effect: [newRound, answerPassword]
        say: 'the person tries another password'
      PASSWORD_WITH_HINT:
        target: readingPolicy
        effect: [newRound, answerPasswordWithHint]
        say: 'the next round carries a password and a login_hint'
      MALFORMED:
        target: readingPolicy
        effect: [newRound, answerMalformed]
        say: 'the next round carries an answer whose login_hint is not an identifier'

  offeringNewPassword:
    title: Ask for a new password
    description: >-
      The new_password step with the purpose update_required, the realm's minimum length and the longest password
      accepted; the personal data is the transaction's identifier. No session and no code is issued before it is set.
    response:
      kind: step
      body:
        current:
          step: new_password
          params:
            purpose: update_required
            min_length: "the realm's password.minLength"
            max_length: 256
        alternatives: []
        personal: { identifier: "the transaction's identifier" }
    on:
      ROUND:
        target: offeringNewPassword
        effect: [newRound, waitFloor]
        say: 'the next round carries no answer: the same step'
      NEW_PASSWORD:
        target: checkingNewPassword
        effect: [newRound]
        say: 'the person types a new password'

  newPasswordRefused:
    title: Ask for a new password again
    description: >-
      The same step with password_rejected and the reasons: too_short, too_long, blocklisted (a whole dictionary or
      context word, or a password on the realm's breach list) or too_weak.
    response:
      kind: step
      body:
        current:
          step: new_password
          params:
            purpose: update_required
            min_length: "the realm's password.minLength"
            max_length: 256
            reasons: 'why the new password was refused'
          error: password_rejected
        alternatives: []
        personal: { identifier: "the transaction's identifier" }
    on:
      ROUND:
        target: offeringNewPassword
        effect: [newRound, waitFloor]
        say: 'the next round carries no answer'
      NEW_PASSWORD:
        target: checkingNewPassword
        effect: [newRound]
        say: 'the person types another new password'

  # Exits

  completed:
    type: final
    title: Complete the sign-in
    description: >-
      The transport mints the session (the Interaction API) or the code (the FiPA endpoint) from what the engine
      returns; the engine itself writes nothing to the account. The transaction ends with it, so nothing completes
      twice.
    response:
      kind: complete
      body:
        transaction: null
        subject: "the account's user id"
        identifier: "the transaction's identifier, normalised"
        amr: '["pwd"], from the step grammar''s transactionAmr over the verified steps'
        authTime: 'when the password was verified, in epoch milliseconds'

  passkeyOwed:
    type: final
    title: Ask for the account's passkey
    description: >-
      The downgrade rule, drawn by flows/core/passkey: webauthn_get next, a recovery code beside it on the hosted
      pages, or a redirect where no step of it can be served. The password alone never completes the sign-in.
    response:
      kind: continue
      body: { next: 'flows/core/passkey, from afterFirstFactor' }

  redirected:
    type: final
    title: Continue elsewhere
    description: >-
      A rule after the first factor needs a step that does not exist yet or that the transport cannot serve, the forced
      update's included. The FiPA endpoint answers redirect_to_web; the Interaction API ends the interaction. The
      transaction ends with it, and nothing is minted.
    response:
      kind: redirect
      body: { reason: step_not_available, transaction: null }

  ended:
    type: final
    title: End the transaction
    description: >-
      One subject per transaction: a different identifier, or a factor of another user once one is proven, ends it.
      The transport discards it; the FiPA endpoint answers invalid_session. The Interaction API starts the sign-in
      again at its first step, with the notice subject_mismatch (#1081).
    source: libs/server/sign-in-engine/src/lib/engine.ts:454
    response:
      kind: refused
      body: { reason: transaction_ended, transaction: null, cause: subject_mismatch }

  verificationThrottled:
    type: final
    title: Refuse a round of the inline verification for the send caps or the email-code ladder
    description: >-
      The same 429 for every address at the send caps; inside the email-code ladder's wait the answer is neither
      compared nor counted. The transaction and a code it holds stay.
    response:
      kind: refused
      body: { reason: throttled, retryAfterSeconds: "the send cap's or the email-code ladder's" }

  verificationEnded:
    type: final
    title: End the transaction for a burned code or an account that changed
    description: >-
      Audited under the subject, as code_burned or as the account's change. The Interaction API starts the sign-in
      again; the email-code ladder counts on across transactions. The first step's read carries the notice
      code_burned for the fifth wrong code, subject_mismatch for an address that now names another account, and
      expired for a disabled account (#1081): no notice says what became of an account.
    source: libs/server/sign-in-engine/src/lib/engine.ts:454
    response:
      kind: refused
      body:
        reason: transaction_ended
        transaction: null
        cause: "code_burned, or the account's change (account_disabled, subject_mismatch)"

  throttled:
    type: final
    title: Refuse the round for a limiter
    description: >-
      Audited as rate_limited, under the identifier HMAC when the transaction holds one and naming nobody otherwise. The
      transaction stays as far as the round took it.
    response:
      kind: refused
      body: { reason: throttled, retryAfterSeconds: "the limiter's" }

  lockedOut:
    type: final
    title: Refuse the round inside the ladder's wait
    description: >-
      The same answer for every identifier inside a wait, held by an account or not. Neither verified nor counted; the
      transaction stays as far as the round took it.
    response:
      kind: refused
      body: { reason: throttled, retryAfterSeconds: "the ladder's" }

  requestRefused:
    type: final
    title: Refuse the round for the request checks
    description: >-
      Audited as request_refused, under the identifier HMAC when the transaction holds one and naming nobody otherwise.
    response:
      kind: refused
      body:
        reason: request_refused
        code: "the check's code, such as unmet_authentication_requirements"

  botChallengeDue:
    type: final
    title: Offer the bot challenge
    description: >-
      PRO-19 (#643): the captcha step alone, its puzzle kept in the transaction until it is answered. A right answer
      leaves a pass that the next credential round spends, and the pending step resumes in the same round; a wrong one
      is refused with captcha_failed and a new puzzle, and counted as a failed round on the limiters, so a stream of
      wrong answers meets the hard 429. A provider that cannot check an answer refuses the round (unavailable). The
      answer, captcha_token, is never logged or audited.
    response:
      kind: step
      body:
        current:
          step: captcha
          params: "the provider's: the built-in proof of work's challenge and difficulty, or a hosted provider's name and site key"
        alternatives: []
        personal: {}

  switchedToRegistration:
    type: final
    title: Switch to a registration, in this same round (#1079)
    description: >-
      The engine starts a registration transaction for the same realm and client, keeping the transaction's creation
      time, and runs the registration's rules in this same round, from its gate (flows/core/sign-up): the bot
      challenge first where the realm or the client requires one, then the address step with the sign_in marker
      beside it. The held request is unchanged, so the interaction ends in a code for it, as prompt=create's does.
    response:
      kind: continue
      body:
        transaction: 'a registration transaction: the same realm, client and creation time, nothing verified'

  answerRefused:
    type: final
    title: Refuse a malformed answer
    description: >-
      A fault of the request, audited as invalid_answer (under the identifier HMAC when the transaction holds one); the
      transaction stays as far as the round took it. So is a register marker the round can no longer take (#1079).
    response:
      kind: refused
      body: { reason: invalid_answer }

  unavailable:
    type: final
    title: Refuse the round while a store is down
    description: >-
      The policy, the ladder or the account directory cannot be read: the round is refused before any credential is
      checked (fail closed), and the transaction stays as far as the round took it.
    response:
      kind: refused
      body: { reason: unavailable }

assertions:
  - id: the-switch-only-under-its-gate
    never: "state == 'switchedToRegistration' and (identifierHeld or subjectFixed or gate != 'open')"
    say: >-
      A sign-in becomes a registration only under the same gate as prompt=create, read on the round, and only before
      the transaction names anyone (#1079)
  - id: the-switch-reads-no-account
    never: "state == 'switchedToRegistration' and (accountRead or provenAccountRead or hashVerified or decoyVerified)"
    say: 'Nothing about any account decides the switch: it reads none and verifies nothing (ADR-017 Decision 4)'
  - id: same-first-response-for-every-account
    never: "state in ['offeringIdentifier', 'offeringPassword'] and accountRead"
    say: >-
      A step offered without an error never read the account, so before a factor succeeds it is the same for every
      account the identifier may name, and for none; login_hint changes it for no account
  - id: no-completion-without-a-usable-enabled-account
    never: >-
      state == 'completed' and (noUsablePassword or wrongPassword or userDisabled or (unverified and not
      addressVerified))
    say: >-
      A sign-in completes only for an enabled account, its right password and a verified address, whatever
      REQUIRE_VERIFIED_ACCOUNT says
  - id: disabled-user-never-gets-a-subject
    never: "subjectFixed and account == 'disabled'"
    say: 'A disabled user is answered as a wrong password: no subject is fixed, so no transport mints anything for it'
  - id: every-refused-password-costs-one-verification
    never: "state == 'passwordRefused' and not (hashVerified or decoyVerified)"
    say: 'Every refused password costs one Argon2id verification, against the dummy hash when no usable password exists'
  - id: unknown-identifier-verifies-the-dummy-hash
    never: "state == 'passwordRefused' and noUsablePassword and not decoyVerified"
    say: 'An identifier no account holds, or an account with no usable password, runs the dummy hash'
  - id: reserve-before-verify
    never: '(hashVerified or decoyVerified) and not attemptReserved'
    say: 'Every verified password was reserved on the ladder first'
  - id: eager-answer-ignored
    never: "state == 'offeringIdentifier' and (attemptReserved or hashVerified or decoyVerified)"
    say: >-
      A password sent while the identifier step is next is ignored: it is neither verified nor counted
  - id: refused-rounds-verify-nothing
    never: >-
      state in ['unavailable', 'throttled', 'lockedOut', 'requestRefused', 'botChallengeDue', 'answerRefused'] and
      (hashVerified or decoyVerified) and not subjectFixed
    say: >-
      A refused round, a store outage or an unreadable policy included, checks no credential, unless the credential
      already proved the account: a store that fails after the proof keeps the subject in the transaction, so a
      refusal never tells a right password from a wrong one
  - id: subject-mismatch-is-audited
    never: "state == 'ended' and not auditedByHmac"
    say: >-
      A round that brings another identifier than the one the transaction holds ends it, and the end is audited as
      subject_mismatch
  - id: no-completion-below-the-strongest-factor
    never: "state == 'completed' and (passkeyBound or mfaRequired)"
    say: >-
      A sign-in never completes below the account's strongest bound factor, a disabled one included, or without the
      second factor the policy requires
  - id: every-round-waits-the-floor
    never: >-
      state in ['offeringIdentifier', 'offeringPassword', 'passwordRefused', 'completed', 'redirected', 'ended', 'throttled', 'lockedOut',
      'requestRefused', 'botChallengeDue', 'answerRefused', 'unavailable', 'verificationThrottled',
      'verificationEnded', 'offeringNewPassword', 'newPasswordRefused'] and not floorWaited
    say: >-
      Every round answers no earlier than 500 ms after it arrived: those that resolve an identifier or carry a
      credential, as ADR-017 Decision 7 asks, and every other one, so that no answer is timed apart
  - id: no-raw-identifier-before-a-subject
    never: "state in ['passwordRefused', 'lockedOut', 'ended'] and not subjectFixed and not auditedByHmac"
    say: >-
      While no user is proven, the audit names the person only by the identifier HMAC, never by the identifier itself
  - id: no-completion-while-an-update-is-due
    never: "state == 'completed' and (breachedHeld or updateRequested) and not passwordUpdated"
    say: >-
      A sign-in whose password is on the breach list, or whose account holds an update_password required action,
      completes only once a new password is set: no session and no code before it
  - id: the-password-alone-never-sets-a-new-one
    never: "state in ['offeringNewPassword', 'newPasswordRefused', 'writingPassword'] and not mailboxShown"
    say: >-
      A new password is asked for only after a proof beyond the password: here, a code that proved the account's
      mailbox in this transaction; a second factor the account has is asked for first and, until its step exists,
      answers a redirect
  - id: the-new-password-passes-the-checks
    never: "passwordUpdated and newPassword in ['rejected', 'listed']"
    say: "A new password the policy refuses or the realm's breach list holds is never written"
  - id: a-failed-check-never-blocks
    never: "breachCheckFailed and state in ['passwordRefused', 'lockedOut'] and subjectFixed"
    say: >-
      A breach-list check that fails never refuses a right password: the subject is fixed and the sign-in goes on, as
      for a password that is not listed
  - id: every-failed-check-is-recorded
    never: 'breachCheckFailed and subjectFixed and not breachFailureRecorded'
    say: 'A breach-list check that fails is counted on the metric and recorded in the audit log'
  - id: nothing-changes-with-the-setting-off
    never: >-
      breachList == 'off' and not updateRequested and state in ['checkingBreachList', 'confirmingMailbox',
      'offeringNewPassword', 'newPasswordRefused', 'writingPassword']
    say: >-
      With password.breachListSource off and no update_password required action, the sign-in is the one drawn before
      #635: nothing is checked or sent, and no new password is asked for
