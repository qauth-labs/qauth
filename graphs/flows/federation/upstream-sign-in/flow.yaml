# The upstream sign-in flow (#639; ADR-020 §3 and its Appendix, ADR-017 Decision 4, ADR-002, ADR-003): a person signs
# in, or signs up, through one of the realm's upstream identity providers. It is the sign-in flow's half of the upstream
# step; federation.upstream-step is the AuthMethod contract's half, from the method's start() to the engine's
# completion, and this graph takes each completion from there.
#
# - The walk runs from the person's pick (the `upstream` step of the Interaction API) or a routed request
#   (`qauth_upstream=<type>` on the authorization request, from a provider link of /ui/login or a client that names the
#   provider) through the provider's callback (GET or POST /upstream/<type>/callback) to the response. The provider
#   link's own redirect (GET /ui/upstream/<type>) and the routed start (GET /ui/upstream/<type>/start) lead into
#   `resolvingProvider`.
# - Each exit is a final state named <error>.<cause>, one per distinct cause, with the response the browser gets. On the
#   pages every refusal shows the same error page with the request's trace id, so the exits differ only in the audited
#   reason of user.sign_in_failed (`method: upstream`), which is the cause in the exit's name; a cancel or an error at
#   the provider shows the provider-error page instead. On the ceremony page every refusal of a callback whose
#   interaction is still live comes back to it as the upstream step's error, a code of a closed set that says nothing
#   of an account the person has not proved, with the callback's trace id (#1081, #1106): those exits are named
#   step_continues.<code>. A callback with no interaction left goes to the ceremony app's error page when the realm
#   names one (ceremonyApp.errorPage), error_page.<cause>, and to the auth server's own error page when it does not.
#   No refusal sends anything to the client's redirect_uri.
# - Two sign-in UIs run the same flow (`mode`): the server-rendered pages while INTERACTION_UI_ENABLED is off, which
#   show no further step, and the Interaction API's ceremony page while it is on.
# - `invoke: { external }` names a store or a library the domain graph holds no entity for: the pending sign-in store
#   (Redis), the account creation transaction, the sign-in engine (core.sign-in) and the method's own start().
schema: delurio-graph/0
kind: flow
id: federation.upstream-sign-in
status: proposed
domain: qauth
title: Sign in, or sign up, through one of the realm's upstream identity providers
summary: >-
  The person picks a provider on the first sign-in step, or the authorization request names one with qauth_upstream
  (a hidden provider too). The provider's method starts, and what it needs back (state, nonce, the PKCE verifier) is
  kept server-side for ten minutes, bound to the interaction and to the browser's flow cookie; the waiting page sends
  the browser to the provider. At the callback only the browser that started may take that pending sign-in, once. The
  account is looked up by (realm, provider type, sub) alone, never by an email or another attribute; a known credential
  stands only under the issuer it was created with. On the pages an unknown one creates a user, the credential and the
  provider's claims as attributes in one transaction, when the realm allows sign-up; on the ceremony page the person
  first chooses between a new account and an existing one (federation.upstream-link). The sign-in engine then applies
  the realm's policy, an upstream sign-in ranking with a password: an account that holds a passkey still passes it.

scope:
  shows: the sign-in flow around the upstream step, from the pick or the routed request to the response
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "what the method does between its start() and the engine's completion: federation.upstream-step"
    - 'the sign-in engine rounds after the upstream step: the passkey, the MFA policy, the inline verification of an
      address nobody vouched for (core.sign-in)'
    - 'the review-your-details page of the ADM-09 profile schema, which is not built: an account is created with the
      claims the provider gave'
    - "the providers' admin API (#714): a provider is a row of realm_upstream_providers, or an enabled AuthMethod plugin"
    - 'on the ceremony page, the choice an unknown identity gets between a new account and an existing one, and the
      link to an existing one, also through qauth_link: federation.upstream-link'
    - "the per-address and per-realm rate limit on the callback, which answers 429 before the flow runs, as the sign-in
      form does; the engine's round limits, which hold an address or an account back inside the flow, are drawn"
    - 'a provider switched off between the start and the callback (provider_unavailable on the ceremony page), and an
      engine round that answers a redirect (step_not_available)'
    - "a refused step the interaction store cannot take either: the auth server's error page, with the trace id"

context:
  provider:
    values: [on, off]
    initial: any
    say:
      on: 'the realm has the provider on, hidden or not'
      off: 'the realm has no provider of that type, or has it off'
  startAnswer:
    values: [started, unavailable]
    initial: any
    say:
      started: "the provider's method starts and answers where the browser goes"
      unavailable: "the method cannot start, such as when the provider's discovery document cannot be read"
  arrival:
    values: [sameBrowser, otherBrowser, taken]
    initial: any
    say:
      sameBrowser: 'the browser that started brings the flow cookie the pending sign-in is bound to'
      otherBrowser: 'a browser with no such flow cookie: a callback replayed in another browser, forwarded or forged'
      taken: 'the pending sign-in was taken already: a replay in the same browser, or it expired'
  completion:
    values: [identity, declined, providerError, failed, unreachable, fault]
    initial: any
    say:
      identity: 'the method proved an identity, its assurance capped at low'
      declined: 'the person cancelled or declined at the provider (error=access_denied)'
      providerError: 'the provider answered another error'
      failed: "the provider's answer failed a check (invalid_response, verification_refused)"
      unreachable: 'the provider could not be reached (upstream_unavailable)'
      fault: 'the method broke the AuthMethod contract'
  credential:
    values: [known, unknown]
    initial: any
    say:
      known: "a credential of the provider's type holds the identity's sub in the realm"
      unknown: 'none does, whatever another account holds as its email'
  issuer:
    values: [same, differs, missing]
    initial: any
    say:
      same: "the identity's issuer (the ID token's iss) is the one the credential was created under"
      differs: 'it is another issuer: the provider was re-pointed, or another issuer reuses the sub'
      missing: 'the identity names no issuer (rawClaims.iss): an AuthMethod plugin that breaks the contract'
  credentialState:
    values: [active, disabled]
    initial: any
  vouching:
    values: [on, off]
    initial: any
    say:
      on: "the provider's verified switch is on: an account it creates counts as verified"
      off: 'it is off: QAuth verifies the address of an account it creates with an emailed code'
  address:
    values: [given, none]
    initial: any
    say:
      given: 'the provider gave an email'
      none: 'it gave none'
  signUp:
    values: [allowed, off]
    initial: any
    say:
      allowed: "the realm's sign-up switch (accounts.allowSignUp) is on"
      off: 'it is off, the default'
  furtherStep:
    values: [none, passkey, verification]
    initial: any
    say:
      none: 'the realm asks nothing more of the account'
      passkey: 'the account holds a passkey, which ranks above an upstream sign-in, so the engine asks for it'
      verification: >-
        the account is not verified yet: the provider's verified switch was off when it was created, so QAuth
        verifies the address the provider gave with an emailed code under the realm's gate, where a code can arrive
  engineAnswer:
    values: [accepts, refuses, throttled, ended, movedOn]
    initial: any
    say:
      accepts: 'the engine takes the proof'
      refuses: 'it refuses it, and audits why: the account is disabled, or cannot sign in'
      throttled: "the realm's round limits hold this address or this account back"
      ended: >-
        the engine ended its sign-in transaction, and audited why: it outlived its age, or the provider proved another
        account than the one it named
      movedOn: 'the interaction expired, ended or moved on since the provider was started'
  errorPage:
    values: [none, named]
    initial: any
    say:
      none: "the realm names no ceremony app error page (ceremonyApp.errorPage, the default): the auth server's own"
      named: 'the realm names one, a path on its origin under /ui/ (#1106)'
  mode:
    values: [pages, interaction]
    initial: any
    say:
      pages: 'INTERACTION_UI_ENABLED is off: the server-rendered pages, which show no further step'
      interaction: "INTERACTION_UI_ENABLED is on: the Interaction API's ceremony page shows any further step"
  pendingTaken: { values: [false, true], initial: false }
  accountCreated: { values: [false, true], initial: false }
  signedIn: { values: [false, true], initial: false }

guards:
  providerOff: "provider == 'off'"
  startUnavailable: "startAnswer == 'unavailable'"
  notTheStartingBrowser: "arrival != 'sameBrowser'"
  personDeclined: "completion == 'declined'"
  providerErrored: "completion == 'providerError'"
  checkFailed: "completion == 'failed'"
  providerUnreachable: "completion == 'unreachable'"
  methodFault: "completion == 'fault'"
  knownCredential: "credential == 'known'"
  issuerDiffers: "issuer == 'differs'"
  issuerMissing: "issuer == 'missing'"
  cannotVerify: "vouching == 'off' and (address == 'none' or mode == 'pages')"
  credentialDisabled: "credentialState == 'disabled'"
  signUpOff: "signUp == 'off'"
  engineRefuses: "engineAnswer == 'refuses'"
  engineThrottles: "engineAnswer == 'throttled'"
  transactionEnded: "engineAnswer == 'ended'"
  interactionMovedOn: "engineAnswer == 'movedOn'"
  errorPageNamed: "errorPage == 'named'"
  needsFurtherStep: "furtherStep != 'none'"
  pagesMode: "mode == 'pages'"

effects:
  takePending: { set: { pendingTaken: true } }
  createAccount: { set: { accountCreated: true } }
  signIn: { set: { signedIn: true } }

failures:
  starting: { from: authMethodStart, rejected: [upstream_unavailable] }
  keepingPending: { from: upstreamSignInStore, store: [upstream_unavailable] }
  lookingUpCredential: { from: UserCredential.findByRealmProviderSub, server: [server_error] }
  creatingAccount: { from: accountStore, server: [server_error] }
  completingStep: { from: signInEngine, unavailable: [unavailable] }

# The main story: a person with no account signs up through a listed provider, in a realm that allows sign-up, and the
# pages send the browser back to the authorization request.
main:
  given:
    provider: on
    startAnswer: started
    arrival: sameBrowser
    completion: identity
    credential: unknown
    issuer: same
    vouching: on
    address: given
    credentialState: active
    signUp: allowed
    furtherStep: none
    engineAnswer: accepts
    mode: pages
    errorPage: none
  events: [PICK, DONE, DONE, BROWSER_RETURNS, DONE, DONE, DONE]

initial: idle
states:
  idle:
    title: Wait for a person who chooses an upstream provider
    source: apps/auth-server/src/app/helpers/authorization-interaction.ts:101
    on:
      PICK:
        target: resolvingProvider
        say: >-
          the person picks a provider: the upstream alternative of the first sign-in step (Interaction API), or a
          provider link of /ui/login, which sends the browser back to the authorization request with qauth_upstream
        source: apps/auth-server/src/app/routes/interaction-api.ts:521
      ROUTE:
        target: resolvingProvider
        say: >-
          an authorization request that needs a sign-in names a provider with qauth_upstream; a hidden provider is
          reached this way only
        source: apps/auth-server/src/app/routes/oauth/authorize.ts:166

  resolvingProvider:
    title: Find the provider among the realm's
    description: >-
      The realm's generic OpenID Connect providers (realm_upstream_providers, oidc_<alias>) and its enabled AuthMethod
      plugins. A routed request with a type the realm has not, or has off, is not routed: the routing parameter is
      ignored and the first sign-in step shows, so this flow never sees it; a provider link or a start for such a type
      is refused here.
    source: apps/auth-server/src/app/routes/ui/upstream.ts:152
    always:
      - guard: providerOff
        target: bad_request.upstream_unavailable
        say: 'the realm has no such provider on'
        source: apps/auth-server/src/app/routes/ui/upstream.ts:153
      - target: starting
        say: 'the interaction starts the provider in its first round, recorded by the engine'
        source: apps/auth-server/src/app/routes/ui/upstream.ts:178

  starting:
    title: Ask the provider's method to start
    description: start() answers the provider's authorization request, the transaction and the binding (the state).
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:256
    invoke: { external: authMethodStart }
    on:
      DONE:
        target: keepingPending
        say: 'start() answers'
      FAIL.rejected:
        target: bad_request.upstream_unavailable
        say: 'start() rejects, or its answer fails a check; the browser goes nowhere'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:261

  keepingPending:
    title: Keep the pending sign-in, bound to the interaction and the flow cookie
    description: >-
      Redis keeps the transaction under a hash of its binding for ten minutes, with the interaction, the flow
      cookie's binding and the way back to the first step. The transaction never reaches the browser.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:283
    invoke: { external: upstreamSignInStore }
    on:
      DONE:
        target: atProvider
        say: >-
          the waiting page (a meta refresh, a link for a browser that does not follow it, and the way back) sends the
          browser to the provider; through the Interaction API, the answer's location does
        source: apps/auth-server/src/app/routes/ui/upstream.ts:230
      FAIL.store:
        target: bad_request.upstream_unavailable
        say: 'the store cannot keep it: the engine reports it, and nothing starts'

  atProvider:
    title: Wait while the person is at the provider
    by: human
    on:
      BROWSER_RETURNS:
        target: checkingPending
        say: 'the provider sends the browser to /upstream/<type>/callback (a form_post is bounced to the GET route)'
      ABANDON:
        target: abandoned
        say: 'the person never comes back'

  checkingPending:
    title: Hand the pending sign-in only to the browser that started it
    description: >-
      The callback's binding names the pending sign-in; it is read first, and taken once only when the request
      carries the flow cookie it is bound to, of the same realm and provider type. A callback in another browser
      spends nothing: the method never runs, no code is redeemed and the pending sign-in stays for its own browser.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:912
    always:
      - guard: notTheStartingBrowser and errorPageNamed
        target: error_page.transaction_mismatch
        say: >-
          no pending sign-in for this browser, in a realm that names its ceremony app's error page: no interaction is
          left to go back to (#1106)
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:899
      - guard: notTheStartingBrowser
        target: bad_request.transaction_mismatch
        say: 'no pending sign-in for this browser: a replay in another browser, a forged callback, or a spent one'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:960
      - target: completingCallback
        effect: [takePending]
        say: "the pending sign-in is taken and handed to the method's callback"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:932

  completingCallback:
    title: Turn the method's answer into the step's completion
    description: >-
      federation.upstream-step's exits, one by one. On the pages a refusal shows a page of the auth server's own; on
      the ceremony page it goes back to the interaction as the upstream step's error (#1081, #1106), the code
      upstreamRefusalCodeOf maps the audited reason to.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1028
    always:
      - guard: personDeclined and pagesMode
        target: provider_error.declined
        say: 'the person cancelled or declined at the provider, on the pages'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1003
      - guard: providerErrored and pagesMode
        target: provider_error.provider_error
        say: 'the provider answered another error, on the pages'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1003
      - guard: personDeclined
        target: step_continues.provider_declined
        say: 'the person cancelled or declined at the provider: the ceremony page says so (#1081)'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1041
      - guard: providerErrored
        target: step_continues.provider_error
        say: 'the provider answered another error: the ceremony page says so (#1081)'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1051
      - guard: (checkFailed or providerUnreachable) and pagesMode
        target: bad_request.invalid_response
        say: "the provider's answer failed a check, or the provider could not be reached, on the pages"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1012
      - guard: methodFault and pagesMode
        target: bad_request.method_fault
        say: 'the method broke the contract, on the pages; its error is logged for the operator'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1033
      - guard: issuerMissing and pagesMode
        target: bad_request.invalid_response
        say: "the identity names no issuer, on the pages: its sub could not be told apart from another issuer's"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1059
      - guard: providerUnreachable
        target: step_continues.provider_unavailable
        say: 'the provider could not be reached: the ceremony page says so (#1106)'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1053
      - guard: checkFailed or methodFault or issuerMissing
        target: step_continues.provider_error
        say: >-
          the provider's answer failed a check, the method broke the contract, or the identity names no issuer: the
          ceremony page says the provider failed (#1106)
        source: apps/auth-server/src/app/helpers/interaction-outcomes.ts:91
      - target: lookingUpCredential
        say: 'an identity and its attributes'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1064

  lookingUpCredential:
    title: Look the credential up by (realm, provider type, sub) alone
    description: >-
      Never by an email or another attribute: a person whose address another account holds gets an account of their
      own, and nothing is matched or merged.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:547
    invoke: { action: UserCredential.findByRealmProviderSub }
    on:
      DONE:
        target: checkingCredential
        say: 'one credential or none'
      FAIL.server:
        target: server_error.store
        say: 'the database fails'

  checkingCredential:
    title: Decide what the credential found allows
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:539
    always:
      - guard: knownCredential and issuerDiffers and pagesMode
        target: bad_request.issuer_mismatch
        say: >-
          the credential was created under another issuer: a sub is unique only within its issuer (OIDC Core §5.7), so
          the old credential never signs in under the new one
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:584
      - guard: knownCredential and credentialDisabled and pagesMode
        target: bad_request.credential_disabled
        say: 'the credential is disabled'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:587
      - guard: knownCredential and (issuerDiffers or credentialDisabled)
        target: step_continues.unknown_identity
        say: >-
          on the ceremony page, a credential under another issuer or a disabled one: the same refused step as an
          identity no account can be signed in with, which says nothing of the account (ADR-017 Decision 4)
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1065
      - guard: knownCredential
        target: completingStep
        say: "the credential's user, and whether the account counts as verified, as its creation recorded"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:573
      - guard: not pagesMode
        target: step_continues.upstream_link
        say: >-
          an unknown identity on the ceremony page: nothing is written yet, and the person chooses between a new
          account and an existing one at the upstream_link step (#670)
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1081
      - guard: signUpOff
        target: bad_request.sign_up_disabled
        say: 'an unknown identity, in a realm that does not allow sign-up'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:596
      - guard: cannotVerify
        target: bad_request.verification_unavailable
        say: >-
          an unknown identity the provider's verified switch leaves unverified, with no address for a code or on the
          pages, which show no code step: it could never sign in, so nothing is written
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:601
      - target: creatingAccount
        say: 'an unknown identity, in a realm that allows sign-up'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1106

  creatingAccount:
    title: Create the user, the credential and the attributes in one transaction
    description: >-
      The credential holds the provider type (oidc_<alias> for a generic OpenID Connect provider), the sub, the
      issuer (the ID token's iss) and whether the account counts as verified: yes, unless the provider's verified switch is off. Each
      claim the method gave becomes an attribute whose source is the provider type; the email attribute is verified
      only when the provider said so and the switch is on. user.registered (method upstream) commits with them. A
      callback that loses the race to create the same identity reads the account the other created.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:634
    invoke: { external: accountStore }
    on:
      DONE:
        target: completingStep
        effect: [createAccount]
        say: 'a new account'
      FAIL.server:
        target: server_error.store
        say: 'the database fails; nothing of the account is written'

  completingStep:
    title: Hand the account to the sign-in engine as proved by the upstream step
    description: >-
      The upstream step ranks with a password, below a passkey, under the realm's MFA policy. The interaction is
      answered at the revision the start recorded, so a callback for an interaction that moved on is refused.
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1187
    invoke: { external: signInEngine }
    on:
      DONE:
        target: decidingRound
        say: 'the engine answers its round'
      FAIL.unavailable:
        - guard: pagesMode
          target: bad_request.unavailable
          say: 'the interaction store or the failure ladder cannot answer, on the pages'
          source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1012
        - target: step_continues.service_unavailable
          say: 'the interaction store or the failure ladder cannot answer: the ceremony page says so (#1106)'
          source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1252

  decidingRound:
    title: Go on as the engine's round says
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1236
    always:
      - guard: interactionMovedOn and (pagesMode or not errorPageNamed)
        target: bad_request.interaction_expired
        say: "the interaction expired, ended or moved on: the auth server's error page"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1257
      - guard: interactionMovedOn
        target: error_page.interaction_expired
        say: >-
          the interaction expired, ended or moved on, in a realm that names its ceremony app's error page: no
          interaction is left to go back to (#1106)
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:899
      - guard: engineThrottles and pagesMode
        target: bad_request.throttled
        say: "the realm's round limits hold the sign-in back, on the pages"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1250
      - guard: engineThrottles
        target: step_continues.too_many_requests
        say: "the realm's round limits hold the sign-in back: the ceremony page says so, with no Retry-After (#1106)"
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1249
      - guard: transactionEnded and pagesMode
        target: bad_request.refused
        say: 'the engine ended its transaction, on the pages, and audited why'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:464
      - guard: transactionEnded
        target: step_continues.transaction_ended
        say: 'the engine ended its transaction: the sign-in starts again at its first round, with a new one'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1214
      - guard: engineRefuses and pagesMode
        target: bad_request.refused
        say: 'the engine refuses the proof, on the pages, and audits why'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:461
      - guard: engineRefuses
        target: step_continues.unknown_identity
        say: >-
          the engine refuses the proof, and audits why: the same refused step as an identity no account can be signed
          in with (#1106)
        source: apps/auth-server/src/app/helpers/interaction-outcomes.ts:102
      - guard: needsFurtherStep and pagesMode
        target: bad_request.step_not_available
        say: 'a further step the pages cannot show: the sign-in fails closed'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:460
      - guard: needsFurtherStep
        target: step_continues.ceremony_page
        say: 'a further step (the passkey, a code): the ceremony page shows it'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1261
      - guard: pagesMode
        target: signed_in.authorization_request
        effect: [signIn]
        say: 'signed in: the pages start the authorization request again under the new session'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1303
      - target: code_issued
        effect: [signIn]
        say: 'signed in: the interaction finishes the authorization request as the Interaction API does'
        source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1304

  # Exits: success

  code_issued:
    type: final
    title: Send the authorization code to the client
    description: user.signed_in (method upstream) is recorded, and the user's last login.
    redirect: success
    carries: [code, state, iss]
    response:
      status: 303
      headers:
        Location: redirect_uri with code, state when the request had one, and iss
        Set-Cookie: '__Host-qauth_session, and __Host-qauth_flow without the finished interaction'
        Cache-Control: no-store

  signed_in.authorization_request:
    type: final
    title: Send the signed-in browser back to the authorization request
    description: >-
      user.signed_in (method upstream) is recorded. /oauth/authorize checks the request from scratch under the new
      session, and goes on to the consent or the code.
    redirect: never
    response:
      status: 303
      headers:
        Location: '/oauth/authorize with the request the interaction held, without qauth_upstream'
        Set-Cookie: __Host-qauth_session
        Cache-Control: no-store

  step_continues.upstream_link:
    type: final
    title: Ask on the ceremony page whether the identity starts a new account or joins an existing one
    description: >-
      The interaction moves to the upstream_link step and keeps the identity, and the provider's claims when a new
      account is offered; federation.upstream-link takes it from there. No account is created and nothing is matched.
    redirect: never
    response:
      status: 303
      headers:
        Location: "the interaction's ceremony page on the realm's issuer: <issuer>/ui/interaction/<the interaction id>"

  step_continues.ceremony_page:
    type: final
    title: Send the browser to the ceremony page for the next step
    redirect: never
    response:
      status: 303
      headers:
        Location: "the interaction's ceremony page on the realm's issuer: <issuer>/ui/interaction/<the interaction id>"

  # Exits: the person cancelled, or the provider failed them

  step_continues.provider_declined:
    type: final
    title: Bring a cancel at the provider back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with the reason declined. The interaction stays at the step the provider was
      picked at, with its upstream step current and refused with provider_declined, the provider's type and name in its
      params (error_provider), and the other ways in beside it (#1081): the ceremony page says so in its own words, and
      the auth server shows no page of its own. Nothing goes to the client. A step that offers no upstream step is shown
      again as it was; an interaction that ended or moved on meanwhile gets the ending of a callback with no
      interaction left: the realm's error page when it names one, else the auth server's (#1106).
    redirect: never
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:840
    response: &providerErrorStep
      status: 303
      headers:
        Location: "the interaction's ceremony page on the realm's issuer: <issuer>/ui/interaction/<the interaction id>"
        Cache-Control: no-store

  step_continues.provider_error:
    type: final
    title: Bring an error the provider answered, or an answer that failed, back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with the reason provider_error (#1081), or with invalid_response,
      verification_refused or method_fault (#1106), and the upstream step's error is provider_error.
    redirect: never
    response: *providerErrorStep

  step_continues.provider_unavailable:
    type: final
    title: Bring a provider that could not be reached back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with the reason upstream_unavailable, and the upstream step's error is
      provider_unavailable (#1106).
    redirect: never
    response: *providerErrorStep

  # Exits: the sign-in's own refusals, on the ceremony page (#1106)

  step_continues.unknown_identity:
    type: final
    title: Bring a proof that signs nobody in back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with its reason: issuer_mismatch, credential_disabled, or the engine's own, such
      as a disabled account. The upstream step's error is unknown_identity whatever the reason, the same for every
      account (ADR-017 Decision 4): the person learns nothing of an account they have not proved. Nobody signs in,
      nothing is created and nothing goes to the client.
    redirect: never
    source: apps/auth-server/src/app/helpers/interaction-outcomes.ts:102
    response: *providerErrorStep

  step_continues.too_many_requests:
    type: final
    title: Bring a throttled callback back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with the reason throttled, and the upstream step's error is too_many_requests.
      The 303 carries no Retry-After: the page says the sign-in was held back.
    redirect: never
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1249
    response: *providerErrorStep

  step_continues.service_unavailable:
    type: final
    title: Bring a callback a store could not answer back to the ceremony page
    description: >-
      user.sign_in_failed is recorded with the reason unavailable, and the upstream step's error is
      service_unavailable. A refused step the interaction store cannot take either gets the auth server's error page.
    redirect: never
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:872
    response: *providerErrorStep

  step_continues.transaction_ended:
    type: final
    title: Start the sign-in again at its first round
    description: >-
      The engine ended its sign-in transaction (it outlived its age, or the provider proved another account than the
      one it named) and recorded user.sign_in_failed with its reason. The interaction goes back to the sign-in's first
      round, with a new transaction for what the request asked for, no error and a restart notice that names no
      account, as an answer's restart does (#1081). Nobody signs in, and nothing goes to the client.
    redirect: never
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1234
    response: *providerErrorStep

  provider_error.declined:
    type: final
    title: Show the provider-error page for a cancel at the provider, on the pages
    description: >-
      user.sign_in_failed is recorded with the reason declined. Nothing goes to the client: the person has not refused
      the client's request, and may pick another way. Only the pages show it (INTERACTION_UI_ENABLED off), until the
      cut-over (#709).
    redirect: never
    response: &providerErrorPage
      status: 200
      headers:
        Content-Type: text/html; charset=utf-8
        Cache-Control: no-store
      body: >-
        "Sign-in was not completed": the provider did not sign the person in, with "Choose another way to sign in", a
        link to the first sign-in step

  provider_error.provider_error:
    type: final
    title: Show the provider-error page for an error the provider answered, on the pages
    description: user.sign_in_failed is recorded with the reason provider_error.
    redirect: never
    response: *providerErrorPage

  # Exits: a callback with no interaction left, in a realm that names its ceremony app's error page (#1106)

  error_page.transaction_mismatch:
    type: final
    title: Send a callback with no pending sign-in for this browser to the realm's error page
    description: >-
      user.sign_in_failed is recorded with the reason transaction_mismatch. No code is redeemed and no account is
      created. The ceremony app shows its page; the auth server renders none.
    redirect: never
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:899
    response: &errorPageRedirect
      status: 303
      headers:
        Location: "<issuer><the realm's ceremonyApp.errorPage>?code=interaction_expired&trace_id=<the request id>"
        Cache-Control: no-store

  error_page.interaction_expired:
    type: final
    title: Send a callback whose interaction expired or moved on to the realm's error page
    description: user.sign_in_failed is recorded with the reason interaction_expired. Nobody signs in.
    redirect: never
    response: *errorPageRedirect

  # Exits: refusals on the pages, or with no interaction left and no error page, all with the one error page

  bad_request.upstream_unavailable:
    type: final
    title: Refuse a provider that is off or cannot start
    description: user.sign_in_failed is recorded with the reason upstream_unavailable.
    redirect: never
    response: &errorPage
      status: 400
      headers:
        Content-Type: text/html; charset=utf-8
        Cache-Control: no-store
      body: '"We could not sign you in", the same text for every failure, and the trace id: the request id'

  bad_request.transaction_mismatch:
    type: final
    title: Refuse a callback with no pending sign-in for this browser, in a realm that names no error page
    description: >-
      user.sign_in_failed is recorded with the reason transaction_mismatch. No code is redeemed and no account is
      created.
    redirect: never
    response: *errorPage

  bad_request.invalid_response:
    type: final
    title: Refuse an answer of the provider that fails a check, on the pages
    description: >-
      user.sign_in_failed is recorded with the method's reason: invalid_response, upstream_unavailable or
      verification_refused.
    redirect: never
    response: *errorPage

  bad_request.method_fault:
    type: final
    title: Refuse the answer of a method that broke the contract, on the pages
    description: user.sign_in_failed is recorded with the reason method_fault.
    redirect: never
    response: *errorPage

  bad_request.issuer_mismatch:
    type: final
    title: Refuse a known sub under another issuer, on the pages
    description: user.sign_in_failed is recorded with the reason issuer_mismatch and the credential's user.
    redirect: never
    response: *errorPage

  bad_request.credential_disabled:
    type: final
    title: Refuse a disabled credential, on the pages
    description: user.sign_in_failed is recorded with the reason credential_disabled.
    redirect: never
    response: *errorPage

  bad_request.sign_up_disabled:
    type: final
    title: Refuse an unknown identity in a realm that does not allow sign-up
    description: user.sign_in_failed is recorded with the reason sign_up_disabled. No account is created.
    redirect: never
    response: *errorPage

  bad_request.verification_unavailable:
    type: final
    title: Refuse a new account nobody could verify
    description: user.sign_in_failed is recorded with the reason verification_unavailable. No account is created.
    redirect: never
    response: *errorPage

  bad_request.refused:
    type: final
    title: Refuse a proof the engine refuses, on the pages
    description: >-
      The engine records user.sign_in_failed with its own reason, transaction_ended among them: a transaction the
      engine ended is refused here, and started again only on the ceremony page.
    redirect: never
    response: *errorPage

  bad_request.step_not_available:
    type: final
    title: Refuse a sign-in the pages cannot finish
    description: >-
      user.sign_in_failed is recorded with the reason step_not_available. The account's passkey, or QAuth's own
      verification, is asked only on the ceremony page.
    redirect: never
    response: *errorPage

  bad_request.unavailable:
    type: final
    title: Refuse the callback when a store cannot answer, on the pages
    description: user.sign_in_failed is recorded with the reason unavailable.
    redirect: never
    response: *errorPage

  bad_request.throttled:
    type: final
    title: Refuse a throttled callback, on the pages
    description: user.sign_in_failed is recorded with the reason throttled.
    redirect: never
    response: *errorPage

  bad_request.interaction_expired:
    type: final
    title: Refuse a callback whose interaction expired or moved on
    description: >-
      user.sign_in_failed is recorded with the reason interaction_expired. On the ceremony page only in a realm that
      names no error page.
    redirect: never
    response: *errorPage

  server_error.store:
    type: final
    title: Fail on a database error
    redirect: never
    response:
      status: 500
      body: the error handler's problem document, with the trace id

  abandoned:
    type: final
    title: The person did not come back
    description: The pending sign-in expires after ten minutes, and the interaction with it.
    leavesPage: true

assertions:
  - id: only-the-starting-browser-signs-in
    never: 'signedIn and notTheStartingBrowser'
    say: >-
      A callback replayed in another browser, forwarded or forged never signs anyone in, and never takes the pending
      sign-in
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:927
  - id: a-foreign-callback-spends-nothing
    never: 'pendingTaken and notTheStartingBrowser'
    say: 'Only the browser whose flow cookie the start bound takes the pending sign-in'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:932
  - id: no-account-without-sign-up
    never: 'accountCreated and signUpOff'
    say: 'An unknown identity creates an account only in a realm that allows sign-up'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:596
  - id: no-account-that-could-never-sign-in
    never: 'accountCreated and cannotVerify'
    say: >-
      A new account the provider does not vouch for is created only where QAuth can verify its address: on the
      ceremony page, with an address
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:601
  - id: no-subject-without-its-issuer
    never: '(accountCreated or signedIn) and issuerMissing'
    say: 'An identity that names no issuer neither creates an account nor signs in'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:515
  - id: no-account-for-a-known-identity
    never: 'accountCreated and knownCredential'
    say: 'A known credential signs its own user in; it never creates a second account'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:573
  - id: an-issuer-change-never-signs-in
    never: 'signedIn and knownCredential and issuerDiffers'
    say: 'A credential signs in only under the issuer it was created with'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:561
  - id: a-passkey-is-never-skipped
    never: "signedIn and furtherStep == 'passkey'"
    say: >-
      An account that holds a passkey is not signed in by the provider alone, whatever the MFA policy: the passkey
      ranks above an upstream sign-in
    source: libs/server/sign-in-engine/src/lib/factors.ts:26
  - id: a-cancel-is-not-a-failure
    never: "(state == 'provider_error.declined' or state == 'step_continues.provider_declined') and not personDeclined"
    say: 'Only a cancel at the provider shows the cancel page, or the ceremony page with provider_declined'
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:965
  - id: the-ceremony-page-gets-every-live-refusal
    never: >-
      not pagesMode and state in ['bad_request.invalid_response', 'bad_request.method_fault',
      'bad_request.issuer_mismatch', 'bad_request.credential_disabled', 'bad_request.refused', 'bad_request.unavailable',
      'bad_request.throttled', 'bad_request.step_not_available']
    say: >-
      On the ceremony page every refusal of a callback whose interaction is still live goes back to it as the upstream
      step's error, with the callback's trace id; the auth server shows a page of its own there only when no
      interaction is left (#1106)
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1018
  - id: the-error-page-only-where-the-realm-names-it
    never: >-
      (not errorPageNamed and state in ['error_page.transaction_mismatch', 'error_page.interaction_expired']) or
      (errorPageNamed and state == 'bad_request.transaction_mismatch') or (errorPageNamed and not pagesMode and state
      == 'bad_request.interaction_expired')
    say: >-
      A callback with no interaction left goes to the ceremony app's error page exactly when the realm names one, and
      to the auth server's own error page otherwise (#1106)
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:899
  - id: a-refused-step-signs-nobody-in
    never: >-
      (signedIn or accountCreated) and state in ['step_continues.unknown_identity', 'step_continues.too_many_requests',
      'step_continues.service_unavailable', 'step_continues.provider_unavailable', 'step_continues.provider_error',
      'step_continues.provider_declined', 'step_continues.transaction_ended']
    say: 'A refusal that goes back to the ceremony page signs nobody in and creates no account'
  - id: the-ceremony-page-shows-a-provider-refusal-itself
    never: "(state == 'provider_error.declined' or state == 'provider_error.provider_error') and not pagesMode"
    say: >-
      On the ceremony page a cancel or an error at the provider comes back as the upstream step's error: the auth
      server's own provider-error page is the pages' alone (#1081)
    source: apps/auth-server/src/app/helpers/upstream-sign-in.ts:1041
