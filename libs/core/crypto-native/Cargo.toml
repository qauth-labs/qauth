[package]
name = "qauth-crypto-native"
version = "0.0.0"
edition = "2021"
publish = false
# Matches the workspace licence. Required so `cargo deny check licenses` can
# evaluate the FULL graph (an unlicensed root fails the gate) — #277.
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs bindings for the Node addon surface.
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
# aws-lc-rs ML-DSA-65 (FIPS 204). 1.18 moved ML-DSA from the `unstable` module
# into `aws_lc_rs::signature`, so the `unstable` feature is no longer enabled.
# EXACT-pinned: a young PQC API on the signing path — upgrade only deliberately.
aws-lc-rs = { version = "=1.18.2" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
