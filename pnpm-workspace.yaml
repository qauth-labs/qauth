packages:
  - 'libs/**'
  - 'apps/**'
# pnpm 11 defaults `verifyDepsBeforeRun` to "install": before any script/`pnpm exec`
# it auto-installs when node_modules looks out of sync, and that reconcile can prune
# devDeps — which needs a modules-dir purge. In non-TTY contexts (the husky pre-commit
# hook, CI) the purge aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY. "warn"
# keeps the "node_modules out of sync — run pnpm install" heads-up without ever
# auto-installing or failing in non-interactive runs. (This setting is read from
# pnpm-workspace.yaml in pnpm 11, not .npmrc.)
verifyDepsBeforeRun: warn
onlyBuiltDependencies:
  - '@swc/core'
  - 'esbuild'
  - 'nx'
  - 'protobufjs'
  - 'ssh2'
  - 'unrs-resolver'
# Security floors for vulnerable transitive deps with no parent fix available
# (mostly dev tooling). Direct runtime deps are bumped in the catalog instead.
# Each entry maps to a Dependabot/`pnpm audit` finding — prune once it clears.
overrides:
  '@tanstack/start-server-core': '>=1.167.30'
  # @fastify/static reaches the tree only via @fastify/swagger-ui, which pins
  # '^9.1.2' — including on its own latest (6.1.0), so bumping the parent does
  # NOT clear this. The 9.x line ends at 9.3.0 with no backport, so the caret
  # major jump is the only route to the CVE-2026-15074 / CVE-2026-7120 fixes
  # (patched 10.1.1 / 10.1.2). Caret, not '>=': v10's one breaking change is the
  # `setHeaders` signature, exactly the kind of thing a v11 could move again.
  # swagger-ui registers static with only { root, prefix, decorateReply: false }
  # and never passes setHeaders, so the break does not reach us.
  '@fastify/static': '^10.1.2'
  axios: '>=1.18.0'
  # Reaches the tree only via @nx/react's express dependency (dev tooling); the
  # auth server does not use express. Floored to keep `pnpm audit` clean.
  body-parser: '>=1.20.6 <2'
  # Deliberately blanket rather than per-major, unlike the other floors here.
  # CVE-2026-13149 alone would be satisfied by 1.1.16 / 2.1.2 / 5.0.7 on their
  # respective lines, but GHSA-mh99-v99m-4gvg (OOM via unbounded expansion) has
  # vulnerable range `<=5.0.7` — which by semver covers the whole 1.x and 2.x
  # lines too — and is patched ONLY in 5.0.8. So there is no in-major fix for
  # the 1.x/2.x consumers (minimatch@3, minimatch@5) and everything has to move
  # to 5.x. Safe here: the module's surface is the single expand() function,
  # unchanged across these majors, and the full suite passes on it.
  brace-expansion: '>=5.0.8'
  esbuild: '>=0.28.1'
  # Both host-confusion advisories (CVE-2026-13676, CVE-2026-16221). Inert today
  # — main.ts sets a global Zod validator compiler so ajv never parses a request,
  # and redirect_uri matching is an exact string comparison with no URI parser in
  # the decision — but floored so that stops being load-bearing. Upper-bounded
  # because a bare '>=3.1.4' resolves to 4.x, turning a security floor into an
  # unreviewed major; same reasoning as h3 below.
  fast-uri: '>=3.1.4 <4'
  # Fastify's router. CVE-2026-47219 is HTTP/2-only and we serve HTTP/1.1, so
  # this is a floor against a future http2 switch, not a live fix.
  find-my-way: '>=9.7.0'
  form-data: '>=4.0.6'
  # h3's only consumers are the Nitro v2 subtree (nitropack/listhen/unstorage),
  # which require h3 1.x (Nitro v2 imports `send`, removed in h3 2.x). Floor at
  # the patched 1.x line — 1.15.11 clears GHSA-4hxc-9384-m385 (fixed in 1.15.9).
  # The earlier `>=2.0.1` floor was inert (nothing pulled h3) and would force
  # the wrong major onto Nitro. Revisit if anything ever needs h3 2.x.
  h3: '^1.15.11'
  # Raised from the earlier '>=4.1.2' floor, which sat BELOW the fix for
  # CVE-2026-59869 (patched 4.3.0) and so left resolution free to pick a still
  # vulnerable 4.1.x/4.2.x.
  js-yaml: '>=4.3.0 <5'
  postcss: '>=8.5.18'
  # Reaches the tree only through dockerode -> testcontainers (devDependency of
  # @qauth-labs/shared-testing), so this is a floor for board hygiene rather
  # than a shipped fix.
  protobufjs: '>=7.6.5 <8'
  svgo: '>=3.3.4 <4'
  # Build-time only: @mapbox/node-pre-gyp -> @vercel/nft -> nitropack, i.e. the
  # developer-portal build, and excluded from the auth-server image by
  # `pnpm deploy --prod`. Every advisory here needs a hostile archive to parse
  # and QAuth parses none, so the floor clears the board without shipping a fix.
  tar: '>=7.5.21'
  tmp: '>=0.2.7'
  # Dedupe commitlint's loose TS resolution onto the workspace TS; cap <6.1 to
  # stay within typescript-eslint@8's `typescript <6.1.0` peer range.
  typescript: '~6.0.3'
  uuid: '>=11.1.1'
catalog:
  '@commitlint/cli': '^21.2.1'
  '@commitlint/config-conventional': '^21.2.0'
  '@eslint/js': '^10.0.1'
  '@nx/esbuild': '23.1.0'
  '@nx/eslint': '23.1.0'
  '@nx/eslint-plugin': '23.1.0'
  '@nx/js': '23.1.0'
  '@nx/node': '23.1.0'
  '@nx/vitest': '23.1.0'
  # Pure-TS FIPS 204 (ML-DSA) signing backend for the PQC roadmap (ADR-005,
  # #243). EXACT pin (pre-1.0 signing-path dependency): security fixes do NOT
  # flow automatically — upgrade only via a deliberate, reviewed bump.
  '@noble/post-quantum': '0.6.1'
  '@swc-node/register': '~1.12.1'
  '@swc/core': '~1.15.46'
  '@swc/helpers': '~0.5.23'
  '@tanstack/nitro-v2-vite-plugin': '^1.155.0'
  # Keep the Start/Router suite in lockstep: react-start 1.168.32 pins exact
  # tanstack deps including start-server-core 1.169.17 (clears the '>=1.167.30'
  # security floor in `overrides`) and react-router 1.170.18. Mismatched lines
  # load two router-cores and crash SSR dehydrate, so bump these together.
  '@tanstack/react-start': '^1.168.32'
  '@tanstack/react-router': '^1.170.18'
  '@types/node': '^26.1.1'
  '@types/nodemailer': '^8.0.1'
  '@types/pg': '^8.20.0'
  '@types/react': '^19.2.17'
  '@types/react-dom': '^19.2.3'
  '@types/supertest': '^7.2.1'
  '@types/zxcvbn': '^4.4.5'
  '@vitest/coverage-v8': '^4.1.10'
  '@vitest/ui': '^4.1.10'
  drizzle-kit: '^0.31.10'
  esbuild: '^0.28.1'
  eslint: '^10.8.0'
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-import: '^2.32.0'
  eslint-plugin-jsx-a11y: '^6.10.2'
  eslint-plugin-prettier: '^5.5.6'
  eslint-plugin-react: '^7.37.5'
  eslint-plugin-react-hooks: '^7.1.1'
  eslint-plugin-simple-import-sort: '^14.0.0'
  husky: '^9.1.7'
  lint-staged: '^17.2.0'
  nx: '23.1.0'
  prettier: '^3.9.6'
  prettier-plugin-tailwindcss: '^0.8.1'
  supertest: '^7.2.2'
  tslib: '^2.8.1'
  tsx: '^4.23.1'
  typescript: '~6.0.3'
  typescript-eslint: '^8.65.0'
  vitest: '^4.1.10'
  '@fastify/autoload': '^6.4.0'
  '@fastify/cors': '^11.3.0'
  '@fastify/formbody': '^8.0.2'
  '@fastify/helmet': '^13.1.0'
  '@fastify/rate-limit': '^11.1.0'
  '@fastify/swagger': '^9.8.1'
  '@fastify/swagger-ui': '^6.1.0'
  '@node-rs/argon2': '^2.0.2'
  '@react-email/render': '^2.1.0'
  dotenv: '^17.4.2'
  drizzle-orm: '^0.45.2'
  drizzle-seed: '^0.3.1'
  fastify: '^5.10.0'
  fastify-plugin: '^6.0.0'
  fastify-type-provider-zod: '^7.0.0'
  ioredis: '^5.11.1'
  jose: '^6.2.4'
  nodemailer: '^9.0.3'
  pg: '^8.22.0'
  pino-pretty: '^13.1.3'
  prom-client: '^15.1.3'
  react: '^19.2.8'
  react-dom: '^19.2.8'
  resend: '^6.18.0'
  zod: '^4.4.3'
  zxcvbn: '^4.4.2'
  vite: '8.1.5'
  '@vitejs/plugin-react': '6.0.4'
  '@nx/vite': '23.1.0'
  '@nx/web': '23.1.0'
  jiti: '^2.7.0'
  jsdom: '^29.1.1'
  tailwindcss: '^4.3.3'
  '@tailwindcss/vite': '^4.3.3'
  '@nx/react': '23.1.0'
  tailwind-merge: '^3.6.0'
  clsx: '^2.1.1'
  class-variance-authority: '^0.7.1'
  # docs.qauth.dev (Astro + Starlight, #347). Pinned exact — this pairing is
  # deliberate (Starlight 0.41 requires Astro ^7.0.2 and dropped Astro 6
  # support), so a routine catalog bump must move both together, not drift
  # independently. Astro 7's own `vite` dependency is `^8.0.13`, matching the
  # workspace's existing `vite: 8.1.5` — no second Vite line introduced.
  astro: '7.1.3'
  '@astrojs/starlight': '0.41.4'
  # `astro check` (Task 1 fix round 1, #347) — the real type-checking story
  # for an Astro project: it type-checks `.astro` and MDX content through
  # Astro's own language server, which `tsc --emitDeclarationOnly` (the
  # @nx/js/typescript-inferred default) never does and which trips on
  # Starlight's `docsSchema()` / Zod v4 combination under declaration-emit
  # strictness for an unrelated reason. Peer `typescript: ^5.0.0 || ^6.0.0`
  # matches the workspace's pinned `typescript: ~6.0.3`.
  '@astrojs/check': '0.9.9'
  # Task 5 fix round 1 (#351): the docs-site invariants need to compute the
  # SAME heading-anchor slug Astro's own markdown pipeline produces, not an
  # approximation of it. `astro` (via `@astrojs/markdown-remark` /
  # `@astrojs/markdown-satteri`) already depends on `github-slugger` at
  # exactly this version — pinned to match rather than left to range
  # resolution, so the guard can never silently drift onto a second,
  # differently-behaved copy of the same algorithm.
  github-slugger: '2.0.0'
# pnpm 11 requires an explicit build decision per dependency with a postinstall
# script (it no longer infers them from onlyBuiltDependencies). Mirror the
# approved set; cpu-features is an optional ssh2 native accel we don't build.
allowBuilds:
  # Nitro's dev file-watcher; ships prebuilt binaries, so skip the native build.
  '@parcel/watcher': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  nx: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
